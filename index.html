<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magá">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Início</title>
<!--
  Data-free shell for the dashboard — the landing page. Same pattern as
  every other page here: hosted on public GitHub Pages, holds NO keys and
  NO data, asks for the shared passphrase, then talks only to the gated
  Supabase Edge Function (maga-api) — which in this page's case means
  only the login round trip itself, since the dashboard shows module tiles
  and nothing live.

  Deliberately module tiles only, no live data, to start (the user's own
  call when this page was planned) — a quick summary per module was always
  flagged as the reasonable next step once there was something worth
  summarizing. Phase 4 of the app audit is that: five tiles (tarefas,
  compras, eventos, estoque, financeiro — the modules that accumulate
  state day to day, not the reference catalogues) grow a second, small
  line fetched from `dashboard_summary` after the tile grid itself has
  already painted. Deliberately non-blocking and best-effort: this call
  is enrichment on a landing page, never the reason the page fails to
  load, so any failure other than an expired session (network hiccup, or
  simply an older `maga-api` deploy that doesn't know this action yet)
  just leaves the five tiles as plain navigation, exactly as before.

  This page took over `index.html` from the daily-task checklist, which
  moved to `tarefas.html` — deliberately with NO redirect stub at the old
  name, so a stale bookmark to "index.html" now lands here instead of on
  tasks, which is a one-time surprise rather than a redirect to maintain
  forever.
-->
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-page.css">
<link rel="stylesheet" href="shared-menu.css">
<style>
  /* ---- page chrome (header/.hleft/h1) now lives in shared-page.css —
     see that file for what moved and why.

     body/.wrap are the one thing NOT taken from shared-page.css as-is:
     this page has no `.page` wrapper at all, and its `.wrap` has always
     carried its OWN full padding (24px bottom, not shared-page.css's
     32px) rather than splitting it between body and .wrap the way
     notas.html/preferencias.html do. Loading shared-page.css's `body`
     padding rule on top of that would double the gutters (body padding
     PLUS .wrap's own), so it's zeroed back out here — `.wrap` keeps
     doing 100% of the work, same as before this migration. */
  body{padding:0}
  .wrap{
    flex:1 0 auto;
    padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .group-head{margin:22px 0 10px}
  .group-head:first-of-type{margin-top:14px}
  .group-head h2{font-size:15px;font-weight:700;margin:0;color:var(--text)}
  .group-head p{font-size:12.5px;color:var(--muted);line-height:1.4;margin:3px 0 0}

  /* The landing page carries the brand large and centred — the one place
     the full badge (rings + "Cozinha Artesanal") is big enough to read.
     Every other page uses the same asset small, right-aligned in the
     header (.brand-mark in shared-menu.css). */
  .brand-hero{display:flex;justify-content:center;margin:14px 0 22px}
  .brand-hero img{width:min(184px,48vw);height:auto;display:block}

  .tiles{
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  }
  .tile{
    display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:18px 16px;text-decoration:none;color:var(--text);
    transition:background-color .15s ease,transform .1s ease,border-color .15s ease;
  }
  .tile:hover{background:rgba(127,127,127,.06);border-color:var(--border-strong)}
  .tile:active{transform:scale(.98)}
  .tile .emoji{font-size:28px;line-height:1}
  .tile .label{font-size:15px;font-weight:650}
  .tile .desc{font-size:12px;color:var(--muted);line-height:1.35;margin:0}
  /* Filled in best-effort by loadStats() once dashboard_summary answers —
     starts hidden (not empty text) so a slow/failed fetch leaves the tile
     exactly as it always looked, no empty gap held open for it. */
  .tile .tile-stat{font-size:11.5px;font-weight:650;color:var(--muted);margin:2px 0 0}
  .tile .tile-stat.warn{color:var(--danger)}
</style>
</head>
<body>
<div id="root" class="wrap"><p class="msg">Carregando…</p></div>

<script>
const root = document.getElementById("root");

const PAGE_LOGIN = {
  title: "Entrar",
  subtitle: "Faça o seu login para acessar.",
  onSuccess: () => render(),
};
</script>
<script src="shared-api.js"></script>
<script src="shared-format.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-nav.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-pwa.js"></script>
<script>

const CURRENT_PAGE = "home";

// The dashboard shows the same destinations as the hamburger menu, in the
// same order and under the same group headings (MENU_ITEMS/
// MENU_GROUPS in shared-menu.js are the single source for both) — they are
// two ways to reach one list, not competing navigations. `home` is
// excluded: this page IS home. Only the one-line description is dashboard-
// specific, so that is all this table holds.
const TILE_DESC = {
  preferencias: "Ajustes da sua conta",
  hoje: "Resumo da manhã",
  tarefas: "Ações pendentes",
  notas: "Cadernos e notas",
  compras: "Listas de compras",
  estoque: "O que tem no armário",
  insumos: "Catálogo de códigos de barras",
  ingredientes: "O que cada insumo É",
  receitas: "Fichas técnicas e custos",
  produtos: "Itens à venda e preços",
  eventos: "Encomendas e vendas",
  clientes: "Quem compra",
  fornecedores: "Quem fornece",
  financeiro: "Custos e receitas",
};

// One short line per group saying what the group is FOR. The production
// chain in particular only makes sense read in order, and nothing on this
// page said so before.
const GROUP_HINT = {
  dia: "O que precisa de atenção hoje.",
  producao: "Insumos viram receitas, receitas viram produtos com preço.",
  negocio: "O que sai daqui: encomendas, contatos e dinheiro.",
  conta: "Como o assistente se comporta para esta conta.",
};

// The five modules that accumulate state day to day — the ones worth a
// live stat. Reference catalogues (insumos/receitas/produtos/
// fornecedores/clientes) and notas have no single number that means
// "needs attention", so they stay plain navigation.
const STAT_PAGES = ["tarefas", "compras", "eventos", "estoque", "financeiro"];

function render(){
  let lastGroup = null;
  let body = "";
  // visibleMenuItems() (shared-menu.js) drops the "dia" group (Hoje,
  // Tarefas) while looking at a non-default environment - see its comment
  // and isDefaultEnv() in shared-api.js. Same source the drawer reads, so
  // the tiles and the hamburger menu can't disagree about what's on screen.
  visibleMenuItems().forEach(item => {
    if(item.page === "home") return;
    if(item.group !== lastGroup){
      if(lastGroup !== null) body += '</div>';
      body += '<div class="group-head"><h2>' + esc(MENU_GROUPS[item.group]) + '</h2>' +
        (GROUP_HINT[item.group] ? '<p>' + esc(GROUP_HINT[item.group]) + '</p>' : '') +
      '</div><div class="tiles">';
      lastGroup = item.group;
    }
    body += '<a class="tile" href="' + item.href + '" data-page="' + item.page + '">' +
      '<span class="emoji">' + item.emoji + '</span>' +
      '<span class="label">' + esc(item.label) + '</span>' +
      '<p class="desc">' + esc(TILE_DESC[item.page] || "") + '</p>' +
      (STAT_PAGES.indexOf(item.page) !== -1 ? '<p class="tile-stat" hidden></p>' : '') +
    '</a>';
  });
  if(lastGroup !== null) body += '</div>';

  // Deliberately NOT navHeader(): every other page's header ends in a
  // small .brand-mark logo, but this page already carries the full badge
  // large and centred in .brand-hero right below — a second, smaller copy
  // in the header itself would just be a redundant logo. shared-nav.js's
  // navHeader() always appends .brand-mark, so this page keeps hand-
  // building its own top row (same markup shared-page.css's header/.hleft/
  // h1 rules already style) and only reuses wireNav() for the menu button.
  root.innerHTML =
    '<header><div class="hleft">' +
      '<button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>' +
      '<h1>Início</h1>' +
    '</div></header>' +
    '<div class="brand-hero"><img src="assets/logo-badge.svg" alt="Magá — Cozinha Artesanal"></div>' +
    body;
  wireNav();
  loadStats();
}

// Fetches the five tiles' live stats and patches them in. Never blocks or
// replaces the tile grid render() already painted: an unauthorized
// response bounces to login (the session really did expire, same as any
// other api() call), but anything else — a network hiccup, or simply an
// `maga-api` deploy that predates this action and answers 400 "bad
// action" — is swallowed here. This is the one api() call in the whole
// app deliberately NOT routed through handleAuthError's generic branch,
// since that replaces the whole page with an error+retry screen, which is
// right for a page whose only content IS that data and wrong for a
// decorative line on five otherwise-fully-functional nav tiles.
async function loadStats(){
  let s;
  try{ s = await api("dashboard_summary"); }
  catch(err){
    if(err.unauthorized) handleAuthError(err, loadStats);
    return;
  }
  setStat("tarefas", tarefasStat(s.tarefas));
  setStat("compras", comprasStat(s.compras));
  setStat("eventos", eventosStat(s.eventos));
  setStat("estoque", estoqueStat(s.estoque));
  setStat("financeiro", financeiroStat(s.financeiro));
}

function setStat(page, stat){
  if(!stat) return;
  const el = root.querySelector('.tile[data-page="' + page + '"] .tile-stat');
  if(!el) return;
  el.textContent = stat.text;
  el.hidden = false;
  if(stat.warn) el.classList.add("warn");
}

function tarefasStat(t){
  if(!t) return null;
  if(t.pending_count === 0) return { text: "Nada pendente", warn: false };
  const parts = [t.pending_count + (t.pending_count === 1 ? " pendente" : " pendentes")];
  if(t.overdue_count > 0){
    parts.push(t.overdue_count + (t.overdue_count === 1 ? " atrasada" : " atrasadas"));
  }
  return { text: parts.join(" · "), warn: t.overdue_count > 0 };
}

function comprasStat(c){
  if(!c) return null;
  if(c.items_open === 0) return { text: c.lists_count > 0 ? "Nada pendente" : "Nenhuma lista", warn: false };
  return { text: c.items_open + (c.items_open === 1 ? " item para comprar" : " itens para comprar"), warn: false };
}

function eventosStat(e){
  if(!e) return null;
  if(e.active_count === 0) return { text: "Nenhum em andamento", warn: false };
  let text = e.active_count + " em andamento";
  if(e.next) text += " · próximo " + ddmm(e.next.event_date);
  return { text, warn: false };
}

function estoqueStat(s){
  if(!s) return null;
  if(s.out_of_stock_count === 0) return { text: "Tudo em estoque", warn: false };
  return { text: s.out_of_stock_count + (s.out_of_stock_count === 1 ? " item em falta" : " itens em falta"), warn: true };
}

function financeiroStat(f){
  if(!f) return null;
  return { text: "Saldo do mês: " + fmtMoney(f.month_saldo), warn: f.month_saldo < 0 };
}

// A plain "DD/MM" from a YYYY-MM-DD string, with no Date object involved —
// event_date has no time component, so parsing it as a Date and formatting
// back with toLocaleDateString risks the UTC-midnight-vs-America/Sao_Paulo
// off-by-one-day shift documented on eventos.html's own fmtEventDate.
function ddmm(dateStr){
  const parts = String(dateStr || "").split("-");
  return parts.length === 3 ? (parts[2] + "/" + parts[1]) : "";
}

// The configured "Página inicial" (Preferências → Aplicativo, phase 3 of
// the preferences plan) - this is the one place that actually consumes it.
// index.html is where every "go home" link in the app points (every page's
// brand-mark, every error-state "Voltar ao início"), so honouring the
// landing page here means those links now genuinely go "home" to wherever
// the account configured, not just back to the tile dashboard.
//
// Escape hatch: without ?dash=1, the drawer's own "Home" entry would point
// right back at whatever landing page it's trying to let someone bypass -
// unreachable the moment a landing page other than "home" is set. Only that
// one link carries it (see shared-menu.js's MENU_ITEMS "home" href); every
// other index.html link deliberately does not, since those are meant to
// respect the configured landing page like everywhere else.
function redirectToLandingPage(){
  if(new URLSearchParams(location.search).get("dash") === "1") return false;
  const target = currentEnvPrefs().landingPage;
  if(!target || target === "home") return false; // nothing configured, or explicitly the dashboard itself
  const item = MENU_ITEMS.find(i => i.page === target);
  if(!item) return false; // an unknown/stale page key - fall back to the dashboard rather than a dead link
  location.replace(item.href);
  return true;
}

if(!getPass()){ showLogin(); }
else if(!redirectToLandingPage()){ render(); }
</script>
</body>
</html>
