<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarefas">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Tarefas pendentes</title>
<!--
  Data-free shell for the daily-summary checklist. Hosted on public GitHub
  Pages. It contains NO keys and NO data: it asks for a passphrase and then
  talks only to the gated Supabase Edge Function (maga-api), which holds
  the service-role key and enforces the passphrase server-side. Without the
  passphrase, all anyone sees here is a login box.

  Renamed from index.html — this repo's original single page — when the
  dashboard took over that filename. No redirect stub at the old name, per
  the user's explicit choice.
-->
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-menu.css">
<link rel="stylesheet" href="shared-modal.css">
<style>
  /* A flex column at least one viewport tall, so .bar (its last child)
     naturally sits at the bottom via normal layout flow instead of
     position:fixed -- fixed is pinned to the layout viewport, which
     visibly jumps on mobile Firefox/Safari when the address bar
     collapses/expands during scroll and resizes that viewport. */
  .page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .wrap{
    /* .page is a column-direction flex container, so width is .wrap's CROSS
       axis -- and .wrap's own left/right auto margins (the "margin:0 auto"
       below, there to center it once it hits max-width) disable
       align-items:stretch on that axis per the flexbox spec. Without an
       explicit width, .wrap fell back to shrink-to-fit/content-based sizing
       instead of stretching to .page's width, so an unshrinkable descendant
       (the add-row's fixed 40px date icon button) pushed it wider than the
       viewport -- a horizontal scrollbar and a slightly zoomed-out page on
       first load. width:100% (capped by max-width, same as before) restores
       "stretch to container, then center beyond 640px" explicitly. */
    flex:1 0 auto;width:100%;min-width:0;max-width:640px;margin:0 auto;
    padding:max(16px,env(safe-area-inset-top)) 16px 16px;
  }
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 16px}
  .hleft{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
  h1{font-size:20px;font-weight:650;margin:0;min-width:0;overflow-wrap:break-word}
  .row{display:flex;align-items:flex-start;gap:12px;padding:16px 14px;border-bottom:1px solid var(--border);transition:background-color .15s ease}
  .row:hover{background:rgba(127,127,127,.06)}
  .row:last-child{border-bottom:none}
  /* The checkbox is its own sibling now, not wrapped in a <label> around the
     whole row -- tapping the row body opens the edit modal (see .rowbody),
     so the two tap targets must be structurally separate, not nested. */
  input[type=checkbox]{width:24px;height:24px;margin:1px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
  .rowbody{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;cursor:pointer}
  .badge{font-size:20px;line-height:1.2;flex:none;width:26px;text-align:center}
  .body{min-width:0;flex:1}
  .body .txt{font-size:15px;line-height:1.35;margin:0;word-wrap:break-word}
  .body .meta{font-size:12px;color:var(--muted);margin:3px 0 0}
  .body .meta .due.overdue{color:var(--danger)}
  .star-btn{
    background:none;border:none;font-size:21px;line-height:1;padding:0;cursor:pointer;
    flex:none;color:var(--muted);min-width:40px;min-height:40px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:color .15s ease,background-color .15s ease,transform .1s ease;
  }
  .star-btn:hover{background:rgba(127,127,127,.15)}
  .star-btn:active{transform:scale(.9)}
  /* A stroke affects the two glyphs very differently, so they're NOT given
     the same weight: ☆'s outline is already thin lines, so any stroke at
     all reads as heavy-handed and was reported too thick -- left at the
     browser default. ★'s filled body barely shows a stroke at the same
     width, so it keeps a small one to look a touch bolder, per the same
     feedback. Gold, not var(--accent) -- "starred" reads as a universal
     gold star regardless of this app's own (red) brand accent. */
  .star-btn.important{color:#eab308;font-weight:900;-webkit-text-stroke:0.8px currentColor}
  .date-btn{
    background:none;border:none;color:var(--muted);font-size:19px;line-height:1;padding:0;cursor:pointer;
    flex:none;min-width:40px;min-height:40px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:filter .15s ease,background-color .15s ease,transform .1s ease;
    /* 📅 is a full-color emoji glyph -- CSS `color` (kept above for any
       platform that happens to fall back to a text-style glyph) has NO
       effect on a color emoji, so the button looked identically colored
       whether or not a date was set. `filter` is the one CSS lever that
       actually reaches a color emoji: grayscale+dim it here for "muted/
       unset", then clear the filter in .set below for the full-color icon
       once a date is picked. */
    filter:grayscale(1) opacity(.55);
  }
  .date-btn:hover{background:rgba(127,127,127,.15)}
  .date-btn:active{transform:scale(.9)}
  .date-btn.set{color:var(--accent);filter:none}
  /* Kept in the DOM (not display:none) so .showPicker()/.click() can still
     open the native date picker from the visible calendar icon button. */
  .visually-hidden-date{position:absolute;width:0;height:0;padding:0;border:0;opacity:0;pointer-events:none}
  .due-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .due-row input[type=date]{
    flex:1;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
  }
  .modal-actions .remove{margin-right:auto;background:none;color:var(--danger)}
  .modal-actions .remove:hover{background:rgba(220,38,38,.12)}
  .bar{
    position:sticky;bottom:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--bg);
    display:flex;justify-content:center;
  }
  .addrow{display:flex;gap:8px;padding:14px}
  .addrow input[type=text]{
    flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
  }
  .addrow button{
    flex:none;font:inherit;font-weight:600;font-size:14px;padding:10px 14px;border-radius:10px;
    border:none;background:var(--accent);color:var(--accent-text);cursor:pointer;
    transition:filter .15s ease,transform .1s ease;
  }
  .addrow button:hover:not(:disabled){filter:brightness(1.1)}
  .addrow button:active:not(:disabled){transform:scale(.97)}
  .addrow button:disabled{opacity:.5}
  .addcard{margin-bottom:12px}
  .icon-btn.lg{font-size:23px;padding:7px}
  /* The one dialog anywhere that wants its <select> full-width like a text
     input — shared-modal.css deliberately leaves .modal-card select narrow
     for the compact unit pickers elsewhere, so this page opts back in. */
  .modal-card select{width:100%;margin-bottom:14px}
  #done-wrap{margin-top:16px}
  #done-list{
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .3s ease,opacity .25s ease;
  }
  #done-list.open{opacity:1}
  .done-card{margin-bottom:8px}
  .body .txt.done{text-decoration:line-through;color:var(--muted)}
</style>
</head>
<body>
<div class="page">
  <div id="root" class="wrap"><p class="msg">Carregando…</p></div>
  <div class="bar" id="bar" style="display:none">
    <button class="primary" id="done-btn"><span>✓</span> <span id="btn-label">Concluir selecionados</span></button>
  </div>
</div>

<script>
const root = document.getElementById("root");
const bar = document.getElementById("bar");
const doneBtn = document.getElementById("done-btn");
const btnLabel = document.getElementById("btn-label");

const PAGE_LOGIN = {
  title: "Tarefas pendentes",
  subtitle: "Faça o seu login para acessar seu checklist.",
  onSuccess: () => load(),
  beforeShow: () => { bar.style.display = "none"; },
};
</script>
<script src="shared-api.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-format.js"></script>
<script src="shared-pwa.js"></script>
<script>

const SOURCE_META = {
  email:            { emoji:"📧", label:"E-mail" },
  whatsapp:         { emoji:"💬", label:"WhatsApp" },
  calendar:         { emoji:"📅", label:"Agenda" },
  self_instruction: { emoji:"🔔", label:"Instrução" },
  work:             { emoji:"💼", label:"Trabalho" },
  system:           { emoji:"⚙️", label:"Sistema" },
  manual:           { emoji:"📝", label:"Manual" }
};

const CURRENT_PAGE = "tarefas";

// Due-date display: "Hoje"/"Amanhã"/"Qua, 02 Set 26". Page-local -- no
// other page needs the today/tomorrow special-casing, so this doesn't
// belong in shared-format.js's fmtDate()/fmtDateTime() (see that file's own
// comment on why look-alike date formatters stay separate).
//
// due_date arrives as a bare "YYYY-MM-DD" (a Postgres `date`, no time/zone).
// `new Date("YYYY-MM-DD")` parses that as UTC midnight, which renders as the
// PREVIOUS day in any negative UTC offset (Brazil included) -- so this
// parses the parts by hand into a local-midnight Date instead.
function parseDateOnly(dateStr){
  const parts = String(dateStr).split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}
function startOfToday(){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}
function isOverdue(dateStr){
  return parseDateOnly(dateStr) < startOfToday();
}
const WEEKDAY_ABBR_PT = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MONTH_ABBR_PT = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
function fmtDueLabel(dateStr){
  const due = parseDateOnly(dateStr);
  const diffDays = Math.round((due - startOfToday()) / 86400000);
  if(diffDays === 0) return "Hoje";
  if(diffDays === 1) return "Amanhã";
  const dd = String(due.getDate()).padStart(2, "0");
  return WEEKDAY_ABBR_PT[due.getDay()] + ", " + dd + " " + MONTH_ABBR_PT[due.getMonth()] + " " +
    String(due.getFullYear()).slice(-2);
}

const DONE_PAGE_SIZE = 5;
let doneItems = [];
let doneOffset = 0;
let doneHasMore = false;
let doneLoading = false;
let doneObserver = null;
let doneExpanded = false;

function updateBar(){
  const n = document.querySelectorAll("#root input[data-id]:checked").length;
  doneBtn.disabled = n === 0;
  btnLabel.textContent = n === 0 ? "Concluir selecionados"
    : (n === 1 ? "Concluir 1 item" : "Concluir " + n + " itens");
}

// The pending list currently on screen, kept around so the star toggle can
// re-sort and redraw just that card in place (see redrawPendingCard())
// instead of a full load() round trip.
let currentRows = [];

// Same important-desc/due-date-asc-nulls-last/first_seen-asc order
// maga-api's own `list` action already returns rows in -- re-applied
// client-side after a star toggle so the redraw doesn't need a network
// round trip to know the new order.
function sortPendingRows(rows){
  return rows.slice().sort((a, b) => {
    const ai = a.important ? 1 : 0, bi = b.important ? 1 : 0;
    if(ai !== bi) return bi - ai;
    if(a.due_date !== b.due_date){
      if(a.due_date == null) return 1;
      if(b.due_date == null) return -1;
      return a.due_date < b.due_date ? -1 : 1;
    }
    return (a.first_seen || "").localeCompare(b.first_seen || "");
  });
}

function pendingRowsHtml(rows){
  return rows.map(it => {
    const m = SOURCE_META[it.source] || { emoji:"•", label: it.source || "" };
    const overdue = it.due_date ? isOverdue(it.due_date) : false;
    const dueHtml = it.due_date
      ? ' · <span class="due' + (overdue ? " overdue" : "") + '">📅 ' + esc(fmtDueLabel(it.due_date)) + '</span>'
      : '';
    return '<div class="row">' +
      '<input type="checkbox" data-id="' + esc(it.id) + '" aria-label="Concluir">' +
      '<div class="rowbody" data-open-id="' + esc(it.id) + '">' +
      '<span class="body"><p class="txt">' + esc(it.text) + '</p>' +
      '<p class="meta"><span class="src">' + m.emoji + ' ' + esc(m.label) + '</span>' + dueHtml + '</p></span>' +
      '</div>' +
      '<button class="star-btn' + (it.important ? " important" : "") + '" data-star-id="' + esc(it.id) + '" ' +
        'title="' + (it.important ? "Remover importância" : "Marcar como importante") + '" ' +
        'aria-label="Marcar como importante">' + (it.important ? "★" : "☆") + '</button>' +
      '</div>';
  }).join("");
}

function render(rows){
  // The done-tasks section always starts collapsed on a fresh render
  // (login, initial load, or after any create/edit/delete/done action).
  if(doneObserver){ doneObserver.disconnect(); doneObserver = null; }
  doneItems = [];
  doneOffset = 0;
  doneHasMore = false;
  doneExpanded = false;
  currentRows = rows;

  const header = '<header><div class="hleft">' +
    '<button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>' +
    '<h1>Tarefas pendentes</h1>' +
    '</div><img class="brand-mark" src="assets/logo-badge.svg" alt="Magá"></header>';
  const addForm = '<div class="card addcard"><div class="addrow">' +
    '<input type="text" id="new-text" placeholder="Nova ação..." />' +
    '<button type="button" class="date-btn" id="new-due-btn" ' +
      'title="Definir data de vencimento" aria-label="Definir data de vencimento">📅</button>' +
    '<input type="date" id="new-due-input" class="visually-hidden-date" tabindex="-1" aria-hidden="true">' +
    '<button id="add-btn">Adicionar</button>' +
    '</div></div>';
  const doneWrap = '<div id="done-wrap">' +
    '<button class="link" id="toggle-done">Ver ações concluídas</button>' +
    '<div id="done-list"></div>' +
    '</div>';
  if(rows.length === 0){
    root.innerHTML = header + addForm +
      '<p class="msg">🎉 Nenhuma ação pendente.</p>' + doneWrap;
    bar.style.display = "none";
    wireHeader();
    wireAddForm();
    wireDoneToggle();
    return;
  }
  root.innerHTML = header + addForm +
    '<div class="card" id="pending-card">' + pendingRowsHtml(rows) + '</div>' + doneWrap;
  bar.style.display = "flex";
  root.querySelectorAll("input[data-id]").forEach(cb => cb.addEventListener("change", updateBar));
  wireHeader();
  wireAddForm();
  wireRowOpen();
  wireStarButtons();
  wireDoneToggle();
  updateBar();
}

// Redraws only the pending-task card from currentRows -- used after a star
// toggle so importance changes (which reorder the list) don't need the
// full-page load()/"Carregando…" round trip every other mutating action on
// this page still uses. Preserves any checkboxes already ticked for the
// bulk-complete bar, since a full innerHTML replace would otherwise
// silently uncheck them.
function redrawPendingCard(){
  const card = document.getElementById("pending-card");
  if(!card) return;
  const checkedIds = new Set(
    Array.from(card.querySelectorAll("input[data-id]:checked")).map(cb => cb.dataset.id));
  card.innerHTML = pendingRowsHtml(currentRows);
  card.querySelectorAll("input[data-id]").forEach(cb => {
    cb.checked = checkedIds.has(cb.dataset.id);
    cb.addEventListener("change", updateBar);
  });
  wireRowOpen();
  wireStarButtons();
  updateBar();
}

function wireHeader(){
  wireMenuButton();
}

function wireAddForm(){
  const btn = document.getElementById("add-btn");
  const input = document.getElementById("new-text");
  const dateBtn = document.getElementById("new-due-btn");
  const dateInput = document.getElementById("new-due-input");
  if(!btn || !input) return;

  // Held in this closure only -- render() rebuilds the whole add form (and
  // this function re-runs) after every add, so the gray/colored icon
  // naturally resets for the next task with no manual clearing needed.
  let dueDate = null;

  if(dateBtn && dateInput){
    dateBtn.addEventListener("click", () => {
      if(dateInput.showPicker) dateInput.showPicker(); else dateInput.click();
    });
    dateInput.addEventListener("change", () => {
      dueDate = dateInput.value || null;
      dateBtn.classList.toggle("set", !!dueDate);
      dateBtn.title = dueDate ? ("Vencimento: " + fmtDueLabel(dueDate)) : "Definir data de vencimento";
    });
  }

  const submit = async () => {
    const text = input.value.trim();
    if(!text) return;
    btn.disabled = true;
    btn.textContent = "Salvando…";
    try{
      const body = { text };
      if(dueDate) body.due_date = dueDate;
      await api("action_create", body);
      await load();
    }catch(e){
      if(e.unauthorized){ handleAuthError(e, load); return; }
      btn.textContent = "Erro — tente de novo"; btn.disabled = false;
    }
  };
  btn.addEventListener("click", submit);
  input.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
}

async function saveEdit(id, patch){
  try{
    await api("action_edit", Object.assign({ id }, patch));
    await load();
  }catch(e){
    if(e.unauthorized){ handleAuthError(e, load); return; }
    alert("Não foi possível salvar.");
  }
}

function openEditModal(it){
  const optionsHtml = Object.keys(SOURCE_META).map(key => {
    const meta = SOURCE_META[key];
    return '<option value="' + key + '"' + (key === it.source ? ' selected' : '') + '>' +
      meta.emoji + ' ' + meta.label + '</option>';
  }).join("");

  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal-card">' +
      '<h3>Editar ação</h3>' +
      '<label for="edit-text-input">Texto</label>' +
      '<input type="text" id="edit-text-input" value="' + esc(it.text) + '">' +
      '<label for="edit-cat-select">Categoria</label>' +
      '<select id="edit-cat-select">' + optionsHtml + '</select>' +
      '<label for="edit-due-input">Data de vencimento</label>' +
      '<div class="due-row">' +
        '<input type="date" id="edit-due-input" value="' + esc(it.due_date || "") + '">' +
        '<button type="button" class="link" id="edit-due-clear">Limpar</button>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button class="remove" id="edit-delete">Remover</button>' +
        '<button class="cancel" id="edit-cancel">Cancelar</button>' +
        '<button class="save" id="edit-save">Salvar</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
  };
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
  document.getElementById("edit-cancel").addEventListener("click", close);

  const textInput = document.getElementById("edit-text-input");
  const dueInput = document.getElementById("edit-due-input");
  textInput.focus();
  textInput.select();

  document.getElementById("edit-due-clear").addEventListener("click", () => {
    dueInput.value = "";
  });

  // The delete confirm/API call stays here rather than a per-row button,
  // per the redesign: the row itself has no delete affordance anymore.
  document.getElementById("edit-delete").addEventListener("click", async () => {
    if(!(await confirmModal("Excluir esta ação?"))) return;
    close();
    try{
      await api("action_delete", { ids: [it.id] });
      await load();
    }catch(e){
      if(e.unauthorized){ handleAuthError(e, load); return; }
      alert("Não foi possível excluir.");
    }
  });

  document.getElementById("edit-save").addEventListener("click", async () => {
    const text = textInput.value.trim();
    const source = document.getElementById("edit-cat-select").value;
    const dueDate = dueInput.value || null;
    if(!text){ alert("O texto não pode ficar vazio."); return; }
    const patch = {};
    if(text !== it.text) patch.text = text;
    if(source !== it.source) patch.source = source;
    if(dueDate !== (it.due_date || null)) patch.due_date = dueDate;
    close();
    if(Object.keys(patch).length === 0) return;
    await saveEdit(it.id, patch);
  });
}

function wireRowOpen(){
  root.querySelectorAll("[data-open-id]").forEach(el => {
    el.addEventListener("click", () => {
      const it = currentRows.find(r => r.id === el.dataset.openId);
      if(it) openEditModal(it);
    });
  });
}

function wireStarButtons(){
  root.querySelectorAll("[data-star-id]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const it = currentRows.find(r => r.id === btn.dataset.starId);
      if(!it) return;
      const next = !it.important;
      const prevGlyph = btn.textContent;
      btn.disabled = true;
      btn.textContent = next ? "★" : "☆";
      btn.classList.toggle("important", next);
      btn.title = next ? "Remover importância" : "Marcar como importante";
      try{
        await api("action_edit", { id: it.id, important: next });
        // Importance changes sort order, so the in-memory list is re-sorted
        // the same way maga-api's own `list` already orders it, and only
        // the pending card is redrawn -- no full load()/page flash, unlike
        // the modal-driven edits (text/category/due date/delete) which
        // still reload since that's this page's existing convention there.
        it.important = next;
        currentRows = sortPendingRows(currentRows);
        redrawPendingCard();
      }catch(e){
        if(e.unauthorized){ handleAuthError(e, load); return; }
        btn.textContent = prevGlyph;
        btn.classList.toggle("important", it.important);
        btn.title = it.important ? "Remover importância" : "Marcar como importante";
        btn.disabled = false;
        alert("Não foi possível salvar.");
      }
    });
  });
}

function wireDoneToggle(){
  const btn = document.getElementById("toggle-done");
  if(!btn) return;
  btn.addEventListener("click", () => {
    doneExpanded = !doneExpanded;
    btn.textContent = doneExpanded ? "Ocultar ações concluídas" : "Ver ações concluídas";
    const list = document.getElementById("done-list");
    if(list) list.classList.toggle("open", doneExpanded);
    updateDoneListHeight();
    if(doneExpanded && doneItems.length === 0) loadDoneTasks(true);
  });
}

// max-height is set from the content's actual scrollHeight rather than a
// fixed CSS value, since more items can be appended after the section is
// already open (infinite scroll) -- a static cap would eventually clip the
// list once loaded content grew past it.
function updateDoneListHeight(){
  const list = document.getElementById("done-list");
  if(!list) return;
  list.style.maxHeight = doneExpanded ? (list.scrollHeight + "px") : "0px";
}

async function loadDoneTasks(reset){
  if(doneLoading) return;
  if(reset){ doneItems = []; doneOffset = 0; doneHasMore = false; }
  doneLoading = true;
  try{
    const data = await api("list_done", { offset: doneOffset, limit: DONE_PAGE_SIZE });
    const rows = data.actions || [];
    doneItems = doneItems.concat(rows);
    doneOffset += rows.length;
    doneHasMore = !!data.has_more;
    renderDoneSection();
  }catch(e){
    if(e.unauthorized) handleAuthError(e, load);
  }finally{
    doneLoading = false;
  }
}

function renderDoneSection(){
  const list = document.getElementById("done-list");
  if(!list) return;
  list.classList.toggle("open", doneExpanded);
  if(doneObserver){ doneObserver.disconnect(); doneObserver = null; }

  if(doneItems.length === 0){
    list.innerHTML = '<p class="msg">Nenhuma ação concluída ainda.</p>';
    updateDoneListHeight();
    return;
  }

  list.innerHTML =
    '<div class="card done-card">' + doneItems.map(it => {
      const m = SOURCE_META[it.source] || { emoji:"•", label: it.source || "" };
      return '<div class="row">' +
        '<span class="badge">' + m.emoji + '</span>' +
        '<span class="body"><p class="txt done">' + esc(it.text) + '</p>' +
        '<p class="meta">Concluído em ' + fmtDateTime(it.done_at) + '</p></span>' +
        '<button class="icon-btn lg" data-undo-id="' + esc(it.id) + '" title="Desfazer" aria-label="Desfazer">↩</button>' +
        '</div>';
    }).join("") + '</div>' +
    (doneHasMore ? '<p class="msg"><button class="link" id="load-more-done">Carregar mais</button></p>' : '') +
    '<div id="done-sentinel"></div>';

  list.querySelectorAll("[data-undo-id]").forEach(btn => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try{
        await api("undo_done", { ids: [btn.dataset.undoId] });
        await load();
      }catch(e){
        if(e.unauthorized){ handleAuthError(e, load); return; }
        btn.disabled = false;
      }
    });
  });

  const loadMoreBtn = document.getElementById("load-more-done");
  if(loadMoreBtn) loadMoreBtn.addEventListener("click", () => loadDoneTasks(false));

  if(doneHasMore){
    const sentinel = document.getElementById("done-sentinel");
    doneObserver = new IntersectionObserver(entries => {
      if(entries[0].isIntersecting) loadDoneTasks(false);
    });
    doneObserver.observe(sentinel);
  }

  updateDoneListHeight();
}

async function load(){
  root.innerHTML = '<p class="msg">Carregando…</p>';
  bar.style.display = "none";
  if(!getPass()){ showLogin(); return; }
  if(!isDefaultEnv()){
    // Same header markup as render()'s - not worth extracting into a
    // shared headerHtml() for a single other call site.
    root.innerHTML =
      '<header><div class="hleft">' +
        '<button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>' +
        '<h1>Tarefas pendentes</h1>' +
      '</div><img class="brand-mark" src="assets/logo-badge.svg" alt="Magá"></header>' +
      personalPageBlockedHtml();
    wireMenuButton();
    return;
  }
  try{
    const data = await api("list");
    render(data.actions || []);
  }catch(e){
    if(e.unauthorized){
      localStorage.removeItem(PASS_KEY);
      showLogin("Senha incorreta.");
    }else{
      root.innerHTML = '<p class="msg err">Não foi possível carregar agora.</p>' +
        '<p class="msg"><button class="link" onclick="load()">Tentar novamente</button></p>';
    }
  }
}

doneBtn.addEventListener("click", async () => {
  const ids = Array.from(document.querySelectorAll("#root input[data-id]:checked")).map(cb => cb.dataset.id);
  if(ids.length === 0) return;
  doneBtn.disabled = true;
  btnLabel.textContent = "Salvando…";
  try{
    await api("done", { ids });
    await load();
  }catch(e){
    if(e.unauthorized){ handleAuthError(e, load); return; }
    btnLabel.textContent = "Erro ao salvar — tente de novo"; doneBtn.disabled = false;
  }
});

load();
</script>
