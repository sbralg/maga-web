<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Listas de compras</title>
<!--
  Data-free shell for the shopping-list module. Same pattern as tarefas.html
  (the daily-summary checklist): hosted on public GitHub Pages, holds NO
  keys and NO data, asks for the shared passphrase, then talks only to the
  gated Supabase Edge Function (maga-api) via its shopping_* actions.
-->
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-menu.css">
<link rel="stylesheet" href="shared-modal.css">
<link rel="stylesheet" href="shared-toast.css">
<link rel="stylesheet" href="shared-inputs.css">
<style>
  body{
    padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 8px}
  .hleft{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
  .subheader{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0;margin:0 0 16px}
  .list-title{display:flex;align-items:baseline;gap:8px;min-width:0}
  h1{font-size:20px;font-weight:650;margin:0;min-width:0;overflow-wrap:break-word}
  h2{font-size:17px;font-weight:650;margin:0;min-width:0;overflow-wrap:break-word}
  /* An item with no barcode: muted rather than alarming, since a hand-typed
     row is perfectly normal today — it just can't feed stock control. */
  .icon-btn.nobc{font-size:13px;opacity:.5}
  .icon-btn.nobc:hover{opacity:1;background:rgba(127,127,127,.15)}
  .row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:14px;border-bottom:1px solid var(--border);transition:background-color .15s ease}
  .row:hover{background:rgba(127,127,127,.06)}
  .row:last-child{border-bottom:none}
  .row label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer}
  input[type=checkbox]{width:24px;height:24px;margin:0;flex:none;accent-color:var(--accent)}
  .badge{font-size:20px;line-height:1.2;flex:none;width:26px;text-align:center}
  .body{min-width:0;flex:1}
  .body .txt{font-size:15px;line-height:1.35;margin:0;word-wrap:break-word}
  .body .txt.done{text-decoration:line-through;color:var(--muted)}
  .body .meta{font-size:12px;color:var(--muted);margin:3px 0 0}
  /* Quantity + price sit on their own line inside the row (the row wraps),
     indented to line up under the item name rather than under the checkbox.
     They're outside the row's <label> on purpose — inside it, a tap on an
     input would forward to the label's checkbox and toggle "purchased". */
  /* Wraps as a safety valve: with the quantity steppers the line can get
     tight on a narrow phone, and the subtotal dropping to its own line
     reads better than being clipped. */
  .fields{display:flex;align-items:center;gap:6px;flex:1 1 100%;padding-left:14px;flex-wrap:wrap}
  .num-input.qty-input{width:48px}
  /* Quantity stepper: the − and + flank the input and carry the rounded
     ends, so the three read as one control. Sized to stay a comfortable tap
     target without pushing the price off the line. */
  .qty-field .num-input.qty-input{border-radius:0;border-left:none;border-right:none;text-align:center}
  .step-btn{
    font:inherit;font-size:17px;line-height:1;font-weight:600;
    color:var(--muted);background:rgba(127,127,127,.1);
    border:1px solid var(--border-strong);padding:0 9px;min-height:38px;
    cursor:pointer;flex:none;
    transition:background-color .15s ease,color .15s ease,transform .1s ease;
  }
  .step-btn[data-step="-1"]{border-radius:8px 0 0 8px}
  .step-btn[data-step="1"]{border-radius:0 8px 8px 0}
  .step-btn:hover{background:rgba(127,127,127,.22);color:var(--text)}
  .step-btn:active{transform:scale(.92)}
  .subtotal{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .addrow{display:flex;gap:8px;margin-top:14px}
  .addrow input[type=text]{
    flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
  }
  .addrow input.emoji{width:52px;flex:none;text-align:center;font-size:18px;padding:10px 6px}
  /* The "new item" row wraps: name on its own line, then quantity, price
     and the + button — three controls plus a text field don't fit across a
     phone otherwise. */
  /* Quick add: name, quantity and the buttons all on one line. Brand, size
     and price are deliberately NOT here — they belong to the edit dialog,
     which keeps the common "add a thing to the list" gesture to one tap. */
  .addrow.additem{flex-wrap:nowrap}
  .addrow.additem input[type=text]{flex:1 1 auto;min-width:0}
  .addrow.additem .addrow-actions{display:flex;gap:6px;flex:none}
  .addrow.additem button.primary.small{padding:10px 13px}
  .total-bar{padding:12px 4px 0;text-align:right;color:var(--muted);font-size:13px}
  .total-bar strong{color:var(--text);font-size:14px}
  /* Layering, bottom to top: ordinary dialogs (100) < the camera overlay
     (110), so a scan can be started from the edit dialog < the camera
     picker (120), which is opened from inside that overlay. */
  .modal-backdrop.above-scanner{z-index:120}
  .gtin-row{display:flex;gap:8px;align-items:flex-start}
  .gtin-row input[type=text]{flex:1;min-width:0}
  /* Scan dialog: name and brand up top, then the two things worth entering
     while the box is still in your hand. .fields-row is the shared
     amount+unit row layout (shared-inputs.css); .qty-field's own width here
     is scan-dialog-specific, so it stays local. */
  .scan-meta{margin:0 0 16px;font-size:13px;color:var(--muted)}
  .fields-row .qty-field .num-input{width:44px}

  /* Barcode scanner. Sits ABOVE .modal-backdrop (z-index 100) because it can
     be opened from inside the edit dialog to attach a code to an item. The
     "name this product" prompt is never stacked on it — a read closes the
     camera first. */
  .scan-overlay{
    position:fixed;inset:0;z-index:110;background:#000;
    display:flex;align-items:center;justify-content:center;
    animation:modalFadeIn .15s ease;
  }
  .scan-overlay video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* The huge spread shadow dims everything outside the frame in one rule. */
  .scan-frame{
    position:relative;width:min(78vw,320px);aspect-ratio:1.6/1;
    border:2px solid rgba(255,255,255,.9);border-radius:14px;
    box-shadow:0 0 0 100vmax rgba(0,0,0,.45);
  }
  .scan-frame::after{
    content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;
    background:#ef4444;opacity:.9;
  }
  .scan-hint{
    position:absolute;left:16px;right:16px;top:max(20px,env(safe-area-inset-top));
    text-align:center;color:#fff;font-size:14px;line-height:1.45;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  .scan-toast{
    position:absolute;left:16px;right:16px;
    bottom:calc(92px + env(safe-area-inset-bottom));
    margin:0 auto;max-width:420px;text-align:center;
    background:rgba(0,0,0,.8);color:#fff;font-size:14px;font-weight:600;
    padding:11px 14px;border-radius:12px;
    opacity:0;transition:opacity .2s ease;pointer-events:none;
  }
  .scan-toast.show{opacity:1}
  .scan-toast.err{background:rgba(220,38,38,.92)}
  .scan-actions{
    position:absolute;left:16px;right:16px;
    bottom:max(20px,env(safe-area-inset-bottom));
    display:flex;gap:10px;justify-content:center;align-items:center;
  }
  .scan-actions button{
    font:inherit;font-weight:600;font-size:15px;border:none;border-radius:14px;
    padding:14px 22px;min-height:52px;cursor:pointer;background:#fff;color:#111;
    transition:transform .1s ease,background-color .15s ease;
  }
  .scan-actions button:active{transform:scale(.97)}
  .scan-actions .ghost{background:rgba(255,255,255,.2);color:#fff;padding:14px 16px}
  .scan-actions .ghost.on{background:#fde68a;color:#111}

  /* Camera picker / diagnostic list. */
  .cam-list{display:flex;flex-direction:column;gap:8px;margin:0 0 14px;max-height:52vh;overflow:auto}
  .cam-item{
    display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:none;border:1px solid var(--border-strong);border-radius:10px;
    padding:10px 12px;color:var(--text);transition:background-color .15s ease;
  }
  .cam-item:hover{background:rgba(127,127,127,.1)}
  .cam-item.active{border-color:var(--accent)}
  /* Both are spans inside a <button>, so they need to be told to stack. */
  .cam-name{display:block;font-size:14px;font-weight:600;word-break:break-word}
  .cam-caps{display:block;font-size:12px;color:var(--muted);margin-top:3px;word-break:break-word}
  /* A scanned row lights up briefly so it's obvious what just landed. */
  @keyframes rowFlash{from{background:rgba(var(--gold-rgb),.22)} to{background:transparent}}
  .row.flash{animation:rowFlash 1.4s ease-out}
</style>
</head>
<body>
<div id="root" class="wrap"><p class="msg">Carregando…</p></div>

<script>
const root = document.getElementById("root");
const CURRENT_PAGE = "compras";
const PAGE_LOGIN = {
  title: "Listas de compras",
  subtitle: "Faça o seu login para acessar.",
  onSuccess: () => loadLists()
};
</script>
<script src="shared-api.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-format.js"></script>
<script src="shared-inputs.js"></script>
<script src="shared-pwa.js"></script>
<script>
let currentList = null; // set when viewing a single list's items

// What a barcode last sold for — a useful thing to see while confirming a
// scan or price, and never worth failing the surrounding action over, so any
// failure (including "no history yet", the normal case for a while) is the
// same as "nothing to show".
async function lastPriceFor(gtin){
  if(!gtin) return null;
  try{
    const hist = await api("insumo_price_history", { gtin, limit: 1 });
    const latest = (hist.prices || [])[0];
    return latest && latest.price != null ? Number(latest.price) : null;
  }catch(_){
    return null;
  }
}

// Returns just the first grapheme cluster of a string -- unlike a raw
// character/length check, this correctly treats a compound emoji (skin
// tone modifiers, ZWJ sequences, flags) as a single "character" instead
// of cutting it apart mid-sequence.
function firstGrapheme(str){
  if(!str) return "";
  if(typeof Intl !== "undefined" && Intl.Segmenter){
    const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
    const first = seg.segment(str)[Symbol.iterator]().next();
    return first.done ? "" : first.value.segment;
  }
  return Array.from(str)[0] || "";
}

// Live-truncates an emoji <input> to a single grapheme as the user types
// or pastes, instead of just capping length at submit time.
function limitToOneEmoji(input){
  input.addEventListener("input", () => {
    const limited = firstGrapheme(input.value);
    if(input.value !== limited) input.value = limited;
  });
}

// ---- barcode scanning ----
//
// Chrome on Android implements BarcodeDetector natively, so this needs no
// library and the page stays dependency-free. Safari/iOS has never shipped
// it and every iOS browser is WebKit underneath, so there is no native path
// there at all — hence the explicit unsupported message rather than a
// button that silently does nothing.
// GTIN families only. code_128 was in this list originally and is gone on
// purpose: it carries arbitrary text, not a product number, so it mostly
// added surface for reading a shipping label off the side of a box.
const SCAN_FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e"];

// Number of consecutive frames that must decode to the SAME valid code
// before it counts. A misread that happens to satisfy the check digit
// anyway (1 in 10 do) almost never repeats identically on the next frame.
const SCAN_AGREE = 2;

function scanningSupported(){
  return typeof window.BarcodeDetector === "function";
}

// Standard GS1 mod-10 check digit — the same algorithm normalizeGtin() runs
// in maga-api. The server stays the authority; this copy exists so a
// misread is thrown away before it costs a closed camera and a bogus
// "insumo novo" prompt. Keep the two in step.
function gtinCheckDigitOk(code){
  const d = code.split("").map(Number);
  const check = d.pop();
  const sum = d.reverse().reduce((acc, n, i) => acc + n * (i % 2 === 0 ? 3 : 1), 0);
  return (10 - (sum % 10)) % 10 === check;
}

// Returns the code if it's a plausible GTIN, or null to keep scanning.
// Dropping or inventing a digit — the exact failure being seen on real
// boxes — breaks the check digit, so this catches it.
function validScan(raw, format){
  const code = String(raw ?? "").trim();
  if(!/^\d+$/.test(code)) return null;
  // UPC-E is the one format the check digit can't be run on as-is: its
  // digit is computed over the EXPANDED 12-digit form, so the 8 digits as
  // reported would fail a straight mod-10. Length is all that's checked
  // here; the repeat-read agreement below still has to hold.
  if(format === "upc_e") return code.length === 8 ? code : null;
  if(!/^(\d{8}|\d{12,14})$/.test(code)) return null;
  return gtinCheckDigitOk(code) ? code : null;
}

// Remembers which physical lens works on this phone. Device ids are stable
// per origin once camera permission has been granted.
const CAM_KEY = "scan_camera_id";

// THE rule for "does this lens actually focus": `manual` on its own is a
// fixed-focus lens exposing a no-op knob. Only `continuous` / `single-shot`
// mean real autofocus. A phone in use reported focusMode:["manual"] on its
// ultra-wide and the full set on its main lens — reading any non-empty
// focusMode as "focuses" is what made a fixed-focus lens look usable.
const AUTOFOCUS_MODES = ["continuous", "single-shot"];
function hasAutofocusModes(modes){
  return (modes || []).some(m => AUTOFOCUS_MODES.indexOf(m) >= 0);
}

// Opens one camera just long enough to read what it can do, then releases
// it. This is the only way to learn a lens's capabilities — enumerateDevices
// reports names, never abilities.
async function probeCameraInfo(deviceId){
  let s = null;
  try{
    s = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: deviceId } }, audio: false
    });
    const t = s.getVideoTracks()[0];
    const c = (t && t.getCapabilities) ? t.getCapabilities() : {};
    const st = (t && t.getSettings) ? t.getSettings() : {};
    const modes = c.focusMode || [];
    return {
      ok: true,
      modes,
      auto: hasAutofocusModes(modes),
      torch: !!c.torch,
      zoom: c.zoom ? (c.zoom.min + "–" + c.zoom.max) : "",
      w: (c.width && c.width.max) || st.width || 0,
      h: (c.height && c.height.max) || st.height || 0
    };
  }catch(err){
    return { ok: false, error: (err && err.name) || "erro",
             modes: [], auto: false, torch: false, zoom: "", w: 0, h: 0 };
  }finally{
    if(s) s.getTracks().forEach(t => t.stop());
  }
}

function describeCamera(info){
  if(!info.ok) return "indisponível (" + info.error + ")";
  const bits = [];
  bits.push(info.auto
    ? "autofoco: " + info.modes.filter(m => m !== "manual").join(", ")
    : "SEM autofoco" + (info.modes.length ? " (só " + info.modes.join(", ") + ")" : ""));
  if(info.torch) bits.push("lanterna");
  if(info.zoom) bits.push("zoom " + info.zoom);
  if(info.w && info.h) bits.push(info.w + "×" + info.h);
  return bits.join(" · ");
}

// Autofocus is decisive; the torch in practice marks the main lens (the
// flash sits next to it); sensor size breaks any remaining tie.
function cameraScore(info){
  return (info.auto ? 1000 : 0) + (info.torch ? 100 : 0) +
    Math.min((info.w || 0) / 1000, 99);
}

// Lists every video input the browser exposes and lets one be chosen.
// Resolves with a deviceId, or null if dismissed. Doubles as the diagnostic
// for "which lenses does this phone actually hand to the browser?" — the
// answer is often fewer than the phone physically has, and nothing on the
// web platform can reveal the rest.
function cameraPickerModal(devices, activeId){
  return new Promise(async (resolve) => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop above-scanner";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>Câmeras</h3>' +
        '<div class="cam-list" id="cam-list"></div>' +
        '<div class="modal-actions">' +
          '<button class="cancel" id="cam-cancel">Fechar</button>' +
          '<button class="save" id="cam-probe">Testar todas</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    const listEl = backdrop.querySelector("#cam-list");
    const probeBtn = backdrop.querySelector("#cam-probe");

    const close = (id) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(id || null);
    };
    function onKey(e){ if(e.key === "Escape") close(null); }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#cam-cancel").addEventListener("click", () => close(null));

    listEl.innerHTML = devices.map((d, i) => {
      const front = /front|user|frontal|selfie/i.test(d.label || "");
      const name = (d.label || "").trim() || ("Câmera " + (i + 1));
      return '<button class="cam-item' + (d.deviceId === activeId ? ' active' : '') +
        '" data-cam="' + esc(d.deviceId) + '">' +
        '<span class="cam-name">' + (d.deviceId === activeId ? "● " : "") +
          esc(name) + (front ? " (frontal)" : "") + '</span>' +
        '<span class="cam-caps" data-caps>' +
          (d.deviceId === activeId ? "em uso" : "toque para usar") + '</span>' +
      '</button>';
    }).join("") || '<p class="msg">Nenhuma câmera encontrada.</p>';

    listEl.querySelectorAll(".cam-item").forEach(btn => {
      btn.addEventListener("click", () => close(btn.getAttribute("data-cam")));
    });

    probeBtn.addEventListener("click", async () => {
      probeBtn.disabled = true;
      probeBtn.textContent = "Testando…";
      for(const d of devices){
        const btn = listEl.querySelector('.cam-item[data-cam="' + CSS.escape(d.deviceId) + '"]');
        const capsEl = btn && btn.querySelector("[data-caps]");
        if(capsEl) capsEl.textContent = "testando…";
        const info = await probeCameraInfo(d.deviceId);
        if(capsEl) capsEl.textContent = describeCamera(info);
      }
      probeBtn.disabled = false;
      probeBtn.textContent = "Testar de novo";
    });
  });
}

// Opens the camera and resolves with the FIRST barcode read, or null if the
// user closed it without scanning. One read per opening: the camera closing
// is itself the confirmation that the scan landed, and it puts the list back
// in front of you straight away.
async function openScanner(){
  return new Promise(async (resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "scan-overlay";
    overlay.innerHTML =
      '<video playsinline muted autoplay></video>' +
      '<div class="scan-frame"></div>' +
      '<p class="scan-hint">Aponte para o código de barras</p>' +
      '<div class="scan-toast"></div>' +
      '<div class="scan-actions">' +
        '<button class="ghost" id="scan-torch" title="Lanterna">🔦</button>' +
        '<button class="ghost" id="scan-cam" title="Trocar câmera">🔄</button>' +
        '<button id="scan-close">Cancelar</button>' +
      '</div>';
    document.body.appendChild(overlay);

    const video = overlay.querySelector("video");
    const hintEl = overlay.querySelector(".scan-hint");
    const toastEl = overlay.querySelector(".scan-toast");
    const torchBtn = overlay.querySelector("#scan-torch");
    const camBtn = overlay.querySelector("#scan-cam");

    let stream = null, track = null, caps = {}, focusModes = [];
    // `cameras` is the rear-facing subset used by the auto-pick; the picker
    // shows `allCameras` so the diagnostic hides nothing.
    let cameras = [], allCameras = [], activeId = "";
    let stopped = false, toastTimer = null, torchOn = false;

    const toast = (msg) => {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    };

    const stopStream = () => {
      // Releasing the camera matters: without this the indicator light and
      // the capture stay live after the overlay is gone.
      if(stream) stream.getTracks().forEach(t => t.stop());
      stream = null; track = null; caps = {}; focusModes = [];
    };

    const close = (code) => {
      if(stopped) return;
      stopped = true;
      clearTimeout(toastTimer);
      stopStream();
      video.srcObject = null;
      overlay.remove();
      document.removeEventListener("keydown", onKey);
      document.removeEventListener("visibilitychange", onHide);
      resolve(code || null);
    };
    function onKey(e){ if(e.key === "Escape") close(null); }
    // Backgrounding the page (a call, the home button) should free the
    // camera rather than leave it held by a page nobody is looking at.
    function onHide(){ if(document.hidden) close(null); }
    document.addEventListener("keydown", onKey);
    document.addEventListener("visibilitychange", onHide);
    overlay.querySelector("#scan-close").addEventListener("click", () => close(null));

    // Focus is requested AFTER the stream exists, never inside the
    // getUserMedia constraints: as a constraint, a device without focus
    // control rejects the whole request instead of ignoring the hint.
    async function setFocus(mode, point){
      if(!track) return false;
      const advanced = {};
      if(mode && focusModes.includes(mode)) advanced.focusMode = mode;
      if(point && caps.pointsOfInterest) advanced.pointsOfInterest = [point];
      if(!Object.keys(advanced).length) return false;
      try{ await track.applyConstraints({ advanced: [advanced] }); return true; }
      catch(_){ return false; }
    }

    // Only real autofocus counts. `manual` alone is a fixed-focus lens with
    // a knob that does nothing, and pointsOfInterest without autofocus has
    // nothing to aim.
    function canFocus(){ return hasAutofocusModes(focusModes); }

    function refreshChrome(){
      torchBtn.style.display = caps.torch ? "" : "none";
      torchBtn.classList.toggle("on", torchOn && !!caps.torch);
      // Shown even with a single camera: it's also the diagnostic for
      // finding out how few lenses the browser is being offered.
      camBtn.style.display = allCameras.length ? "" : "none";
      hintEl.textContent = canFocus()
        ? "Aponte para o código de barras · toque para focar"
        : "Aponte para o código de barras";
    }

    async function startStream(deviceId){
      stopStream();
      const video_c = deviceId
        ? { deviceId: { exact: deviceId } }
        : { facingMode: { ideal: "environment" } };
      // Resolution is `ideal` so a device that can't manage it degrades
      // quietly instead of throwing OverconstrainedError. The extra pixels
      // help a lot when the barcode is small in frame.
      video_c.width = { ideal: 1280 };
      video_c.height = { ideal: 720 };
      stream = await navigator.mediaDevices.getUserMedia({ video: video_c, audio: false });
      video.srcObject = stream;
      try{ await video.play(); }catch(_){ /* autoplay attribute covers it */ }
      track = stream.getVideoTracks()[0];
      caps = track && track.getCapabilities ? track.getCapabilities() : {};
      focusModes = caps.focusMode || [];
      activeId = (track && track.getSettings && track.getSettings().deviceId) || deviceId || "";
      torchOn = false;
      // Continuous autofocus is what stops the picture sitting locked at
      // whatever distance the camera opened at.
      await setFocus("continuous");
      refreshChrome();
    }

    // Labels and stable ids only exist once permission has been granted, so
    // this runs after the first successful getUserMedia.
    async function loadCameras(){
      try{
        const devices = await navigator.mediaDevices.enumerateDevices();
        const vids = devices.filter(d => d.kind === "videoinput" && d.deviceId);
        // Exclude only the clearly front-facing ones, rather than requiring
        // a "back" match. Some phones label a rear lens with nothing that
        // says which way it points, and demanding the match dropped that
        // lens out of the cycle entirely.
        const rear = vids.filter(d => !/front|user|frontal|selfie/i.test(d.label || ""));
        allCameras = vids;
        cameras = rear.length ? rear : vids;
      }catch(_){ cameras = []; allCameras = []; }
    }

    try{
      const saved = localStorage.getItem(CAM_KEY);
      try{
        await startStream(saved || null);
      }catch(err){
        // A remembered id goes stale when permissions are reset; fall back
        // to whatever the browser considers the rear camera.
        if(!saved) throw err;
        localStorage.removeItem(CAM_KEY);
        await startStream(null);
      }
    }catch(err){
      // Denied, already in use, or no camera at all — all land here.
      hintEl.textContent = err && err.name === "NotAllowedError"
        ? "Permissão de câmera negada. Autorize o acesso nas configurações do site e tente de novo."
        : "Não foi possível acessar a câmera.";
      torchBtn.style.display = "none";
      camBtn.style.display = "none";
      return;
    }

    await loadCameras();
    refreshChrome();

    // Android routinely hands `facingMode:environment` the ULTRA-WIDE lens,
    // and on most phones that lens is FIXED FOCUS — it has no autofocus
    // hardware, so no constraint and no amount of tapping will ever sharpen
    // it. When the lens we landed on reports no focus control at all, walk
    // the other rear cameras and keep the first one that does.
    // Runs once per device; the winner is remembered, and a choice made by
    // hand in the picker always outranks it.
    if(!localStorage.getItem(CAM_KEY) && cameras.length > 1){
      // Shortcut for the common case: the lens we opened on already has
      // autofocus and the torch, so it IS the main camera. Skipping the
      // probe here avoids a black flicker on every first scan.
      if(canFocus() && caps.torch){
        localStorage.setItem(CAM_KEY, activeId);
      }else{
        // Probing opens each lens in turn, so the current one has to be
        // released first — Android generally allows only one at a time.
        const current = activeId;
        stopStream();
        let best = null;
        for(const d of cameras.slice(0, 4)){
          const info = await probeCameraInfo(d.deviceId);
          if(!info.ok) continue;
          const score = cameraScore(info);
          if(!best || score > best.score) best = { score, id: d.deviceId };
        }
        try{
          await startStream((best && best.id) || current || null);
          if(best) localStorage.setItem(CAM_KEY, best.id);
        }catch(_){
          try{ await startStream(null); }catch(_){ /* reported below */ }
        }
      }
      refreshChrome();
    }

    // Manual override, because the heuristic above can't be right on every
    // phone: focusMode can be reported by a lens that doesn't focus, so the
    // only reliable judge is the user looking at the picture.
    camBtn.addEventListener("click", async () => {
      if(stopped || !allCameras.length) return;
      const previous = activeId;
      // The camera has to be released before the picker can probe lenses —
      // Android generally allows only one open at a time.
      stopStream();
      const chosen = await cameraPickerModal(allCameras, previous);
      if(stopped) return;
      try{
        await startStream(chosen || previous || null);
        if(chosen) localStorage.setItem(CAM_KEY, chosen);
      }catch(_){
        // The chosen lens refused; fall back rather than leave a dead view.
        try{ await startStream(null); }catch(_){ toast("Câmera indisponível"); }
      }
    });

    overlay.addEventListener("click", async (e) => {
      if(e.target.closest(".scan-actions")) return;
      if(!canFocus() || !track) return;
      const r = video.getBoundingClientRect();
      // Normalized 0..1 inside the displayed video. The element is
      // object-fit:cover, so this drifts a little at the cropped edges —
      // close enough to aim a focus point, which is all it has to do.
      const point = {
        x: Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1),
        y: Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1)
      };
      // single-shot drives one focus sweep at that point; where it isn't
      // offered, re-applying continuous still nudges most cameras out of a
      // stuck lock.
      const ok = await setFocus(
        focusModes.includes("single-shot") ? "single-shot" : "continuous",
        point
      );
      if(ok){
        toast("Focando…");
        // Hand control back so the camera keeps tracking afterwards.
        setTimeout(() => { if(!stopped) setFocus("continuous"); }, 2200);
      }
    });

    torchBtn.addEventListener("click", async () => {
      if(!caps.torch || !track) return;
      torchOn = !torchOn;
      try{
        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
        torchBtn.classList.toggle("on", torchOn);
      }catch(_){ torchOn = !torchOn; }
    });

    let detector;
    try{
      // Ask for only the formats this browser actually decodes: an
      // unsupported entry in the list makes the constructor throw.
      let formats = SCAN_FORMATS;
      try{
        const ok = await window.BarcodeDetector.getSupportedFormats();
        const filtered = SCAN_FORMATS.filter(f => ok.includes(f));
        if(filtered.length) formats = filtered;
      }catch(_){ /* keep the default list */ }
      detector = new window.BarcodeDetector({ formats });
    }catch(_){
      hintEl.textContent = "Este navegador não consegue ler códigos de barras.";
      return;
    }

    // A candidate has to survive two gates before it counts: the GS1 check
    // digit, and agreeing with the previous frame. Anything else is dropped
    // silently and scanning continues — no vibration, no closing, because a
    // buzz on a misread is worse than no buzz at all.
    let candidate = "", agreed = 0, nudgedAt = 0;
    const tick = async () => {
      if(stopped) return;
      if(video.readyState >= 2){
        try{
          const found = await detector.detect(video);
          const hit = found && found.length ? found[0] : null;
          if(hit){
            const code = validScan(hit.rawValue, hit.format);
            if(!code){
              candidate = "";
              agreed = 0;
              // Something IS being decoded, it just keeps coming out
              // malformed — worth saying so rather than letting the user
              // hold the phone there indefinitely.
              const now = Date.now();
              if(now - nudgedAt > 4000){
                nudgedAt = now;
                toast("Código ilegível — aproxime ou afaste");
              }
            }else if(code === candidate){
              if(++agreed >= SCAN_AGREE){
                if(navigator.vibrate) navigator.vibrate(40);
                close(code);
                return;
              }
            }else{
              candidate = code;
              agreed = 1;
            }
          }
        }catch(_){ /* detect() throws transiently between frames */ }
      }
      if(!stopped) setTimeout(tick, 200);
    };
    tick();
  });
}

// Shared by the scan-confirm dialog (adding a newly scanned product)
// and the pencil/rescan edit dialog (editing an existing row) — same fields,
// same order, so the two can never drift into feeling like different tools.
// Confirms WHICH product a barcode resolved to — the safety check that
// matters when the name comes from a shared external catalogue — and
// collects the things only the person holding the box knows: how many, what
// it costs here, and how much is IN one box.
// Resolves with {name, brand, size, quantity, price, gtin} or null if
// dismissed. `size` is null unless the package size was actually edited —
// leaving it blank means "unchanged", never "erase it".
//
// opts:
//   idPrefix      "scan" or "edit", so the two dialogs' DOM ids stay apart
//   title, saveLabel
//   name, brand, netQty, netUnit, quantity, price   initial values
//   lastPrice     optional, shown as a hint under the price field
//   gtin          the barcode in play, if any
//   gtinEditable  true for the edit dialog (typed or scanned in place),
//                 false for the scan dialog (already fixed by the scan
//                 gesture that opened it — shown as plain text instead)
//   gtinKnown     scan dialog only: whether the code resolved to a
//                 catalogue entry, for the "ainda não conhecido" line
//   presetGtin    edit dialog only: a code just scanned via the row's own
//                 camera icon, applied as soon as the dialog opens — the
//                 same live catalogue fill the embedded scan button does,
//                 without asking the camera to open a second time
//   onScanned     edit dialog only: async (code) => bool, called with a code
//                 the embedded scan button just read, BEFORE it's applied to
//                 the fields — a chance for the caller to resolve a
//                 collision with a different row first. Returning true means
//                 it already took over (merged, or the user declined), so
//                 the dialog closes instead of showing the scan's result.
//   focusPrice    true to focus the price field instead of the name field
function productFieldsModal(opts){
  const p = opts.idPrefix;
  // A quick-add row (edit dialog, no barcode yet) has no insumo behind it,
  // so brand and size stay out of the way until a code is attached — typed,
  // scanned, or already there when the dialog opens. The scan dialog always
  // has a code by the time it's shown, so this is always "on" there.
  const hasCode = !opts.gtinEditable || !!(opts.presetGtin || opts.gtin);
  // The stored pair, split back into what the label on the box actually says
  // (1500 g reads as 1,5 kg), so a prefilled value looks like the packaging
  // rather than like our storage units.
  const pack = netQtyToFields(opts.netQty, opts.netUnit);
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>' + esc(opts.title) + '</h3>' +
        // Name and brand are always editable, prefilled from the catalogue
        // when it has one — a barcode resolves to a shared, crowd-typed
        // entry, and the person holding the box is the only one who can
        // catch a wrong name or brand OFF (or an earlier mistake) got stuck
        // with.
        '<label for="' + p + '-name">Nome do insumo</label>' +
        '<input type="text" id="' + p + '-name" placeholder="ex: Arroz 5 kg" value="' +
          esc(opts.name || "") + '">' +
        '<div id="' + p + '-brand-field"' + (hasCode ? '' : ' hidden') + '>' +
          '<label for="' + p + '-brand">Marca (opcional)</label>' +
          '<input type="text" id="' + p + '-brand" placeholder="ex: Nestlé" value="' +
            esc(opts.brand || "") + '">' +
        '</div>' +
        (opts.gtinEditable
          ? '<label for="' + p + '-gtin">Código de barras</label>' +
            '<div class="gtin-row">' +
              '<input type="text" id="' + p + '-gtin" inputmode="numeric" ' +
                'placeholder="sem código" value="' + esc(opts.gtin || "") + '">' +
              '<button type="button" class="primary small alt" id="' + p + '-scan" ' +
                'title="Ler código de barras">📷</button>' +
            '</div>' +
            '<p class="hint" id="' + p + '-gtin-hint"></p>'
          : '<p class="scan-meta">Código ' + esc(opts.gtin) +
              (opts.gtinKnown ? '' : ' — ainda não conhecido.') + '</p>') +
        // Amount + unit as two controls, mirroring how the pair is STORED
        // (net_qty + net_unit) instead of asking for prose and parsing it
        // back. Prefilled from the catalogue when it knows — blank for a
        // brand new code, and also for an Open Food Facts entry whose
        // `quantity` field was empty or unparseable. Without it a barcode
        // can never answer "quanto disso eu tenho?", because the row's
        // quantity counts PACKAGES. Editable even when prefilled because
        // OFF's sizes are crowd-typed and never re-checked once cached —
        // the person holding the box is the only one who can catch a
        // shrunk package.
        '<div id="' + p + '-net-field"' + (hasCode ? '' : ' hidden') + '>' +
          '<label for="' + p + '-net-qty">Peso / volume do pacote (opcional)</label>' +
          '<div class="fields-row">' +
            '<div class="col grow">' +
              '<span class="field">' +
                '<input class="num-input" type="text" inputmode="decimal" id="' + p + '-net-qty" ' +
                  'aria-label="Quantidade do pacote" placeholder="0" ' +
                  'value="' + esc(pack.qty) + '">' +
              '</span>' +
            '</div>' +
            '<div class="col unit-col">' +
              '<select id="' + p + '-net-unit" aria-label="Unidade do pacote">' +
                unitOptions(pack.unit) +
              '</select>' +
            '</div>' +
          '</div>' +
          '<p class="hint">Quanto vem em UM pacote — é o que permite somar o ' +
            'total disponível para as receitas. Corrija se estiver errado.</p>' +
        '</div>' +
        '<div class="fields-row">' +
          '<div class="col">' +
            '<label for="' + p + '-qty">Quantidade</label>' +
            '<span class="field qty-field">' +
              '<button type="button" class="step-btn" data-step="-1" aria-label="Diminuir">\u2212</button>' +
              '<input class="num-input qty-input" type="text" inputmode="decimal" ' +
                'id="' + p + '-qty" aria-label="Quantidade" value="' +
                esc(fmtQty(opts.quantity || 1)) + '">' +
              '<button type="button" class="step-btn" data-step="1" aria-label="Aumentar">+</button>' +
            '</span>' +
          '</div>' +
          '<div class="col grow">' +
            '<label for="' + p + '-price">Preço</label>' +
            '<span class="field"><span class="prefix">R$</span>' +
              '<input class="num-input price-input" type="text" inputmode="numeric" ' +
                'id="' + p + '-price" aria-label="Preço unitário" placeholder="0,00" value="' +
                esc(fmtPriceInput(opts.price)) + '"></span>' +
          '</div>' +
        '</div>' +
        (opts.lastPrice != null
          ? '<p class="hint">Última vez: ' + esc(fmtMoney(opts.lastPrice)) + '</p>'
          : '<p class="hint">O preço é opcional — em branco significa desconhecido.</p>') +
        '<div class="modal-actions">' +
          '<button class="cancel" id="' + p + '-cancel">Cancelar</button>' +
          '<button class="save" id="' + p + '-ok">' + esc(opts.saveLabel) + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    const nameEl = backdrop.querySelector("#" + p + "-name");
    const brandEl = backdrop.querySelector("#" + p + "-brand");
    const brandFieldEl = backdrop.querySelector("#" + p + "-brand-field");
    const netFieldEl = backdrop.querySelector("#" + p + "-net-field");
    const netQtyEl = backdrop.querySelector("#" + p + "-net-qty");
    const netUnitEl = backdrop.querySelector("#" + p + "-net-unit");
    const gtinEl = backdrop.querySelector("#" + p + "-gtin");
    const gtinHintEl = backdrop.querySelector("#" + p + "-gtin-hint");
    const qtyEl = backdrop.querySelector("#" + p + "-qty");
    const priceEl = backdrop.querySelector("#" + p + "-price");
    wireQtyInput(qtyEl);
    // Same digits-and-one-separator rule as the item quantity: a package size
    // is a decimal amount too, and type=number would let "e"/"+"/"-" through.
    wireQtyInput(netQtyEl);
    wirePriceInput(priceEl);
    backdrop.querySelectorAll(".step-btn").forEach(btn =>
      btn.addEventListener("click", () => {
        const step = Number(btn.getAttribute("data-step"));
        qtyEl.value = fmtQty(Math.max((parseQtyInput(qtyEl.value) ?? 1) + step, 1));
      }));

    // Marca/Peso show or hide as the code field goes from empty to not, in
    // either direction — typing or scanning one in reveals them, clearing it
    // goes back to "just a reminder". Only relevant for the edit dialog: the
    // scan dialog always has a code by the time it's shown.
    function syncProductFields(){
      const has = !!gtinEl.value.trim();
      brandFieldEl.hidden = !has;
      netFieldEl.hidden = !has;
      gtinHintEl.textContent = has
        ? "Ao reconhecer o código, nome, marca e peso passam a vir do catálogo."
        : "Sem código de barras — é só uma lembrança de compra. Leia o código " +
          "para trazer nome, marca e peso do catálogo.";
    }
    // Applies a code just obtained from the camera — used both by the
    // embedded scan button below and by a code the row's own camera icon
    // already scanned before this dialog even opened (`presetGtin`), so
    // scanning never has to happen twice for the same read.
    async function applyScannedGtin(code){
      gtinEl.value = code;
      syncProductFields();
      // Best-effort: show exactly what will be saved, right here, rather
      // than leaving the fields as whatever was typed before and letting
      // the catalogue silently win only once the save round-trips.
      try{
        const found = await api("insumo_lookup", { gtin: code });
        if(found.found){
          nameEl.value = found.insumo.name || "";
          brandEl.value = tidyShouted(found.insumo.brand || "");
          const foundPack = netQtyToFields(found.insumo.net_qty, found.insumo.net_unit);
          netQtyEl.value = foundPack.qty;
          netUnitEl.value = foundPack.unit;
        }
      }catch(_){ /* the save-time lookup still resolves it either way */ }
    }
    if(gtinEl){
      syncProductFields();
      gtinEl.addEventListener("input", syncProductFields);
      backdrop.querySelector("#" + p + "-scan").addEventListener("click", async () => {
        if(!scanningSupported()){
          await alertModal(
            "Este navegador não suporta leitura de código de barras. " +
            "No Android, use o Chrome."
          );
          return;
        }
        // The camera overlay sits above this dialog, which stays open
        // underneath so nothing typed so far is lost.
        const code = await openScanner();
        if(!code) return;
        // A collision with a different row is resolved by the caller
        // (confirmed first, if this row already had its own code) BEFORE
        // anything about the scan reaches these fields — the dialog closes
        // rather than showing a result that's about to be undone.
        if(opts.onScanned && await opts.onScanned(code)){ close(null); return; }
        await applyScannedGtin(code);
      });
      if(opts.presetGtin) applyScannedGtin(opts.presetGtin);
    }

    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };
    const ok = () => {
      const name = nameEl.value.trim();
      // A blank name can't be stored, whether the code is new or the field
      // came prefilled — clearing it is never a valid "correction".
      if(!name){ nameEl.focus(); return; }
      // Leaving the size blank is fine — standing in an aisle is no place to
      // be blocked. An amount with no unit is NOT fine: "1" could be a gram
      // or a kilo, and guessing would corrupt exactly the number the recipe
      // side exists to add up. Only a CHANGED pair counts, so re-scanning a
      // product whose size is already right doesn't rewrite it on every
      // scan; clearing the amount means "leave it as it was", not "erase
      // it" — the way to fix a wrong size is to enter the right one.
      let size = null;
      const netQtyNow = netQtyEl.value.trim();
      const netUnitNow = netUnitEl.value;
      if(netQtyNow && (netQtyNow !== pack.qty || netUnitNow !== pack.unit)){
        size = fieldsToNetQty(netQtyNow, netUnitNow);
        if(!size){
          alert(netUnitNow
            ? "quantidade do pacote inválida"
            : "escolha a unidade do pacote (kg, g, L, ml ou un)");
          (netUnitNow ? netQtyEl : netUnitEl).focus();
          return;
        }
      }
      close({
        name,
        brand: brandEl.value.trim(),
        size,
        quantity: parseQtyInput(qtyEl.value) ?? 1,
        price: centsToPrice(priceDigits(priceEl.value)),
        gtin: gtinEl ? gtinEl.value.replace(/\D/g, "") : opts.gtin
      });
    };
    function onKey(e){
      if(e.key === "Escape") close(null);
      if(e.key === "Enter"){ e.preventDefault(); ok(); }
    }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#" + p + "-cancel").addEventListener("click", () => close(null));
    backdrop.querySelector("#" + p + "-ok").addEventListener("click", ok);
    // Straight to the price when there's nothing to double-check — correcting
    // a field is the exception, not the common case. Otherwise the name gets
    // the focus, since that's the thing most likely to need typing or fixing.
    const first = opts.focusPrice ? priceEl : nameEl;
    first.focus();
    if(first.select) first.select();
  });
}

// The scan-confirm dialog: shown after every scan, before anything is
// written. See productFieldsModal for the fields themselves.
function scanConfirmModal(opts){
  const known = !!opts.insumo;
  const p = opts.insumo || {};
  return productFieldsModal({
    idPrefix: "scan",
    title: known ? "Adicionar à lista" : "Insumo novo",
    saveLabel: "Adicionar",
    name: p.name || "",
    brand: tidyShouted(p.brand || ""),
    netQty: p.net_qty,
    netUnit: p.net_unit,
    quantity: 1,
    price: null,
    lastPrice: opts.lastPrice,
    gtin: opts.gtin,
    gtinEditable: false,
    gtinKnown: known,
    focusPrice: known
  });
}

// Informational dialog — confirmModal's red/Cancel pair reads as a warning
// for something that is only telling the user why nothing happened.
function alertModal(message){
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<p>' + esc(message) + '</p>' +
        '<div class="modal-actions">' +
          '<button class="save" id="alert-ok">Entendi</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);
    const close = () => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve();
    };
    function onKey(e){ if(e.key === "Escape" || e.key === "Enter") close(); }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
    document.getElementById("alert-ok").addEventListener("click", close);
  });
}

function openListEditModal(list, onSaved){
  const currentEmoji = list.emoji || "🛒";
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal-card">' +
      '<h3>Editar lista</h3>' +
      '<label for="edit-list-emoji">Ícone (emoji)</label>' +
      '<input type="text" id="edit-list-emoji" value="' + esc(currentEmoji) + '">' +
      '<label for="edit-list-name">Nome</label>' +
      '<input type="text" id="edit-list-name" value="' + esc(list.name) + '">' +
      '<div class="modal-actions">' +
        '<button class="cancel" id="edit-list-cancel">Cancelar</button>' +
        '<button class="save" id="edit-list-save">Salvar</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
  };
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
  document.getElementById("edit-list-cancel").addEventListener("click", close);

  const nameInput = document.getElementById("edit-list-name");
  limitToOneEmoji(document.getElementById("edit-list-emoji"));
  nameInput.focus();
  nameInput.select();

  document.getElementById("edit-list-save").addEventListener("click", async () => {
    const name = nameInput.value.trim();
    const emoji = document.getElementById("edit-list-emoji").value.trim();
    if(!name){ alert("O nome não pode ficar vazio."); return; }
    close();
    const tasks = [];
    if(name !== list.name) tasks.push(api("shopping_list_rename", { id: list.id, name }));
    if(emoji !== currentEmoji) tasks.push(api("shopping_list_set_emoji", { id: list.id, emoji: emoji || null }));
    if(tasks.length === 0) return;
    try{ await Promise.all(tasks); onSaved(); }
    catch(e){ handleAuthError(e, onSaved); }
  });
}

function navHeader(title, backAction, emoji){
  // Top row is always the same: menu button, then the page title right
  // after it -- regardless of screen.
  const topRow = '<header><div class="hleft">' +
    '<button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>' +
    '<h1 style="flex:1">' + (backAction ? 'Listas de compras' : esc(title)) + '</h1>' +
    '</div><a class="brand-mark" href="index.html"><img src="assets/logo-badge.svg" alt="Magá"></a></header>';
  if(!backAction) return topRow;

  // Items view: the list itself becomes a subtitle row below -- "← Listas"
  // on the left, the list's icon + name grouped on the right.
  const emojiBtn = emoji ? '<span class="badge">' + emoji + '</span>' : '';
  const subRow = '<div class="subheader">' +
    '<button class="link" id="back">← Listas</button>' +
    '<span class="list-title">' + emojiBtn + '<h2>' + esc(title) + '</h2></span>' +
  '</div>';
  return topRow + subRow;
}

function wireNav(backAction){
  wireMenuButton();
  if(backAction) document.getElementById("back").addEventListener("click", backAction);
}

// ---- lists screen ----

async function loadLists(){
  root.innerHTML = '<p class="msg">Carregando…</p>';
  currentList = null;
  if(!getPass()){ showLogin(); return; }
  try{
    const data = await api("shopping_lists");
    renderLists(data.lists || []);
  }catch(e){ handleAuthError(e, loadLists); }
}

function renderLists(lists){
  const rowsHtml = lists.length === 0
    ? '<p class="msg">Nenhuma lista ainda. Crie uma abaixo.</p>'
    : '<div class="card">' + lists.map(l => {
        const emoji = l.emoji || "🛒";
        return '<div class="row" data-id="' + esc(l.id) + '">' +
          '<span class="badge">' + emoji + '</span>' +
          '<span class="body list-open" style="cursor:pointer">' +
            '<p class="txt">' + esc(l.name) + '</p>' +
            '<p class="meta">' + l.purchased_count + '/' + l.item_count + ' itens · ' + fmtMoney(l.total_cart) + ' no carrinho</p>' +
          '</span>' +
          '<button class="icon-btn" data-action="edit" title="Editar">✎</button>' +
          '<button class="icon-btn danger" data-action="delete" title="Excluir">🗑</button>' +
        '</div>';
      }).join("") + '</div>';

  root.innerHTML = navHeader("Listas de compras", null) + rowsHtml +
    '<div class="addrow">' +
      '<input type="text" id="new-list-emoji" class="emoji" placeholder="🛒">' +
      '<input type="text" id="new-list-name" placeholder="Nova lista (ex: Farmácia)">' +
      '<button class="primary small" id="add-list-btn">+ Lista</button>' +
    '</div>';

  wireNav(null);

  root.querySelectorAll(".row").forEach(row => {
    const id = row.dataset.id;
    row.querySelector(".list-open").addEventListener("click", () => openList(id));
    row.querySelector('[data-action="edit"]').addEventListener("click", () => {
      const l = lists.find(x => x.id === id);
      openListEditModal(l, loadLists);
    });
    row.querySelector('[data-action="delete"]').addEventListener("click", async () => {
      const l = lists.find(x => x.id === id);
      if(!(await confirmModal('Excluir a lista "' + l.name + '" e todos os seus itens?'))) return;
      try{ await api("shopping_list_delete", { id }); loadLists(); }
      catch(e){ handleAuthError(e, loadLists); }
    });
  });

  const addBtn = document.getElementById("add-list-btn");
  const nameInput = document.getElementById("new-list-name");
  const emojiInput = document.getElementById("new-list-emoji");
  limitToOneEmoji(emojiInput);
  const addList = async () => {
    const name = nameInput.value.trim();
    if(!name) return;
    addBtn.disabled = true;
    const emoji = emojiInput.value.trim();
    try{ await api("shopping_list_create", { name, emoji: emoji || undefined }); loadLists(); }
    catch(e){ addBtn.disabled = false; handleAuthError(e, loadLists); }
  };
  addBtn.addEventListener("click", addList);
  nameInput.addEventListener("keydown", e => { if(e.key === "Enter") addList(); });
  emojiInput.addEventListener("keydown", e => { if(e.key === "Enter") addList(); });
}

// ---- items screen ----

async function openList(id){
  root.innerHTML = '<p class="msg">Carregando…</p>';
  try{
    const [listsData, itemsData] = await Promise.all([
      api("shopping_lists"),
      api("shopping_items", { list_id: id })
    ]);
    const list = (listsData.lists || []).find(l => l.id === id);
    if(!list){ loadLists(); return; }
    currentList = list;
    renderItems(list, itemsData.items || []);
  }catch(e){ handleAuthError(e, loadLists); }
}

// An item's own line total (price × quantity), shown next to the fields so
// the currency is visible even while the inputs hold bare numbers. Empty
// when there's no price yet — "R$ 0,00" would read as free, not as unknown.
function lineTotal(it){
  if(it.price == null || it.price === "") return "";
  return fmtMoney(Number(it.price) * qtyOf(it));
}
function qtyOf(it){
  const q = Number(it.quantity);
  return Number.isFinite(q) && q > 0 ? q : 1;
}
// Quantity for display: "2", not "2,00" — but "1,5" stays "1,5" (kg happens).
function fmtQty(q){
  const n = Number(q);
  if(!Number.isFinite(n) || n <= 0) return "1";
  return Number.isInteger(n) ? String(n) : n.toLocaleString("pt-BR");
}

// Brand and package size of the scanned insumo, under the item name — the
// check that the barcode resolved to the thing actually in your hand.
// Empty for a hand-typed row, which has no insumo behind it.
function insumoMeta(it){
  const p = (it && it.insumo) || {};
  // The item's own values win: they're either a hand-typed item's only
  // source of these, or a deliberate correction to what the barcode said.
  const brand = (it && it.brand) || p.brand;
  const hasOwnSize = it && it.net_qty != null;
  const qty = hasOwnSize ? it.net_qty : p.net_qty;
  const unit = hasOwnSize ? it.net_unit : p.net_unit;
  const bits = [];
  if(brand) bits.push(tidyShouted(brand));
  const size = fmtNetQty(qty, unit);
  if(size) bits.push(size);
  return bits.join(" · ");
}

// The pencil/rescan edit dialog: same fields, same order as the scan
// dialog (see productFieldsModal) plus an editable barcode field, since
// unlike a fresh scan an existing row's code can be wrong and worth typing
// or reading again. `opts.lastPrice` and `opts.presetGtin` (a code the
// row's own camera icon already scanned before this dialog opened) are both
// optional. Resolves with the fields, or null if dismissed.
function itemEditModal(it, opts){
  opts = opts || {};
  const p = (it && it.insumo) || {};
  const hasOwnSize = it && it.net_qty != null;
  return productFieldsModal({
    idPrefix: "edit",
    title: "Editar item",
    saveLabel: "Salvar",
    name: (it && it.name) || "",
    brand: tidyShouted((it && (it.brand || p.brand)) || ""),
    netQty: hasOwnSize ? it.net_qty : p.net_qty,
    netUnit: hasOwnSize ? it.net_unit : p.net_unit,
    quantity: qtyOf(it),
    price: it ? it.price : null,
    lastPrice: opts.lastPrice,
    gtin: (it && it.gtin) || "",
    gtinEditable: true,
    presetGtin: opts.presetGtin,
    onScanned: opts.onScanned,
    focusPrice: false
  });
}

function itemRowHtml(it){
  const meta = insumoMeta(it);
  return '<div class="row" data-id="' + esc(it.id) + '">' +
    '<label>' +
      '<input type="checkbox" data-purchase' + (it.purchased ? ' checked' : '') + '>' +
      '<span class="body"><p class="txt' + (it.purchased ? ' done' : '') + '">' + esc(it.name) + '</p>' +
        (meta ? '<p class="meta">' + esc(meta) + '</p>' : '') +
      '</span>' +
    '</label>' +
    // Only for a row with no code of its own yet — opens the scanner
    // straight away to attach one. A row that's already linked keeps its
    // code the same way any other decided field does: through the pencil,
    // whose dialog has its own scan button for a deliberate rescan.
    '<button class="icon-btn nobc" data-action="scan-item"' +
      (it.gtin ? ' hidden' : '') +
      ' title="Ler código de barras">📷</button>' +
    '<button class="icon-btn" data-action="rename-item" title="Editar">✎</button>' +
    '<button class="icon-btn danger" data-action="delete-item" title="Remover">✕</button>' +
    '<div class="fields">' +
      '<span class="field qty-field">' +
        '<button class="step-btn" data-step="-1" aria-label="Diminuir">\u2212</button>' +
        '<input class="num-input qty-input" type="text" ' +
          'inputmode="decimal" aria-label="Quantidade" value="' +
          esc(fmtQty(qtyOf(it))) + '">' +
        '<button class="step-btn" data-step="1" aria-label="Aumentar">+</button>' +
      '</span>' +
      '<span class="field"><span class="prefix">R$</span>' +
        '<input class="num-input price-input" type="text" ' +
          'inputmode="numeric" aria-label="Preço unitário" placeholder="0,00" value="' +
          esc(fmtPriceInput(it.price)) + '"></span>' +
      '<span class="subtotal" data-subtotal>' + esc(lineTotal(it)) + '</span>' +
    '</div>' +
  '</div>';
}

function renderItems(list, items){
  const emoji = list.emoji || "🛒";
  const rowsHtml = items.length === 0
    ? '<p class="msg" id="items-empty">Nenhum item nesta lista ainda.</p>'
    : '<div class="card" id="items-card">' + items.map(itemRowHtml).join("") + '</div>';

  root.innerHTML = navHeader(list.name, loadLists, emoji) + rowsHtml +
    '<div class="addrow additem">' +
      '<input type="text" id="new-item-name" placeholder="Novo item rápido">' +
      '<span class="field"><span class="prefix">×</span>' +
        '<input class="num-input qty-input" type="text" ' +
          'inputmode="decimal" id="new-item-qty" aria-label="Quantidade" placeholder="1"></span>' +
      '<span class="addrow-actions">' +
        '<button class="primary small alt" id="scan-item-btn" ' +
          'title="Ler código de barras" aria-label="Ler código de barras">📷</button>' +
        '<button class="primary small" id="add-item-btn">+</button>' +
      '</span>' +
    '</div>' +
    '<div class="total-bar">Total lista: <strong id="total-all">' + fmtMoney(list.total_all) + '</strong> · No carrinho: <strong id="total-cart">' + fmtMoney(list.total_cart) + '</strong></div>';

  wireNav(loadLists);

  // Recomputed client-side from the already-loaded items, so any item
  // change can update the totals in place instead of refetching the list
  // (which used to reload the whole screen on every tap).
  function recomputeTotals(){
    const totalAllEl = document.getElementById("total-all");
    const totalCartEl = document.getElementById("total-cart");
    if(!totalAllEl || !totalCartEl) return;
    // price * quantity, same as the server computes for the lists screen.
    const sum = pred => items.filter(pred)
      .reduce((acc, i) => acc + (Number(i.price) || 0) * qtyOf(i), 0);
    totalAllEl.textContent = fmtMoney(sum(() => true));
    totalCartEl.textContent = fmtMoney(sum(i => i.purchased));
  }

  function refreshLineTotal(row, it){
    const el = row.querySelector("[data-subtotal]");
    if(el) el.textContent = lineTotal(it);
  }

  // The row a barcode already belongs to, if the list has one. A checked-off
  // row still counts: "purchased" means IN THE CART, not gone — scanning it
  // again is a walk back to the aisle for one more, which belongs on that
  // same line rather than starting a second one. (It's "Confirmar compra"
  // that will clear the checked rows out into stock and finance; until then
  // they're as much a part of the list as any other.) When both a checked
  // and an unchecked row carry the code, the unchecked one wins — that's
  // the line still saying "you need this".
  function rowForGtin(code, exceptId){
    if(!code) return null;
    const matches = items.filter(i => i.gtin === code && i.id !== exceptId);
    return matches.find(i => !i.purchased) || matches[0] || null;
  }

  // Name plus the brand/size line under it, which may appear or disappear
  // entirely depending on what was just saved.
  function redrawItemText(row, it){
    row.querySelector(".txt").textContent = it.name;
    const scanBtn = row.querySelector('[data-action="scan-item"]');
    if(scanBtn) scanBtn.hidden = !!it.gtin;
    const meta = insumoMeta(it);
    let metaEl = row.querySelector(".meta");
    if(!meta){ if(metaEl) metaEl.remove(); return; }
    if(!metaEl){
      metaEl = document.createElement("p");
      metaEl.className = "meta";
      row.querySelector(".body").appendChild(metaEl);
    }
    metaEl.textContent = meta;
  }

  function wireItemRow(it){
    const row = root.querySelector('.row[data-id="' + it.id + '"]');
    if(!row) return;
    row.querySelector("[data-purchase]").addEventListener("change", async (e) => {
      const checked = e.target.checked;
      const prevPurchased = it.purchased;
      it.purchased = checked;
      row.querySelector(".txt").classList.toggle("done", checked);
      recomputeTotals();
      try{
        await api("shopping_item_update", { id: it.id, purchased: checked });
      }catch(err){
        if(err.unauthorized){ handleAuthError(err, loadLists); return; }
        it.purchased = prevPurchased;
        e.target.checked = prevPurchased;
        row.querySelector(".txt").classList.toggle("done", prevPurchased);
        recomputeTotals();
        alert("Não foi possível salvar. Tente novamente.");
      }
    });
    const priceEl = row.querySelector(".price-input");
    wirePriceInput(priceEl);
    priceEl.addEventListener("change", async () => {
      const newPrice = centsToPrice(priceDigits(priceEl.value));
      priceEl.value = fmtPriceInput(newPrice);
      if(newPrice === it.price) return;
      const prevPrice = it.price;
      it.price = newPrice;
      refreshLineTotal(row, it);
      recomputeTotals();
      try{
        await api("shopping_item_update", { id: it.id, price: newPrice });
      }catch(err){
        if(err.unauthorized){ handleAuthError(err, loadLists); return; }
        it.price = prevPrice;
        priceEl.value = fmtPriceInput(prevPrice);
        refreshLineTotal(row, it);
        recomputeTotals();
        alert("Não foi possível salvar. Tente novamente.");
      }
    });
    const qtyEl = row.querySelector(".qty-input");
    wireQtyInput(qtyEl);

    // Quantity is NOT NULL and must stay positive: a cleared or nonsense
    // value falls back to 1 (and the field is rewritten to match) rather
    // than being sent to the API to be rejected. Shared by the typed input
    // and the − / + steppers so both save the same way.
    async function setQty(raw){
      const newQty = parseQtyInput(raw) ?? 1;
      qtyEl.value = fmtQty(newQty);
      if(newQty === qtyOf(it)) return;
      const prevQty = it.quantity;
      it.quantity = newQty;
      refreshLineTotal(row, it);
      recomputeTotals();
      try{
        await api("shopping_item_update", { id: it.id, quantity: newQty });
      }catch(err){
        if(err.unauthorized){ handleAuthError(err, loadLists); return; }
        it.quantity = prevQty;
        qtyEl.value = fmtQty(qtyOf(it));
        refreshLineTotal(row, it);
        recomputeTotals();
        alert("Não foi possível salvar. Tente novamente.");
      }
    }
    qtyEl.addEventListener("change", (e) => setQty(e.target.value));
    row.querySelectorAll(".step-btn").forEach(btn =>
      btn.addEventListener("click", () => {
        // Steps by whole units and never below 1 — zero would fail the
        // column's check constraint, and "none of this" is the ✕ button.
        const step = Number(btn.getAttribute("data-step"));
        setQty(Math.max(qtyOf(it) + step, 1));
      }));
    // A code might already belong to a DIFFERENT row in the list — two rows
    // can't share a barcode. Checked as soon as the code is known, right
    // after the scan and before any dialog shows it, so a collision is
    // resolved on the spot rather than undone after the fact; also the
    // fallback when saving, for a code typed in by hand rather than
    // scanned. An item with no code of its own yet merges into the
    // existing row SILENTLY, the same way a fresh scan from the "＋" flow
    // already merges on sight — its identity here was never decided, so
    // there's nothing to ask about. One that already had its own different
    // code is a correction to something already decided, so it asks FIRST,
    // before anything about the scan is shown. Returns true if it took
    // over (merged, or the user declined) — false means the caller should
    // go on and apply the code normally.
    async function mergeIfColliding(code){
      if(!code || code === it.gtin) return false;
      const existing = rowForGtin(code, it.id);
      if(!existing) return false;

      const hadOwnCode = !!it.gtin;
      if(hadOwnCode){
        const merge = await confirmModal(
          'O código lido já é de "' + existing.name + '" (' + fmtQty(qtyOf(existing)) +
            ' na lista). Somar 1 unidade a esse item e remover "' + it.name + '"?',
          "Somar e remover"
        );
        if(!merge) return true;
      }
      // Same scroll-flash-and-toast a plain repeat scan gets — this row is
      // about to vanish, so the feedback has to be on the row that survives.
      // Its whole quantity moves over when it never had a code of its own
      // (nothing was decided about it, so nothing is lost); a row that DID
      // have one contributes a single unit, matching what the prompt above
      // offered.
      if(!(await addUnitsToRow(existing, hadOwnCode ? 1 : qtyOf(it)))) return true;
      try{
        await api("shopping_item_delete", { id: it.id });
        const idx = items.indexOf(it);
        if(idx !== -1) items.splice(idx, 1);
        row.remove();
        recomputeTotals();
      }catch(err){
        if(err.unauthorized){ handleAuthError(err, loadLists); return true; }
        alert("Não foi possível remover o item duplicado. Tente novamente.");
      }
      return true;
    }
    // Shared by the pencil and the camera below: both end in the same edit
    // dialog, so both save the result the same way.
    async function saveItemEdit(edited){
      if(await mergeIfColliding(edited.gtin)) return;
      try{
        const patch = {
          id: it.id, name: edited.name, price: edited.price,
          brand: edited.brand, quantity: edited.quantity, gtin: edited.gtin
        };
        // A blank size in the dialog means "unchanged" (same rule the scan
        // dialog's package-size field already used), so the key is only
        // sent at all when there's an actual pair to apply.
        if(edited.size) patch.net_text = edited.size.net_qty + " " + edited.size.net_unit;
        const data = await api("shopping_item_update", patch);
        // The API returns the stored row, with the size normalized out of
        // whatever was typed — so redraw from that, not from the input values.
        if(data.item) Object.assign(it, data.item);
        redrawItemText(row, it);
        priceEl.value = fmtPriceInput(it.price);
        qtyEl.value = fmtQty(qtyOf(it));
        refreshLineTotal(row, it);
        recomputeTotals();
      }catch(err){
        if(err.unauthorized){ handleAuthError(err, loadLists); return; }
        alert(err.badRequest
          ? "Verifique o peso/volume (ex: 380 g) e o código de barras."
          : "Não foi possível salvar. Tente novamente.");
      }
    }
    row.querySelector('[data-action="rename-item"]').addEventListener("click", async () => {
      const lastPrice = it.gtin ? await lastPriceFor(it.gtin) : null;
      // A rescan from the embedded scan button inside the dialog itself is
      // checked for a collision the same way, before its result ever
      // reaches the fields.
      const edited = await itemEditModal(it, { lastPrice, onScanned: mergeIfColliding });
      if(edited === null) return;
      await saveItemEdit(edited);
    });
    // The camera opens the scanner right away — no dialog first. A code
    // that collides with a different row is resolved right here, before any
    // dialog opens at all — this button only shows for a row with no code
    // of its own, so that collision always merges silently. Anything else
    // shows up prefilled in the same review dialog editing already uses, so
    // a bad read still gets caught before anything is saved.
    row.querySelector('[data-action="scan-item"]').addEventListener("click", async () => {
      if(!scanningSupported()){
        await alertModal(
          "Este navegador não suporta leitura de código de barras. " +
          "No Android, use o Chrome."
        );
        return;
      }
      const code = await openScanner();
      if(!code) return;
      if(await mergeIfColliding(code)) return;
      const lastPrice = await lastPriceFor(code);
      const edited = await itemEditModal(it, { presetGtin: code, lastPrice, onScanned: mergeIfColliding });
      if(edited === null) return;
      await saveItemEdit(edited);
    });
    row.querySelector('[data-action="delete-item"]').addEventListener("click", async () => {
      if(!(await confirmModal('Remover "' + it.name + '"?'))) return;
      const idx = items.indexOf(it);
      const parent = row.parentNode;
      const nextSibling = row.nextElementSibling;
      if(idx !== -1) items.splice(idx, 1);
      row.remove();
      recomputeTotals();

      let emptyMsg = null;
      if(items.length === 0 && parent){
        emptyMsg = document.createElement("p");
        emptyMsg.className = "msg";
        emptyMsg.id = "items-empty";
        emptyMsg.textContent = "Nenhum item nesta lista ainda.";
        parent.replaceWith(emptyMsg);
      }

      try{
        await api("shopping_item_delete", { id: it.id });
      }catch(err){
        if(err.unauthorized){ handleAuthError(err, loadLists); return; }
        if(idx !== -1) items.splice(idx, 0, it);
        if(emptyMsg) emptyMsg.replaceWith(parent);
        parent.insertBefore(row, nextSibling);
        recomputeTotals();
        alert("Não foi possível remover. Tente novamente.");
      }
    });
  }

  items.forEach(wireItemRow);

  const addBtn = document.getElementById("add-item-btn");
  const nameInput = document.getElementById("new-item-name");
  const qtyInput = document.getElementById("new-item-qty");
  wireQtyInput(qtyInput);
  const addItem = async () => {
    const name = nameInput.value.trim();
    if(!name) return;
    addBtn.disabled = true;
    // Left blank (the common case) means one of them.
    const quantity = parseQtyInput(qtyInput.value) ?? 1;
    try{
      const data = await api("shopping_item_add", {
        list_id: list.id, name, quantity
      });
      items.push(data.item);
      nameInput.value = "";
      qtyInput.value = "";

      let card = document.getElementById("items-card");
      if(!card){
        card = document.createElement("div");
        card.className = "card";
        card.id = "items-card";
        const emptyMsg = document.getElementById("items-empty");
        if(emptyMsg) emptyMsg.replaceWith(card);
      }
      const wrapper = document.createElement("div");
      wrapper.innerHTML = itemRowHtml(data.item);
      card.appendChild(wrapper.firstElementChild);
      wireItemRow(data.item);
      recomputeTotals();
    }catch(err){
      if(err.unauthorized){ handleAuthError(err, loadLists); }
      else if(err.badRequest){
        alert("Não entendi o peso/volume. Use algo como 380 g, 1 kg ou 500 ml.");
      }
      else alert("Não foi possível adicionar. Tente novamente.");
    }finally{
      addBtn.disabled = false;
    }
  };
  addBtn.addEventListener("click", addItem);
  [nameInput, qtyInput].forEach(el =>
    el.addEventListener("keydown", e => { if(e.key === "Enter") addItem(); }));

  // Appends a scanned row, or refreshes the one the API merged into. The
  // merge case mutates the SAME object the row's handlers closed over, so
  // editing that row afterwards still works without a re-render.
  function applyScannedItem(item){
    const existing = items.find(i => i.id === item.id);
    if(existing){
      Object.assign(existing, item);
      const row = root.querySelector('.row[data-id="' + existing.id + '"]');
      if(row){
        row.querySelector(".qty-input").value = fmtQty(qtyOf(existing));
        const priceEl = row.querySelector(".price-input");
        priceEl.value = fmtPriceInput(existing.price);
        refreshLineTotal(row, existing);
        // A merge can also carry a corrected name/brand for a known product,
        // so the text line needs the same redraw a pencil-edit would trigger
        // — not just the quantity and price a plain re-scan changes.
        redrawItemText(row, existing);
      }
      recomputeTotals();
      return;
    }
    items.push(item);
    let card = document.getElementById("items-card");
    if(!card){
      card = document.createElement("div");
      card.className = "card";
      card.id = "items-card";
      const emptyMsg = document.getElementById("items-empty");
      if(emptyMsg) emptyMsg.replaceWith(card);
    }
    const wrapper = document.createElement("div");
    wrapper.innerHTML = itemRowHtml(item);
    card.appendChild(wrapper.firstElementChild);
    wireItemRow(item);
    recomputeTotals();
  }

  // Briefly light up the row that just changed and bring it into view — the
  // camera is gone by now, so this is what tells you the scan landed.
  function flashRow(id){
    const row = root.querySelector('.row[data-id="' + id + '"]');
    if(!row) return;
    row.scrollIntoView({ block: "center", behavior: "smooth" });
    row.classList.remove("flash");
    void row.offsetWidth; // restart the animation if it's still running
    row.classList.add("flash");
    setTimeout(() => row.classList.remove("flash"), 1600);
  }

  // The shared tail of every "this is one more of that" path: re-scanning a
  // code already on the list, and attaching a code that turns out to belong
  // to a different row. Updates the row in place and fires the API behind
  // it, reverting on failure, like every other mutating action here.
  // Scrolls to the row, lights it up, and names the before → after in a
  // toast — the quantity can easily change off-screen, and a silent bump
  // reads as "my scan did nothing". Resolves true once it's saved.
  async function addUnitsToRow(target, addQty){
    const prevQty = qtyOf(target);
    const newQty = prevQty + addQty;
    const targetRow = root.querySelector('.row[data-id="' + target.id + '"]');
    const paint = (qty) => {
      target.quantity = qty;
      if(targetRow){
        targetRow.querySelector(".qty-input").value = fmtQty(qty);
        refreshLineTotal(targetRow, target);
      }
      recomputeTotals();
    };
    paint(newQty);
    flashRow(target.id);
    listToast("Já estava na lista — " + target.name + "  " +
      fmtQty(prevQty) + " → " + fmtQty(newQty));
    try{
      await api("shopping_item_update", { id: target.id, quantity: newQty });
      return true;
    }catch(err){
      if(err.unauthorized){ handleAuthError(err, loadLists); return false; }
      paint(prevQty);
      listToast("Falha ao salvar", true);
      return false;
    }
  }

  // One scanned barcode: resolve it, and only stop to ask when neither the
  // local catalogue nor Open Food Facts knows the code. The name typed then
  // is stored against the barcode, so the next scan of it never asks again.
  async function handleScannedCode(code){
    // Already on the list? Then this is "one more of that", not a new line.
    // Add the unit right here: no dialog, no lookup — a row already
    // carrying this code has nothing left to resolve, and in an aisle a
    // silent +1 beats confirming a product that's demonstrably already
    // been confirmed once. Correcting its name, brand or price is still a
    // tap away on the pencil; asking for them on every repeat scan is what
    // made picking up a second box feel like adding a stranger.
    const already = rowForGtin(code);
    if(already){ await addUnitsToRow(already, 1); return; }

    // Resolve FIRST and write nothing yet: the dialog needs to show which
    // product this is before anything lands in the list. A local hit is
    // instant; a code that has to go out to Open Food Facts can take a
    // couple of seconds, which is long enough to need saying so.
    listToast("Buscando insumo…");
    let found;
    try{
      found = await api("insumo_lookup", { gtin: code });
    }catch(err){
      hideListToast();
      if(err.unauthorized){ handleAuthError(err, loadLists); return; }
      listToast("Falha de conexão", true);
      return;
    }
    // What this cost last time is a useful thing to see while standing in
    // the aisle, but never worth failing the scan over — lastPriceFor()
    // already swallows its own errors.
    const lastPrice = found.found ? await lastPriceFor(code) : null;
    hideListToast();

    const insumo = found.found ? found.insumo : null;
    const confirmed = await scanConfirmModal({ gtin: code, insumo, lastPrice });
    if(confirmed === null) return;

    listToast("Salvando…");
    let data;
    try{
      data = await api("shopping_item_scan", {
        list_id: list.id,
        gtin: code,
        name: confirmed.name || undefined,
        quantity: confirmed.quantity,
        price: confirmed.price
      });
    }catch(err){
      hideListToast();
      if(err.unauthorized){ handleAuthError(err, loadLists); return; }
      listToast("Falha ao salvar", true);
      return;
    }
    if(!data.item){ listToast("Não foi possível adicionar", true); return; }

    // The size describes the BOX, so it belongs on the insumo, not on this
    // row: stored against the barcode it's typed once ever, and it's what
    // lets "3 pacotes" become 4,5 kg for the recipe side. A brand-new barcode
    // has no insumo to correct yet, so a typed brand registers one too —
    // same reasoning, same write. Fired after the item lands, and
    // best-effort — a failed write must never read as a failed scan.
    if(confirmed.size || (!insumo && confirmed.brand)){
      const upsert = {
        gtin: code,
        name: (data.insumo && data.insumo.name) || confirmed.name
      };
      if(confirmed.size){
        upsert.net_qty = confirmed.size.net_qty;
        upsert.net_unit = confirmed.size.net_unit;
      }
      if(!insumo && confirmed.brand) upsert.brand = confirmed.brand;
      api("insumo_upsert", upsert)
        .catch(() => { /* the row is already in the list; retry by editing */ });
      // The response above predates that write, so fill the fields in locally
      // rather than refetching just to show them.
      data.item.insumo = Object.assign({}, data.item.insumo,
        confirmed.size ? { net_qty: confirmed.size.net_qty, net_unit: confirmed.size.net_unit } : {},
        (!insumo && confirmed.brand) ? { brand: confirmed.brand } : {});
    }

    // A KNOWN insumo already has a catalogue entry — shared by everyone who
    // scans the code — so a corrected name or brand here is an override of
    // THIS row, the same edit the pencil icon makes, not a silent rewrite of
    // what the next person sees. Only sent when it actually differs from
    // what the dialog was prefilled with, so re-scanning an already-right
    // insumo costs no write.
    if(insumo){
      const patch = { id: data.item.id };
      // A brand-new row already carries the corrected name — it was sent as
      // `name` above, and the insert used it verbatim. Only a MERGE leaves it
      // stale, since that path only ever touches quantity and price. Reaching
      // here at all means the API merged into a row this page didn't know
      // about (added on another device since the list loaded) — a local
      // match never gets this far, having been handled before the dialog.
      // Brand needs the write either way: shopping_item_scan never sets it.
      if(data.merged && confirmed.name !== (insumo.name || "")) patch.name = confirmed.name;
      if(confirmed.brand !== tidyShouted(insumo.brand || "")) patch.brand = confirmed.brand;
      if("name" in patch || "brand" in patch){
        api("shopping_item_update", patch)
          .catch(() => { /* the row is already in the list; retry by editing */ });
        if("name" in patch) data.item.name = patch.name;
        if("brand" in patch) data.item.brand = patch.brand;
      }
    }
    applyScannedItem(data.item);
    flashRow(data.item.id);
    listToast(data.merged
      ? data.item.name + "  ×" + fmtQty(data.item.quantity)
      : "＋ " + data.item.name);
  }

  document.getElementById("scan-item-btn").addEventListener("click", async () => {
    if(!scanningSupported()){
      await alertModal(
        "Este navegador não suporta leitura de código de barras. " +
        "No Android, use o Chrome."
      );
      return;
    }
    const code = await openScanner();
    if(code) await handleScannedCode(code);
  });
}

loadLists();
</script>
</body>
</html>
