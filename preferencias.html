<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preferências">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Preferências</title>
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-menu.css">
<link rel="stylesheet" href="shared-modal.css">
<link rel="stylesheet" href="shared-toast.css">
<style>
  body{
    padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:640px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 8px}
  .hleft{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
  h1{font-size:20px;font-weight:650;margin:0;min-width:0;overflow-wrap:break-word}
  h3{font-size:14px;font-weight:650;margin:22px 0 8px;color:var(--muted)}

  .field{display:flex;flex-direction:column;gap:5px;margin:0 0 14px}
  .field label{font-size:12.5px;font-weight:600;color:var(--muted)}
  .field input[type=text]{
    font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
    -webkit-appearance:none;width:100%;
  }
  .hint{font-size:12px;color:var(--muted);line-height:1.4;margin:0}
  .field .hint{font-size:12px;color:var(--muted);line-height:1.4}
  .field .err{font-size:12.5px;color:var(--danger)}

  .limit{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .limit .err{width:100%;font-size:12.5px;color:var(--danger);margin:0}
  .limit:last-child{border-bottom:none}
  .limit .name{flex:1;min-width:0;font-size:14px}
  .limit .name span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
  .limit input{
    font:inherit;font-size:15px;width:74px;text-align:right;padding:8px 10px;border-radius:9px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);-webkit-appearance:none;
  }

  .grouplist{display:flex;flex-direction:column;max-height:290px;overflow-y:auto;margin:0 0 12px}
  .grouprow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border);cursor:pointer}
  .grouprow:last-child{border-bottom:none}
  .grouprow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
  .grouprow .label{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
  .grouprow .jid{display:block;font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}

  .locked{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
  .locked:last-child{border-bottom:none}
  .locked .k{color:var(--muted);flex:none}
  .locked .v{text-align:right;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  details.infra{margin-top:22px}
  details.infra summary{cursor:pointer;font-size:14px;font-weight:650;color:var(--muted);padding:6px 0}
  details.infra .note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:2px 0 10px}

  .entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .entry:last-of-type{border-bottom:none}
  .entry .who{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
  .entry .who span{display:block;font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .addrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
  .addrow input{
    flex:1;min-width:150px;font:inherit;font-size:15px;padding:9px 11px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);-webkit-appearance:none;
  }
  .resolved{font-size:12.5px;color:var(--muted);width:100%;margin:0}
  .resolved.ok{color:var(--ok, var(--accent))}
  .actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:6px}
  .saved{font-size:12.5px;color:var(--muted)}
  .banner{
    font-size:13px;line-height:1.45;padding:11px 13px;border-radius:10px;margin:0 0 16px;
    background:rgba(127,127,127,.1);color:var(--muted);
  }
  .banner.warn{background:rgba(var(--gold-rgb),.14);color:var(--text)}
</style>
</head>
<body>
<div id="root" class="wrap"><p class="msg">Carregando…</p></div>

<script>
const root = document.getElementById("root");
let prefs = null;        // the whole GET /preferences body
let prefsStale = false;  // served from cache because the jump host was unreachable
let groups = null;       // {groups:[{jid,label}], reachable}

const PAGE_LOGIN = {
  title: "Preferências",
  subtitle: "Faça o seu login para acessar.",
  onSuccess: () => load(),
};
</script>
<script src="shared-api.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-format.js"></script>
<script src="shared-prefs.js"></script>
<script src="shared-pwa.js"></script>
<script>

const CURRENT_PAGE = "preferencias";

function header(){
  return '<header><div class="hleft">' +
    '<button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>' +
    '<h1 style="flex:1">Preferências</h1>' +
    '</div><a class="brand-mark" href="index.html"><img src="assets/logo-badge.svg" alt="Magá"></a></header>';
}

// Every exit path renders the header first, so a person who lands on a
// blocked/failed state can still open the menu and go somewhere else -
// same rule as the blocked personal pages on a non-default environment.
function renderShell(inner){
  root.innerHTML = header() + inner;
  wireMenuButton();
}

async function load(){
  if(!getPass()){ showLogin(); return; }

  // Coming back from /logout, which cleared the login cookie so the password
  // form will actually appear. The parameter is stripped BEFORE starting the
  // flow, or startOAuth would capture it as the return URL and loop here
  // forever.
  const params = new URLSearchParams(location.search);
  if(params.get("reauth") === "1"){
    params.delete("reauth");
    const clean = location.pathname + (params.toString() ? "?" + params : "");
    history.replaceState(null, "", clean);
    startOAuth("padrao");
    return;
  }

  // These settings belong to whoever is SIGNED IN, not to the environment
  // being looked at. On someone else's environment (Alexandre inside Bia's
  // prod to help her) editing them here would silently change his own, so
  // the page says so instead - same reasoning as hoje/tarefas being hidden
  // there, and the same isDefaultEnv() check.
  if(!isDefaultEnv()){
    renderShell('<div class="banner warn">Estas preferências são da conta que fez login, não do ambiente que você está vendo agora. ' +
      'Para evitar alterar as suas próprias configurações sem querer, esta página só abre no seu ambiente padrão.</div>' +
      '<p><a class="link" href="index.html">← Início</a></p>');
    return;
  }

  if(!getMcpToken()){
    renderShell('<div class="banner">Para ver e alterar as preferências desta conta é preciso entrar de novo no assistente. ' +
      'É a mesma senha do login de sempre.</div>' +
      '<div class="actions"><button class="primary" id="signin">Entrar</button></div>');
    document.getElementById("signin").addEventListener("click", () => startOAuth("padrao"));
    return;
  }

  try {
    const result = await loadPreferences();
    prefs = result.data;
    prefsStale = result.stale;
  } catch(e){
    if(e.name === "PrefsAuthError"){
      renderShell('<div class="banner">Sua sessão expirou. Entre de novo para ver as preferências.</div>' +
        '<div class="actions"><button class="primary" id="signin">Entrar</button></div>');
      document.getElementById("signin").addEventListener("click", () => startOAuth("padrao"));
      return;
    }
    renderShell('<p class="msg err">Não foi possível carregar as preferências (' + esc(e.message) + ').</p>' +
      '<p><a class="link" href="index.html">← Início</a></p>');
    return;
  }

  render();
  loadGroupsLater();
  resolveAllowlistNamesLater();
}

// The group list comes from this person's own WhatsApp bridge, which is on
// the household LAN - so it can be slow or absent while the rest of the page
// is perfectly usable. Fetched after the first paint, never blocking it.
async function loadGroupsLater(){
  try { groups = await loadWhatsappGroups(); }
  // The server itself never throws here - a dead bridge is a 200 carrying
  // {reachable:false, reason}. This catch only fires if the request to the
  // MCP SERVER failed (network/CORS/expired token), which is a different
  // problem from the bridge being slow - keep the two reasons distinguishable
  // rather than collapsing both into one silent guess.
  catch(e){ groups = { groups: [], reachable: false, reason: e.message }; }
  const box = document.getElementById("groups-box");
  if(box) box.innerHTML = groupsHtml();
  wireGroupRows();
}

function render(){
  const eff = prefs.effective;
  const writable = prefs.writable !== false;

  let html = header();

  if(prefsStale){
    html += '<div class="banner warn">Mostrando os últimos valores conhecidos — o assistente não respondeu agora. ' +
      'Dá para ler, mas não dá para salvar até ele voltar.</div>';
  } else if(!writable){
    html += '<div class="banner warn">' + esc(prefs.writableReason || "As preferências estão em modo somente leitura.") + '</div>';
  }

  // --- Conta ---
  html += '<h3>Conta</h3>' +
    field("displayName", "Como o assistente chama você", eff.displayName || "",
      "Aparece no resumo diário e nos avisos.") +
    saveRow("identity", "Salvar", writable && !prefsStale);

  // --- WhatsApp ---
  html += '<h3>WhatsApp</h3>' +
    field("selfNumber", "Seu número (conversa com você mesmo)", eff.whatsapp.selfNumber || "",
      "É por aqui que o resumo da manhã encontra os recados que você manda para si mesmo. Deixe em branco para não usar.") +
    '<div class="field"><label>Grupos silenciados no resumo diário</label>' +
    '<p class="hint">Grupos marcados aqui não entram no resumo da manhã. Uma busca comum continua enxergando todos.</p>' +
    '<div id="groups-box">' + groupsHtml() + '</div></div>' +
    saveRow("whatsapp", "Salvar", writable && !prefsStale);

  // --- Limites ---
  html += '<h3>Limites por hora</h3>' +
    '<p class="hint" style="margin:0 0 10px">Quantas vezes o assistente pode fazer cada coisa. Zero desliga a ação para esta conta.</p>' +
    limitRow("sendMessagePerHour", "Enviar WhatsApp", "mensagens enviadas diretamente por você") +
    limitRow("draftMailPerHour", "Rascunhos de e-mail", "salvos na sua pasta de rascunhos") +
    limitRow("extendedSearchContactsPerDay", "Buscas longas (por dia)", "contatos novos com histórico além de 30 dias") +
    (eff.rateLimits.magaWritePerHour !== undefined
      ? limitRow("magaWritePerHour", "Alterações no app", "tarefas, compras, estoque e eventos") : "") +
    saveRow("rateLimits", "Salvar", writable && !prefsStale);

  // --- Contatos permitidos (security tier) ---
  html += '<h3>Quem o assistente pode contatar</h3>' +
    '<p class="hint" style="margin:0 0 10px">Só estes contatos podem receber uma mensagem enviada pelo assistente. ' +
    'Alterar esta lista pede a sua senha de novo — é a proteção que impede uma mensagem recebida de virar um envio.</p>' +
    '<div class="field" data-field="sendAllowlist"><label>WhatsApp</label>' +
    '<div id="wa-allow">' + allowRowsHtml(eff.whatsapp.sendAllowlist || [], "wa") + '</div>' +
    '<div class="addrow">' +
      '<input type="text" inputmode="numeric" id="wa-new" placeholder="Número com DDD">' +
      '<button class="link" id="wa-check">Verificar</button>' +
      '<button class="link" id="wa-add">Adicionar</button>' +
      '<p class="resolved" id="wa-resolved"></p>' +
    '</div><p class="err" hidden></p></div>' +
    saveRow("whatsappAllow", "Salvar contatos do WhatsApp", writable && !prefsStale) +
    '<div class="field" data-field="mailAllowlist" style="margin-top:18px"><label>E-mail</label>' +
    '<div id="mail-allow">' + allowRowsHtml(eff.mail.sendAllowlist || [], "mail") + '</div>' +
    '<div class="addrow">' +
      '<input type="text" inputmode="email" id="mail-new" placeholder="endereco@exemplo.com">' +
      '<button class="link" id="mail-add">Adicionar</button>' +
    '</div><p class="err" hidden></p></div>' +
    saveRow("mailAllow", "Salvar contatos de e-mail", writable && !prefsStale);

  // --- Conta: senha e sessões ---
  html += '<h3>Senha</h3>' +
    '<div class="field" data-field="currentPassword">' +
      '<label for="pw-current">Senha atual</label>' +
      '<input type="password" id="pw-current" autocomplete="current-password">' +
      '<p class="err" hidden></p></div>' +
    '<div class="field" data-field="newPassword">' +
      '<label for="pw-new">Nova senha</label>' +
      '<input type="password" id="pw-new" autocomplete="new-password">' +
      '<p class="hint">Pelo menos 10 caracteres. Ao trocar, as suas outras sessões são encerradas — só esta continua.</p>' +
      '<p class="err" hidden></p></div>' +
    '<div class="field" data-field="confirmPassword">' +
      '<label for="pw-confirm">Repita a nova senha</label>' +
      '<input type="password" id="pw-confirm" autocomplete="new-password">' +
      '<p class="err" hidden></p></div>' +
    '<div class="actions"><button class="primary" id="pw-save">Trocar senha</button>' +
    '<span class="saved" id="saved-password"></span></div>';

  html += '<h3>Sessões ativas</h3><div id="sessions-box"><p class="hint">Carregando…</p></div>' +
    '<div class="actions"><button class="link danger" id="revoke-others">Sair dos outros dispositivos</button>' +
    '<span class="saved" id="saved-sessions"></span></div>';

  // --- Backup ---
  html += '<h3>Backup</h3>' +
    '<p class="hint" style="margin:0 0 10px">Estes ajustes ficam só no servidor de casa, que não tem backup automático. ' +
    'Guarde uma cópia depois de mexer em algo.</p>' +
    '<div class="actions">' +
      '<button class="link" id="export">Baixar cópia</button>' +
      '<button class="link" id="import">Restaurar de um arquivo</button>' +
      '<input type="file" id="import-file" accept="application/json" hidden>' +
      '<span class="saved" id="saved-backup"></span>' +
    '</div>';

  // --- Infraestrutura ---
  html += '<details class="infra"><summary>Infraestrutura</summary>' +
    '<p class="note">Estes valores não são editáveis por aqui — eles definem para onde o assistente se conecta e quem ele avisa quando ' +
    'a tarefa da manhã falha. Um erro de digitação deixaria a conta fora do ar sem aviso, então eles são editados direto no ' +
    '<code>people.json</code>, no servidor.</p>' +
    lockedRow("Conta", eff.slug) +
    lockedRow("Permissões", (eff.scopes || []).join(" ")) +
    lockedRow("WhatsApp (consulta)", eff.whatsapp.queryApiUrl) +
    lockedRow("WhatsApp (envio)", eff.whatsapp.bridgeApiUrl) +
    lockedRow("IMAP", eff.mail.imapHost + ":" + eff.mail.imapPort) +
    lockedRow("Usuário de e-mail", eff.mail.user) +
    lockedRow("Agendas", (eff.calendar.labels || []).join(", ") || "nenhuma") +
    lockedRow("Contatos permitidos (WhatsApp)", String((eff.whatsapp.sendAllowlist || []).length)) +
    lockedRow("Contatos permitidos (e-mail)", String((eff.mail.sendAllowlist || []).length)) +
    (eff.alerts ? lockedRow("Avisos de falha vão para", eff.alerts.ownerPhone) : "") +
    (eff.maga ? lockedRow("Ambiente padrão", eff.maga.defaultWebEnvironment || "—") : "") +
    '</details>';

  root.innerHTML = html;
  wireMenuButton();
  wireGroupRows();
  document.querySelectorAll("[data-save]").forEach(btn => {
    btn.addEventListener("click", () => saveSection(btn.dataset.save, btn));
  });
  wireAllowlists();
  wirePassword();
  wireBackup();
  loadSessionsLater();
}

// --- allow-lists -------------------------------------------------------------

// Entries are rendered from the DOM itself rather than from a parallel array:
// the list is short, and one source of truth means an add or a remove cannot
// disagree with what is on screen when Salvar is pressed.
function allowRowsHtml(entries, kind){
  if(!entries.length) return '<p class="hint">Ninguém liberado — o assistente não consegue enviar nada.</p>';
  return entries.map(e => {
    const value = typeof e === "string" ? e : e.number;
    const label = typeof e === "string" ? "" : (e.label || "");
    return '<div class="entry" data-kind="' + kind + '" data-value="' + esc(value) + '">' +
      '<span class="who">' + esc(label || value) + (label ? '<span>' + esc(value) + '</span>' : '') + '</span>' +
      '<button class="icon-btn" title="Remover" data-remove>🗑</button></div>';
  }).join("");
}

// Muted groups always show a live-resolved name because groupsHtml() reads
// it fresh from the person's own recent messages on every load, regardless
// of how a group ended up muted. The WhatsApp allow-list did not get the
// same treatment: a label is only ever captured at the moment an entry is
// ADDED through "Verificar" + "Adicionar" here, so anything already in
// people.json - which is every entry that existed before this page did -
// has no label and rendered as a bare number forever. This resolves those
// after first paint, the same way muted-group names are: never blocking
// the initial render, and never writing the resolved name back to the
// store - it is a display aid, not a silent edit of what was configured.
//
// SEQUENTIAL on purpose, not Promise.all: this calls the person's own
// WhatsApp bridge, a single process on a LAN box with no real concurrency
// - firing every row at once needlessly piles requests onto it, and made
// "still resolving" and "tried and found nothing" look identical on
// screen (both just sat there as a bare number), which is exactly what
// made a real problem here impossible to tell apart from normal delay.
// "· verificando…" makes the in-flight state visible; a failure or a
// zero-match result reverts to the plain number, never left showing
// "verificando" forever.
async function resolveAllowlistNamesLater(){
  const rows = [...document.querySelectorAll('.entry[data-kind="wa"]')]
    .filter(el => !el.querySelector(".who span"));
  for(const el of rows){
    const number = el.dataset.value;
    const who = el.querySelector(".who");
    const original = who.textContent;
    who.textContent = number + " · verificando…";
    try {
      const r = await lookupWhatsappContact(number);
      if(r.reachable && r.matches && r.matches.length === 1){
        who.textContent = r.matches[0].name;
        who.insertAdjacentHTML("beforeend", "<span>" + esc(number) + "</span>");
        continue;
      }
    } catch(_){ /* best effort */ }
    who.textContent = original;
  }
}

function allowValues(kind){
  return [...document.querySelectorAll('.entry[data-kind="' + kind + '"]')].map(el => ({
    value: el.dataset.value,
    label: el.querySelector(".who").firstChild.textContent,
  }));
}

function wireAllowlists(){
  document.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => btn.closest(".entry").remove());
  });

  const waNew = document.getElementById("wa-new");
  const waResolved = document.getElementById("wa-resolved");

  // Resolving the number to a NAME before it is committed is the whole
  // anti-typo affordance here: a wrong digit is otherwise invisible until a
  // message reaches a stranger.
  document.getElementById("wa-check").addEventListener("click", async () => {
    const digits = waNew.value.replace(/\D/g, "");
    if(!digits) return;
    waResolved.className = "resolved";
    waResolved.textContent = "Procurando…";
    try {
      const r = await lookupWhatsappContact(digits);
      if(!r.reachable) waResolved.textContent = "Não deu para verificar agora (o WhatsApp da casa não respondeu).";
      else if(!r.matches.length) waResolved.textContent = "Número não encontrado nos seus contatos — confira antes de adicionar.";
      else { waResolved.className = "resolved ok"; waResolved.textContent = "É " + r.matches.map(m => m.name).join(", ") + "."; }
    } catch(e){ waResolved.textContent = "Não deu para verificar (" + e.message + ")."; }
  });

  document.getElementById("wa-add").addEventListener("click", () => {
    const digits = waNew.value.replace(/\D/g, "");
    if(digits.length < 10){ waResolved.className = "resolved"; waResolved.textContent = "Número muito curto."; return; }
    // Exact-string dedupe, matching how the server itself decides who is
    // allowed (security/allowlist.js compares digit strings directly, with
    // no country-code normalization) - so "the same as an existing entry"
    // means the same digit string, not an attempt to guess that "5511..."
    // and "11..." are the same underlying number.
    if(allowValues("wa").some(e => e.value === digits)){
      waResolved.className = "resolved";
      waResolved.textContent = "Esse número já está na lista.";
      return;
    }
    const label = waResolved.className.includes("ok") ? waResolved.textContent.replace(/^É /, "").replace(/\.$/, "") : "";
    appendAllowEntry("wa-allow", "wa", digits, label);
    waNew.value = ""; waResolved.textContent = ""; waResolved.className = "resolved";
  });

  document.getElementById("mail-add").addEventListener("click", () => {
    const input = document.getElementById("mail-new");
    const address = input.value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(address)){ fieldError("mailAllowlist", "Endereço inválido."); return; }
    if(allowValues("mail").some(e => e.value === address)){
      fieldError("mailAllowlist", "Esse endereço já está na lista.");
      return;
    }
    appendAllowEntry("mail-allow", "mail", address, "");
    input.value = "";
  });
}

function appendAllowEntry(boxId, kind, value, label){
  const box = document.getElementById(boxId);
  const empty = box.querySelector(".hint");
  if(empty) empty.remove();
  box.insertAdjacentHTML("beforeend",
    '<div class="entry" data-kind="' + kind + '" data-value="' + esc(value) + '">' +
    '<span class="who">' + esc(label || value) + (label ? '<span>' + esc(value) + '</span>' : '') + '</span>' +
    '<button class="icon-btn" title="Remover" data-remove>🗑</button></div>');
  const btn = box.lastElementChild.querySelector("[data-remove]");
  btn.addEventListener("click", () => btn.closest(".entry").remove());
}

// --- password ----------------------------------------------------------------

function wirePassword(){
  document.getElementById("pw-save").addEventListener("click", async () => {
    const current = document.getElementById("pw-current").value;
    const next = document.getElementById("pw-new").value;
    const confirm = document.getElementById("pw-confirm").value;
    const status = document.getElementById("saved-password");
    document.querySelectorAll('[data-field$="assword"] .err').forEach(el => { el.hidden = true; });

    if(next !== confirm){ fieldError("confirmPassword", "As duas senhas não são iguais."); return; }
    status.textContent = "Salvando…";
    try {
      const r = await changePassword(current, next);
      status.textContent = r.otherSessionsRevoked
        ? "Senha trocada. " + r.otherSessionsRevoked + " outra(s) sessão(ões) encerrada(s)."
        : "Senha trocada.";
      ["pw-current", "pw-new", "pw-confirm"].forEach(id => { document.getElementById(id).value = ""; });
      loadSessionsLater();
    } catch(e){
      status.textContent = "";
      if(await handledAuthFailure(e)) return;
      const field = e.body && e.body.field ? e.body.field : null;
      if(field) fieldError(field, e.message);
      else alert("Não foi possível trocar a senha: " + e.message);
    }
  });

  document.getElementById("revoke-others").addEventListener("click", async () => {
    const status = document.getElementById("saved-sessions");
    status.textContent = "Encerrando…";
    try {
      const r = await revokeOtherSessions();
      status.textContent = r.revoked + " sessão(ões) encerrada(s).";
      loadSessionsLater();
    } catch(e){
      status.textContent = "";
      if(await handledAuthFailure(e)) return;
      alert("Não foi possível encerrar as outras sessões: " + e.message);
    }
  });
}

async function loadSessionsLater(){
  const box = document.getElementById("sessions-box");
  if(!box) return;
  try {
    const r = await loadSessions();
    if(!r.sessions.length){ box.innerHTML = '<p class="hint">Nenhuma sessão registrada.</p>'; return; }
    box.innerHTML = r.sessions.map(sn =>
      '<div class="entry"><span class="who">' + esc(sn.clientId) + (sn.current ? " (este dispositivo)" : "") +
      '<span>entrou em ' + esc(sn.signedInAt ? fmtDateTime(sn.signedInAt) : "data desconhecida") + '</span></span></div>').join("");
  } catch(_){
    box.innerHTML = '<p class="hint">Não deu para listar as sessões agora.</p>';
  }
}

// --- backup ------------------------------------------------------------------

function wireBackup(){
  document.getElementById("export").addEventListener("click", async () => {
    const status = document.getElementById("saved-backup");
    status.textContent = "Preparando…";
    try {
      const data = await exportPreferences();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "maga-preferencias-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      status.textContent = "Cópia baixada.";
    } catch(e){ status.textContent = ""; alert("Não foi possível baixar: " + e.message); }
  });

  const file = document.getElementById("import-file");
  document.getElementById("import").addEventListener("click", () => file.click());
  file.addEventListener("change", async () => {
    const status = document.getElementById("saved-backup");
    if(!file.files || !file.files[0]) return;
    let payload;
    try { payload = JSON.parse(await file.files[0].text()); }
    catch(_){ alert("Esse arquivo não é uma cópia válida."); file.value = ""; return; }
    if(!await confirmModal("Restaurar preferências deste arquivo? Os valores atuais serão substituídos.")){ file.value = ""; return; }
    status.textContent = "Restaurando…";
    try {
      const r = await importPreferences(payload);
      prefs.effective = r.effective;
      // render() rebuilds the whole page, so the confirmation has to be
      // written into the FRESH element afterwards - writing it first put the
      // message on a node that was thrown away microseconds later.
      render();
      resolveAllowlistNamesLater();
      const fresh = document.getElementById("saved-backup");
      if(fresh) fresh.textContent = "Restaurado: " + (r.imported.join(", ") || "nada");
    } catch(e){
      status.textContent = "";
      if(await handledAuthFailure(e)) return;
      alert("Não foi possível restaurar: " + e.message);
    } finally { file.value = ""; }
  });
}

// --- shared error handling ---------------------------------------------------

function fieldError(field, message){
  const holder = document.querySelector('[data-field="' + field + '"] .err');
  if(holder){ holder.textContent = message; holder.hidden = false; }
  else alert(message);
}

// A 428 means "type your password again", not "something broke" - so it gets
// a confirm and a trip through the login form rather than an error toast.
async function handledAuthFailure(e){
  if(e.name === "PrefsReauthError"){
    if(await confirmModal(e.message + " Você será levado à tela de login e volta para cá em seguida.")){
      startPreferencesReauth();
    }
    return true;
  }
  if(e.name === "PrefsAuthError"){
    alert("Sua sessão expirou. Entre de novo.");
    startOAuth("padrao");
    return true;
  }
  return false;
}

function field(name, label, value, hint){
  return '<div class="field" data-field="' + name + '">' +
    '<label for="f-' + name + '">' + esc(label) + '</label>' +
    '<input type="text" id="f-' + name + '" value="' + esc(value) + '">' +
    (hint ? '<p class="hint">' + esc(hint) + '</p>' : '') +
    '<p class="err" hidden></p></div>';
}

function limitRow(key, label, hint){
  const bounds = (prefs.bounds && prefs.bounds.rateLimits && prefs.bounds.rateLimits[key]) || { min: 0, max: 99 };
  const value = prefs.effective.rateLimits[key];
  return '<div class="limit" data-field="' + key + '">' +
    '<span class="name">' + esc(label) + '<span>' + esc(hint) + ' · máximo ' + bounds.max + '</span></span>' +
    '<input type="text" inputmode="numeric" id="f-' + key + '" value="' + esc(String(value ?? "")) + '">' +
    '<p class="err" hidden></p>' +
    '</div>';
}

function saveRow(section, label, enabled){
  return '<div class="actions">' +
    '<button class="primary" data-save="' + section + '"' + (enabled ? "" : " disabled") + '>' + esc(label) + '</button>' +
    '<span class="saved" id="saved-' + section + '"></span></div>';
}

function lockedRow(k, v){
  return '<div class="locked"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v || "—") + '</span></div>';
}

function groupsHtml(){
  const muted = prefs.effective.whatsapp.excludedGroups || [];
  if(!groups){
    return '<p class="hint">Procurando os seus grupos…</p>' + mutedOnlyList(muted);
  }
  if(!groups.reachable){
    // The bridge is on the LAN and the phone may be off it - saying which
    // groups are muted still lets someone UN-mute one, which is the edit
    // most likely to be urgent ("why didn't the summary mention that?").
    // The actual reason is shown, not guessed at: this call has genuinely
    // timed out before on a perfectly healthy bridge, because it fetches
    // every message in a 14-day window with no pagination - a real cost
    // that scales with how much the household talks, not a sign anything
    // is broken.
    return '<p class="hint">Não deu para listar os grupos agora' +
      (groups.reason ? ' (' + esc(groups.reason) + ')' : ' (o WhatsApp da casa não respondeu)') + '. ' +
      'Os que já estão silenciados continuam abaixo e podem ser liberados.</p>' + mutedOnlyList(muted);
  }
  const known = groups.groups.slice();
  // A muted group that hasn't spoken in two weeks won't be in the recent
  // list - it must still render, or saving would silently un-mute it.
  muted.forEach(jid => {
    if(!known.some(g => g.jid === jid)) known.push({ jid, label: jid });
  });
  if(!known.length) return '<p class="hint">Nenhum grupo encontrado nos últimos 14 dias.</p>';
  return '<div class="grouplist">' + known.map(g =>
    '<label class="grouprow"><input type="checkbox" data-jid="' + esc(g.jid) + '"' +
    (muted.includes(g.jid) ? " checked" : "") + '>' +
    '<span class="label">' + esc(g.label) +
    (g.label === g.jid ? "" : '<span class="jid">' + esc(g.jid) + '</span>') +
    '</span></label>').join("") + '</div>';
}

function mutedOnlyList(muted){
  if(!muted.length) return '<p class="hint">Nenhum grupo silenciado.</p>';
  return '<div class="grouplist">' + muted.map(jid =>
    '<label class="grouprow"><input type="checkbox" data-jid="' + esc(jid) + '" checked>' +
    '<span class="label">' + esc(jid) + '</span></label>').join("") + '</div>';
}

function wireGroupRows(){ /* checkboxes are read at save time - nothing to wire yet */ }

function collectSection(section){
  if(section === "identity"){
    return { displayName: document.getElementById("f-displayName").value.trim() };
  }
  if(section === "whatsapp"){
    const checked = [...document.querySelectorAll("[data-jid]")].filter(c => c.checked);
    const byJid = new Map((groups?.groups || []).map(g => [g.jid, g.label]));
    return {
      selfNumber: document.getElementById("f-selfNumber").value.trim(),
      excludedGroups: checked.map(c => ({ jid: c.dataset.jid, label: byJid.get(c.dataset.jid) || "" })),
    };
  }
  if(section === "whatsappAllow"){
    return { sendAllowlist: allowValues("wa").map(e => ({ number: e.value, label: e.label })) };
  }
  if(section === "mailAllow"){
    return { sendAllowlist: allowValues("mail").map(e => e.value) };
  }
  if(section === "rateLimits"){
    const out = {};
    Object.keys(prefs.bounds.rateLimits).forEach(key => {
      const el = document.getElementById("f-" + key);
      if(el) out[key] = Number(el.value.replace(/\D/g, "") || "0");
    });
    return out;
  }
  return {};
}

async function saveSection(section, btn){
  const status = document.getElementById("saved-" + section);
  document.querySelectorAll(".field .err, .limit .err").forEach(el => { el.hidden = true; });
  btn.disabled = true;
  status.textContent = "Salvando…";
  try {
    const serverSection = section === "whatsappAllow" ? "whatsapp" : section === "mailAllow" ? "mail" : section;
    const data = await savePreferenceSection(serverSection, collectSection(section));
    prefs.effective = data.effective;
    prefs.overrides = data.overrides;
    status.textContent = "Salvo.";
    setTimeout(() => { if(status) status.textContent = ""; }, 2500);
  } catch(e){
    status.textContent = "";
    if(await handledAuthFailure(e)) return;
    // A 400 names the exact field, so the message lands next to the input
    // that caused it rather than as a generic failure at the top.
    const field = e.body && e.body.field ? String(e.body.field).split(".").pop() : null;
    const holder = field ? document.querySelector('[data-field="' + field + '"] .err') : null;
    if(holder){ holder.textContent = e.message; holder.hidden = false; }
    else alert("Não foi possível salvar: " + e.message);
  } finally {
    btn.disabled = false;
  }
}

load();
