<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notas">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Notas</title>
<!--
  Data-free shell for Notas. A notebook is either OBJECT-BACKED (one
  per cliente/evento/produto/receita/fornecedor/ingrediente/insumo,
  created lazily the moment a note is first written against that object —
  see shared-notes.js, used identically on all seven of those detail
  pages) or USER-CREATED (no object behind it, made from the "+ Novo
  caderno" button here). The default (no search) list shows only
  USER-CREATED notebooks — an object-backed one already has a home on its
  own object's page, and listing every object that's ever had a note
  written against it here would just be clutter. A search across every
  note's text still reaches object-backed notebooks too (renderList()'s
  no-search branch is the one place this filter lives). Both kinds render
  through the SAME wireNotesPanel() once opened — this page always opens
  by notebook id (kind:"notebook"), never by {kind, ref}, since every
  notebook already has an id by the time it's reachable here.

  Env-gated like Hoje/Tarefas: personal daily data and personal notes are
  the same class of thing, so this page is hidden and blocked on a
  non-default environment the same way (see isDefaultEnv()'s comment in
  shared-api.js).
-->
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-page.css">
<link rel="stylesheet" href="shared-menu.css">
<link rel="stylesheet" href="shared-modal.css">
<link rel="stylesheet" href="shared-toast.css">
<link rel="stylesheet" href="shared-notes.css">
<style>
  /* ---- page chrome (body/.wrap/header/.hleft/h1/.subheader/#back/
     .searchrow/.row shell/.detail-actions/.detail-title/.detail-title-wrap/
     .nb-icon) now lives in shared-page.css — see that file for what moved
     and why. This page's own .nb-title/.nb-title-wrap became
     .detail-title/.detail-title-wrap (navHeader()'s call sites and every
     JS reference were updated to match). Only the genuinely page-specific
     parts of .row (its flex layout) and the .detail-actions right-
     alignment (object-backed notebooks never carry these buttons, so this
     only ever affects Renomear/Remover, which want to sit flush right
     rather than shared-page.css's default left-aligned flow) stay here. */
  .row{display:flex;align-items:center;gap:12px}
  .row .ic{font-size:20px;flex:none}
  .row .body{flex:1;min-width:0}
  .addrow{display:flex;gap:8px;margin-top:14px}
  .addrow input[type=text]{
    flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
  }
  .addrow input.emoji{width:52px;flex:none;text-align:center;font-size:18px;padding:10px 6px}
  .search-hits .row .snippet{display:block;font-size:12.5px;color:var(--text);margin:2px 0 0;white-space:pre-wrap;word-wrap:break-word}
  .detail-actions{justify-content:flex-end}
  .card.pad{padding:16px}
</style>
</head>
<body>
<div class="wrap">
<div id="root"><p class="msg">Carregando…</p></div>
</div>

<script>
const root = document.getElementById("root");

const CURRENT_PAGE = "notas";

const PAGE_LOGIN = {
  title: "Notas",
  subtitle: "Faça o seu login para acessar suas notas.",
  onSuccess: () => load(),
};
</script>
<script src="shared-api.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-nav.js"></script>
<script src="shared-history.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-format.js"></script>
<script src="shared-inputs.js"></script>
<script src="shared-notes.js"></script>
<script src="shared-pwa.js"></script>
<script>

let notebooks = [];

// Where an object-backed notebook's own record actually lives — the same
// seven pages this panel is embedded in. Not every kind needs its own
// entry keyed differently: insumo is the one exception (gtin, not id).
const NOTEBOOK_KIND_LINKS = {
  cliente:    (o) => ({ label: o.name, href: "clientes.html?id=" + encodeURIComponent(o.id) }),
  evento:     (o) => ({ label: o.name, href: "eventos.html?id=" + encodeURIComponent(o.id) }),
  produto:    (o) => ({ label: o.name, href: "produtos.html?id=" + encodeURIComponent(o.id) }),
  receita:    (o) => ({ label: o.name, href: "receitas.html?id=" + encodeURIComponent(o.id) }),
  fornecedor: (o) => ({ label: o.name, href: "fornecedores.html?id=" + encodeURIComponent(o.id) }),
  ingredient: (o) => ({ label: o.name, href: "ingredientes.html?id=" + encodeURIComponent(o.id) }),
  insumo:     (o) => ({ label: o.name, href: "insumos.html?gtin=" + encodeURIComponent(o.gtin) }),
};
const KIND_ICON = {
  cliente: "👤", evento: "🥂", produto: "🏷️", receita: "📖",
  fornecedor: "🚚", ingredient: "🧂", insumo: "🥖",
};

function notebookInfo(nb){
  for(const kind of Object.keys(NOTEBOOK_KIND_LINKS)){
    if(nb[kind]) return Object.assign({ kind }, NOTEBOOK_KIND_LINKS[kind](nb[kind]));
  }
  return { kind: null, label: nb.name || "Caderno sem nome", href: null, icon: nb.emoji };
}

// navHeader()/wireNav() now live in shared-nav.js. This page's list screen
// is a plain navHeader("Notas") (no opts, no subheader); the notebook
// detail screen below passes opts with backLabel "Cadernos" (NOT "Notas" —
// the h1 above stays "Notas" throughout via listTitle, since this page's
// own header always says so, only the subheader's back button names where
// it goes back TO) and the notebook's own name/icon.

// Back out of an open notebook to the list — shared by the detail-loading
// shell below (before notebooks[] is even fetched) and openNotebook()'s own
// back button, so both go through the exact same path.
// Now a thin wrapper over the shared router (shared-history.js): it used
// to replaceState the ?id= away, which is exactly what made hardware Back
// leave the PWA from an open notebook. Kept as a named function because
// both shells and the detail header already reference it by name.
function backToList(){ route.navToList(); }

// renderListShell/renderDetailShell — used for every screen that isn't the
// fully-rendered list/notebook-detail itself (the loading placeholder, the
// "republish the Edge Function" message, the generic-failure retry state),
// so the header/back-link never disappears mid-load the way a bare
// `root.innerHTML = 'Carregando…'` would. Which shell to use is decided by
// whether the URL names a notebook (?id=) BEFORE notebooks[] is fetched —
// rendering the list shell first and swapping to the detail shell a beat
// later would just move the flash from the body to the header.
function renderListShell(inner){
  root.innerHTML = navHeader("Notas") + inner;
  wireNav();
}
function renderDetailShell(inner){
  root.innerHTML = navHeader("", { backLabel:"Cadernos", backAction: backToList, listTitle:"Notas" }) + inner;
  wireNav(backToList);
}

// ---- list screen ----

async function load(){
  if(!getPass()){ showLogin(); return; }
  if(!isDefaultEnv()){
    root.innerHTML = navHeader("Notas") + personalPageBlockedHtml();
    wireNav();
    return;
  }
  const wantedId = new URLSearchParams(location.search).get("id");
  if(wantedId) renderDetailShell('<p class="msg">Carregando…</p>');
  else renderListShell('<p class="msg">Carregando…</p>');
  try{
    const res = await api("notebooks");
    notebooks = res.notebooks || [];
    route.routeFromUrl();
  }catch(e){
    if(e.unauthorized){
      localStorage.removeItem(PASS_KEY);
      showLogin("Senha incorreta.");
    }else if(e.badRequest && e.body && e.body.error === "bad action"){
      renderListShell('<p class="msg">Notas ainda não disponíveis — republique a Edge Function.</p>');
    }else{
      renderListShell('<p class="msg err">Não foi possível carregar agora.</p>' +
        '<p class="msg"><button class="link" onclick="load()">Tentar novamente</button></p>');
    }
  }
}

function notebookRowHtml(nb){
  const info = notebookInfo(nb);
  const icon = info.kind ? (KIND_ICON[info.kind] || "🗒️") : (nb.emoji || "🗒️");
  const count = nb.note_count || 0;
  // A real <button>: this is the page's primary navigation and it has to
  // be reachable by keyboard. No nested control inside, so the conversion
  // is legal; <button> takes phrasing content only, hence the <span>s.
  return '<button type="button" class="row" data-id="' + esc(nb.id) + '">' +
    '<span class="ic">' + esc(icon) + '</span>' +
    '<span class="body">' +
      '<span class="nm">' + esc(info.label) + '</span>' +
      '<span class="meta">' + count + (count === 1 ? " nota" : " notas") + '</span>' +
    '</span>' +
  '</button>';
}

// A note whose body or title matches, across every notebook — folded
// the same way every other search box in this app is (shared-format.js's
// foldSearchText), fetched and folded client-side since there are no
// server-side accent-insensitive indexes here (see that function's own
// comment on why that's a reasonable, not a lazy, choice at this scale).
//
// The cache is deliberately NOT written on failure. Caching `[]` after a
// failed fetch made three different situations render identically as
// "Nenhuma nota encontrada." — a network error, an expired session, and an
// account that genuinely has no notes — and, because `if(!allNotesCache)`
// then short-circuits on every later keystroke, one transient failure
// disabled cross-notebook search for the rest of the page's life. Leaving
// it null means the next keystroke retries; letting the error propagate
// means a 401 reaches handleAuthError and the session-expiry re-login
// actually fires, instead of being swallowed into an empty result.
let allNotesCache = null;
async function searchHits(term){
  if(!allNotesCache){
    allNotesCache = (await api("notes_all")).notes || [];
  }
  const folded = foldSearchText(term);
  return allNotesCache.filter(n =>
    foldSearchText(n.title || "").includes(folded) || foldSearchText(n.body || "").includes(folded)
  );
}

// Every note write invalidates the search cache. Without this, a note
// created or edited in an open notebook was invisible to the search box
// until a full page reload — the cache is filled once and was never
// dropped.
function invalidateNotesCache(){ allNotesCache = null; }
// shared-notes.js calls this after every successful note write. This page
// is the only consumer — it is the only one holding a second, page-wide
// view of the same notes.
window.onNotesChanged = invalidateNotesCache;

function noteHitRowHtml(n){
  const info = n.notebook ? notebookInfo(n.notebook) : { label: "Caderno" };
  return '<button type="button" class="row" data-notebook="' + esc(n.notebook_id) + '">' +
    '<span class="ic">' + esc(info.kind ? (KIND_ICON[info.kind] || "🗒️") : (info.icon || "🗒️")) + '</span>' +
    '<span class="body">' +
      '<span class="nm">' + esc(noteTitle(n)) + '</span>' +
      '<span class="meta">' + esc(info.label) + '</span>' +
      '<span class="snippet">' + esc(n.body || "") + '</span>' +
    '</span>' +
  '</button>';
}

// renderList awaits (searchHits can hit the network whenever the cache is
// cold — which, now that a note write drops it, happens mid-session and
// not only on first search). Two renders in flight can therefore finish
// out of order, and the LOSER writing root.innerHTML last wins the screen:
// type fast, or search right after writing a note, and a stale result
// paints over a newer one. Each call takes a ticket; only the newest is
// allowed to touch the DOM.
let renderListSeq = 0;
async function renderList(term){
  const seq = ++renderListSeq;
  const q = (term || "").trim();
  let listHtml;
  if(q){
    // searchHits can throw now (see its comment). An expired session hands
    // the page back to the login screen; anything else says the search
    // itself failed, which is a different statement from "found nothing" —
    // and the cache stays null, so the next keystroke tries again.
    let hits;
    try{
      hits = await searchHits(q);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, () => renderList(""));
      listHtml = '<p class="msg err small">Não foi possível buscar agora.</p>';
      hits = null;
    }
    if(hits) listHtml = hits.length === 0
      ? '<p class="msg small">Nenhuma nota encontrada.</p>'
      : '<div class="card search-hits" id="hits-card">' + hits.map(noteHitRowHtml).join("") + '</div>';
  }else{
    // The default (no search) list shows only USER-CREATED notebooks —
    // an object-backed one (a cliente, an insumo, ...) already has a home
    // on its own detail page, and as notes accumulate across the whole
    // app this list would otherwise fill with entries nobody came here
    // looking for. They're never hidden, only not listed by default: the
    // search above still reaches every note via notes_all, object-backed
    // included, and opening one from a hit (or a direct ?id= link) works
    // exactly as before.
    const userNotebooks = notebooks.filter(nb => !notebookInfo(nb).kind);
    listHtml = userNotebooks.length === 0
      ? '<p class="msg small">Nenhum caderno seu ainda. Notas escritas em um cliente, ' +
        'evento, produto, receita, fornecedor, ingrediente ou insumo continuam na página ' +
        'do próprio objeto — busque aqui para encontrá-las, ou crie um caderno seu.</p>'
      : '<div class="card" id="nb-card">' + userNotebooks.map(notebookRowHtml).join("") + '</div>';
  }

  // A newer render started while this one was awaiting — drop this result
  // rather than paint it over the fresher one.
  if(seq !== renderListSeq) return;

  root.innerHTML = navHeader("Notas") +
    '<div class="searchrow">' +
      '<input type="search" id="search" placeholder="Buscar em todas as notas…" value="' + esc(q) + '">' +
    '</div>' +
    listHtml +
    '<div class="addrow">' +
      '<input type="text" id="new-notebook-emoji" class="emoji" placeholder="🗒️">' +
      '<input type="text" id="new-notebook-name" placeholder="Novo caderno">' +
      '<button class="primary small" id="add-notebook-btn">+ Caderno</button>' +
    '</div>';

  wireNav();

  const searchEl = document.getElementById("search");
  searchEl.focus();
  searchEl.setSelectionRange(q.length, q.length);
  let searchTimer = null;
  searchEl.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => renderList(searchEl.value), 200);
  });

  root.querySelectorAll(".row[data-id]").forEach(row => {
    row.addEventListener("click", () => route.navToDetail(row.dataset.id));
  });
  root.querySelectorAll(".row[data-notebook]").forEach(row => {
    row.addEventListener("click", () => route.navToDetail(row.dataset.notebook));
  });

  const addBtn = document.getElementById("add-notebook-btn");
  const nameInput = document.getElementById("new-notebook-name");
  const emojiInput = document.getElementById("new-notebook-emoji");
  limitToOneEmoji(emojiInput);
  const addNotebook = async () => {
    const name = nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }
    const emoji = emojiInput.value.trim();
    addBtn.disabled = true;
    try{
      const res = await api("notebook_create", { name, emoji: emoji || undefined });
      notebooks.unshift(Object.assign({ note_count: 0 }, res.notebook));
      route.navToDetail(res.notebook.id);
    }catch(e){
      addBtn.disabled = false;
      if(e.unauthorized) return handleAuthError(e, load);
      listToast("Não foi possível criar o caderno", true);
    }
  };
  addBtn.addEventListener("click", addNotebook);
  nameInput.addEventListener("keydown", e => { if(e.key === "Enter") addNotebook(); });
  emojiInput.addEventListener("keydown", e => { if(e.key === "Enter") addNotebook(); });
}

// ---- notebook detail ----

// The label after "Ver " in the object-backed notebook's button — mirrors
// NOTEBOOK_KIND_LINKS' own key set.
const KIND_OBJ_LABEL = {
  cliente: "cliente", evento: "evento", produto: "produto", receita: "receita",
  fornecedor: "fornecedor", ingredient: "ingrediente", insumo: "insumo",
};

// Same shape as compras.html's openListEditModal -- a user-created
// notebook's name/emoji are the two fields it owns, same as a shopping
// list's. An object-backed notebook never reaches this: its name/emoji
// follow its object (see notebook_rename/_set_emoji refusing otherwise).
function openNotebookEditModal(nb){
  const currentEmoji = nb.emoji || "";
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal-card">' +
      '<h3>Editar caderno</h3>' +
      '<label for="edit-nb-emoji">Ícone (emoji)</label>' +
      '<input type="text" id="edit-nb-emoji" value="' + esc(currentEmoji) + '">' +
      '<label for="edit-nb-name">Nome</label>' +
      '<input type="text" id="edit-nb-name" value="' + esc(nb.name || "") + '">' +
      '<div class="modal-actions">' +
        '<button class="cancel" id="edit-nb-cancel">Cancelar</button>' +
        '<button class="save" id="edit-nb-save">Salvar</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
  };
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
  document.getElementById("edit-nb-cancel").addEventListener("click", close);

  const nameInput = document.getElementById("edit-nb-name");
  limitToOneEmoji(document.getElementById("edit-nb-emoji"));
  nameInput.focus();
  nameInput.select();

  document.getElementById("edit-nb-save").addEventListener("click", async () => {
    const name = nameInput.value.trim();
    const emoji = document.getElementById("edit-nb-emoji").value.trim();
    if(!name){ fieldError(nameInput, "O nome não pode ficar vazio."); return; }
    close();
    const tasks = [];
    if(name !== nb.name) tasks.push(api("notebook_rename", { id: nb.id, name }));
    if(emoji !== currentEmoji) tasks.push(api("notebook_set_emoji", { id: nb.id, emoji: emoji || null }));
    if(tasks.length === 0) return;
    try{
      const results = await Promise.all(tasks);
      Object.assign(nb, results[results.length - 1].notebook);
      route.navToDetail(nb.id);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, load);
      listToast("Não foi possível salvar", true);
    }
  });
}

function openNotebook(id){
  const nb = notebooks.find(n => n.id === id);
  // A stale ?id= (a bookmark to a notebook deleted from another device)
  // used to render a blank "Caderno" screen. One app-wide treatment now.
  if(!nb){ route.routeNotFound("Caderno não encontrado."); return; }
  const info = nb ? notebookInfo(nb) : { kind: null, label: "Caderno", href: null };
  // Same fallback chain as notebookRowHtml/noteHitRowHtml's own icon.
  const icon = info.kind ? (KIND_ICON[info.kind] || "🗒️") : (info.icon || "🗒️");

  // "Ver X" (object-backed) and Renomear/Remover (user-created) never
  // apply to the same notebook - but building one row from whichever
  // applies keeps them visually consistent (same right-aligned button
  // row) instead of two differently-styled treatments.
  const actions = [];
  if(info.href){
    actions.push('<a class="primary small alt" href="' + esc(info.href) + '">Ver ' +
      (KIND_OBJ_LABEL[info.kind] || "objeto") + ' →</a>');
  }
  if(info.kind === null && nb){
    actions.push('<button class="primary small alt" id="edit-nb">✎ Editar</button>');
    actions.push('<button class="primary small alt danger" id="del-nb">🗑 Remover</button>');
  }

  root.innerHTML = navHeader(info.label, { backLabel: "Cadernos", backAction: backToList, listTitle: "Notas", icon }) +
    (actions.length ? '<div class="detail-actions">' + actions.join("") + '</div>' : '') +
    '<div class="card pad notes-card">' + notesPanelHtml() + '</div>';

  wireNav(backToList);
  wireNotesPanel(root.querySelector(".notes-card"), "notebook", id);

  if(info.kind === null && nb){
    document.getElementById("edit-nb").addEventListener("click", () => openNotebookEditModal(nb));
    document.getElementById("del-nb").addEventListener("click", async () => {
      if(!(await confirmModal('Remover o caderno "' + nb.name + '"?', "Remover"))) return;
      try{
        let res = await api("notebook_delete", { id: nb.id });
        if(res.ok === false && res.reason === "has_notes"){
          if(!(await confirmModal(
            "Este caderno tem " + res.notes + (res.notes === 1 ? " nota" : " notas") +
            ". Removê-lo apaga tudo — não dá para desfazer.",
            "Remover mesmo assim"))) return;
          res = await api("notebook_delete", { id: nb.id, force: true });
        }
        notebooks = notebooks.filter(n => n.id !== nb.id);
        listToast("Caderno removido");
        route.navToList();
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, load);
        listToast("Não foi possível remover", true);
      }
    });
  }
}

const route = wireHistoryRoute({
  param: "id",
  openDetail: openNotebook,
  // renderList() takes a search term; the router calls it with none, and
  // an open notebook always returns to an unfiltered list.
  renderList: () => renderList(""),
});

load();
</script>
</body>
</html>
