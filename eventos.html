<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eventos">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Eventos</title>
<!--
  Data-free shell for the Eventos module — one evento (sale, event, order,
  booking) per row, tracked from the first lead through payment. Same pattern as
  every other page here: hosted on public GitHub Pages, holds NO keys and
  NO data, asks for the shared passphrase, then talks only to the gated
  Supabase Edge Function (maga-api).

  An evento can be created by hand at ANY pipeline stage — logging a lead the
  moment an inquiry comes in is as normal a gesture as recording a
  confirmed booking, not something only a future AI-lead-detection pass
  would do. Payments are an editable ledger (evento_pagamentos), not a
  purchased-style flag, because a mistyped amount is a correction, not
  grounds to delete and redo. Confirming a payment is the one genuine
  integration with Financeiro: it auto-posts a receita there in the same
  request, which is what makes the ledger trustworthy without a second
  manual entry.
-->
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-menu.css">
<link rel="stylesheet" href="shared-modal.css">
<link rel="stylesheet" href="shared-toast.css">
<link rel="stylesheet" href="shared-inputs.css">
<style>
  body{
    padding:max(16px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 8px}
  .hleft{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
  .subheader{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0;margin:0 0 8px}
  h1{font-size:20px;font-weight:650;margin:0;min-width:0;overflow-wrap:break-word}
  h2{font-size:17px;font-weight:650;margin:0;min-width:0;overflow-wrap:break-word}
  h3{font-size:14px;font-weight:650;margin:22px 0 8px;color:var(--muted)}
  .searchrow{display:flex;gap:8px;margin:0 0 10px}
  .searchrow input[type=search]{
    flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
    -webkit-appearance:none;
  }
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .chip{
    font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;
    background:rgba(127,127,127,.1);color:var(--muted);border:1px solid transparent;
    transition:background-color .15s ease,color .15s ease;
  }
  .chip.active{background:var(--accent);color:var(--accent-text)}
  #done-wrap{margin-top:16px}
  #done-list{max-height:0;opacity:0;overflow:hidden;transition:max-height .3s ease,opacity .25s ease}
  #done-list.open{opacity:1}
  .done-card{margin-top:8px}
  .row{display:flex;flex-direction:column;gap:6px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background-color .15s ease}
  .row:hover{background:rgba(127,127,127,.06)}
  .row:last-child{border-bottom:none}
  .row .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row .txt{font-size:15px;font-weight:600;margin:0;word-wrap:break-word;flex:1;min-width:0}
  .row .price{font-size:14px;font-weight:650;white-space:nowrap}
  .row .date-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
  .row .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .pill{
    display:inline-block;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:999px;
    white-space:nowrap;
  }
  .pill.st-lead{background:rgba(147,51,234,.14);color:#9333ea}
  .pill.st-orcamento{background:rgba(180,83,9,.14);color:var(--warn)}
  .pill.st-confirmado{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
  .pill.st-entregue{background:rgba(22,163,74,.14);color:#16a34a}
  .pill.st-cancelado{background:rgba(220,38,38,.14);color:var(--danger)}
  .pill.pay-pend{background:rgba(127,127,127,.14);color:var(--muted)}
  .pill.pay-partial{background:rgba(180,83,9,.14);color:var(--warn)}
  .pill.pay-paid{background:rgba(22,163,74,.14);color:#16a34a}
  .pill.pay-overdue{background:rgba(220,38,38,.14);color:var(--danger)}
  @media (prefers-color-scheme: dark){
    .pill.st-lead{color:#c084fc}
    .pill.st-entregue{color:#4ade80}
    .pill.pay-paid{color:#4ade80}
  }
  /* ---- detail ---- */
  .evento-head{margin:0 0 14px}
  .pills-row{display:flex;justify-content:flex-end;gap:6px;margin:0 0 10px}
  .evt-title{font-size:16px;font-weight:650;margin:0;text-align:right;word-wrap:break-word;cursor:pointer}
  .evt-title:hover{opacity:.75}
  .cli-lbl{font-size:12px;color:var(--muted);margin:0 0 6px}
  .cli-block{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;border-radius:12px;background:rgba(127,127,127,.06);margin:10px 0;
  }
  .cli-block .who{min-width:0}
  .cli-block .who .nm{font-size:15px;font-weight:650;margin:0;color:var(--text)}
  .cli-block .who .sub{font-size:12.5px;color:var(--muted);margin:2px 0 0;word-wrap:break-word}
  .cli-block .cli-actions{display:flex;align-items:center;gap:4px;flex:none}
  .statusline, .datefield{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-top:1px solid var(--border);
  }
  .statusline .lbl, .datefield .lbl{font-size:12px;color:var(--muted);margin:0}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .totals-card{padding:14px}
  .totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .totals-grid .t{grid-column:1 / -1;border-top:1px solid var(--border);margin-top:2px;padding-top:10px}
  .totals-grid .lbl{font-size:12px;color:var(--muted);margin:0}
  .totals-grid .val{font-size:16px;font-weight:650;margin:2px 0 0}
  .totals-grid .val.pos{color:#16a34a}
  .totals-grid .val.neg{color:var(--danger)}
  @media (prefers-color-scheme: dark){ .totals-grid .val.pos{color:#4ade80} }
  .item-row, .pay-row{
    display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);
  }
  .item-row:last-child, .pay-row:last-child{border-bottom:none}
  .item-row .badge, .pay-row .badge{font-size:18px;flex:none;width:24px;text-align:center}
  .item-row .body, .pay-row .body{flex:1;min-width:0}
  .item-row .body .txt, .pay-row .body .txt{font-size:14.5px;margin:0;word-wrap:break-word}
  .item-row .body .meta, .pay-row .body .meta{font-size:12.5px;color:var(--muted);margin:3px 0 0}
  .item-row .amt{font-size:14.5px;font-weight:650;white-space:nowrap}
  .row-actions{display:flex;gap:2px;flex:none}
  .addrow-btn{margin:8px 0 0}
  button.primary.full{width:100%}
  /* ---- cliente picker ---- */
  .cli-list{max-height:44vh;overflow-y:auto;margin:0 0 14px;-webkit-overflow-scrolling:touch}
  .cli-opt{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--border);
    color:var(--text);font:inherit;font-size:15px;padding:11px 4px;cursor:pointer;
    transition:background-color .15s ease;
  }
  .cli-opt:last-child{border-bottom:none}
  .cli-opt:hover{background:rgba(127,127,127,.08)}
  .cli-opt .nm{flex:1;min-width:0}
  .cli-opt .nm .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .cli-opt.create{color:var(--accent)}
  /* ---- status picker ---- */
  .status-list{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
  .status-opt{
    display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;
    background:rgba(127,127,127,.06);border:none;border-radius:10px;
    color:var(--text);font:inherit;font-size:15px;padding:12px 14px;cursor:pointer;
    transition:background-color .15s ease;
  }
  .status-opt:hover{background:rgba(127,127,127,.12)}
  .status-opt.current{outline:2px solid var(--accent)}
</style>
</head>
<body>
<div id="root" class="wrap"><p class="msg">Carregando…</p></div>

<script>
const root = document.getElementById("root");
let eventos = [];
let searchTerm = "";
let statusFilter = "";
let clienteCache = null;
let doneExpanded = false;
let produtoCache = null;

const PAGE_LOGIN = {
  title: "Eventos",
  subtitle: "Faça o seu login para acessar.",
  onSuccess: () => loadEventos(),
};
</script>
<script src="shared-api.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-format.js"></script>
<script src="shared-inputs.js"></script>
<script src="shared-pwa.js"></script>
<script>

const CURRENT_PAGE = "eventos";

const STATUS_META = {
  lead:       { label: "Lead" },
  orcamento:  { label: "Orçamento" },
  confirmado: { label: "Confirmado" },
  entregue:   { label: "Entregue" },
  cancelado:  { label: "Cancelado" },
};
const STATUS_ORDER = ["lead", "orcamento", "confirmado", "entregue", "cancelado"];

function statusPillHtml(status){
  const m = STATUS_META[status] || { label: status };
  return '<span class="pill st-' + esc(status) + '">' + esc(m.label) + '</span>';
}

// Payment status is computed, not stored — it is a read of total_paid vs
// total_price, so it can never drift from the payments actually recorded.
// An event already marked "entregue" with money still owed is overdue —
// flagged red regardless of whether it's unpaid or only partially paid.
function paymentStatus(v, status){
  const price = Number(v.total_price) || 0;
  const paid = Number(v.total_paid) || 0;
  let label, cls;
  if(price <= 0 || paid <= 0){ label = "Não pago"; cls = "pend"; }
  else if(paid >= price){ label = "Pago"; cls = "paid"; }
  else { label = "Parcial"; cls = "partial"; }
  if((status !== undefined ? status : v.status) === "entregue" && cls !== "paid") cls = "overdue";
  return { label, cls };
}
function paymentPillHtml(v, status){
  const p = paymentStatus(v, status);
  return '<span class="pill pay-' + p.cls + '">' + p.label + '</span>';
}

// A delivered, fully-paid event has nothing left to act on — it's archived
// into the collapsed "concluídos" section instead of the main list.
function isEventoDone(v){
  return v.status === "entregue" && paymentStatus(v).cls === "paid";
}

function navHeader(title, backAction){
  const topRow = '<header><div class="hleft">' +
    '<button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>' +
    '<h1 style="flex:1">' + (backAction ? 'Eventos' : esc(title)) + '</h1>' +
    '</div><a class="brand-mark" href="index.html"><img src="assets/logo-badge.svg" alt="Magá"></a></header>';
  if(!backAction) return topRow;
  return topRow + '<div class="subheader">' +
    '<button class="link" id="back">← Eventos</button>' +
    (title ? '<h2 class="evt-title" id="evento-name">' + esc(title) + '</h2>' : '') +
  '</div>';
}
function wireNav(backAction){
  wireMenuButton();
  if(backAction) document.getElementById("back").addEventListener("click", backAction);
}

// ---- list screen ----

async function loadEventos(){
  root.innerHTML = '<p class="msg">Carregando…</p>';
  if(!getPass()){ showLogin(); return; }
  try{
    const data = await api("eventos");
    eventos = data.eventos || [];
    const wanted = new URLSearchParams(location.search).get("id");
    if(wanted){
      history.replaceState(null, "", location.pathname);
      openEvento(wanted);
      return;
    }
    renderList();
  }catch(e){ handleAuthError(e, loadEventos); }
}

function matchesSearch(v, term){
  if(!term) return true;
  const t = term.toLowerCase();
  if(String(v.name || "").toLowerCase().indexOf(t) >= 0) return true;
  if(String((v.cliente && v.cliente.name) || "").toLowerCase().indexOf(t) >= 0) return true;
  return false;
}

// Countdown-style date for the event list row, e.g. "Em 2 dias — quarta-feira, 26/08/26".
function fmtEventDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  if(Number.isNaN(d.getTime())) return "";
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diffDays = Math.round((d - today) / 86400000);

  let prefix;
  if(diffDays > 1) prefix = "Em " + diffDays + " dias";
  else if(diffDays === 1) prefix = "Em 1 dia";
  else if(diffDays === 0) prefix = "< 24hrs";
  else if(diffDays === -1) prefix = "Há 1 dia";
  else prefix = "Há " + Math.abs(diffDays) + " dias";

  const weekday = d.toLocaleDateString("pt-BR", { weekday: "long" });
  const dmy = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit" });
  return prefix + " — " + weekday + ", " + dmy;
}

function eventoRowHtml(v){
  const cliName = v.cliente ? v.cliente.name : "sem cliente";
  const dateHtml = v.event_date ? '<span>' + esc(fmtEventDate(v.event_date)) + '</span>' : '<span></span>';
  return '<div class="row" data-id="' + esc(v.id) + '">' +
    '<div class="top">' +
      statusPillHtml(v.status) +
      '<p class="txt">' + esc(v.name) + '</p>' +
      '<span class="price">' + fmtMoney(v.total_price) + '</span>' +
    '</div>' +
    '<div class="date-row">' + dateHtml + paymentPillHtml(v) + '</div>' +
    '<div class="meta"><span>' + esc(cliName) + '</span></div>' +
  '</div>';
}

// Fully-paid, delivered events are archived: they never match the active
// list (whatever the search/status filter says), same as tarefas.html
// keeps done tasks out of the pending list regardless of anything typed
// into its own search.
function renderList(){
  doneExpanded = false;
  const active = eventos.filter(v => !isEventoDone(v));
  const done = eventos.filter(isEventoDone);
  const shown = active.filter(v =>
    matchesSearch(v, searchTerm) && (!statusFilter || v.status === statusFilter));

  const chips = '<div class="chiprow">' +
    '<span class="chip' + (statusFilter === "" ? " active" : "") + '" data-status="">Todas</span>' +
    STATUS_ORDER.map(s =>
      '<span class="chip' + (statusFilter === s ? " active" : "") + '" data-status="' + s + '">' +
        esc(STATUS_META[s].label) + '</span>').join("") +
  '</div>';

  const rowsHtml = eventos.length === 0
    ? '<p class="msg">Nenhum evento ainda. Toque em "+ Novo evento" para começar.</p>'
    : (shown.length === 0
        ? '<p class="msg" id="no-match">Nenhum evento encontrado.</p>'
        : '<div class="card" id="list-card">' + shown.map(eventoRowHtml).join("") + '</div>');

  const doneWrap = done.length === 0 ? "" : '<div id="done-wrap">' +
    '<button class="link" id="toggle-done">Ver eventos concluídos (' + done.length + ')</button>' +
    '<div id="done-list"><div class="card done-card">' + done.map(eventoRowHtml).join("") + '</div></div>' +
  '</div>';

  root.innerHTML = navHeader("Eventos", null) +
    '<div class="searchrow">' +
      '<input type="search" id="search" placeholder="Buscar por evento ou cliente" ' +
        'value="' + esc(searchTerm) + '">' +
    '</div>' +
    chips +
    rowsHtml +
    '<button class="primary full addrow-btn" id="new-evento">+ Novo evento</button>' +
    doneWrap;

  wireNav(null);

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    searchTerm = search.value.trim();
    redrawList();
  });
  root.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      statusFilter = chip.dataset.status;
      redrawList();
    });
  });
  wireListRows(root);
  wireDoneToggle();
  document.getElementById("new-evento").addEventListener("click", openCreateModal);
}

function wireDoneToggle(){
  const btn = document.getElementById("toggle-done");
  if(!btn) return;
  btn.addEventListener("click", () => {
    doneExpanded = !doneExpanded;
    btn.textContent = (doneExpanded ? "Ocultar" : "Ver") + " eventos concluídos (" +
      eventos.filter(isEventoDone).length + ")";
    const list = document.getElementById("done-list");
    if(list){
      list.classList.toggle("open", doneExpanded);
      list.style.maxHeight = doneExpanded ? (list.scrollHeight + "px") : "0px";
    }
  });
}

function redrawList(){
  const active = eventos.filter(v => !isEventoDone(v));
  const shown = active.filter(v =>
    matchesSearch(v, searchTerm) && (!statusFilter || v.status === statusFilter));
  root.querySelectorAll(".chip").forEach(chip =>
    chip.classList.toggle("active", chip.dataset.status === statusFilter));
  const card = document.getElementById("list-card") || document.getElementById("no-match");
  const html = shown.length === 0
    ? '<p class="msg" id="no-match">Nenhum evento encontrado.</p>'
    : '<div class="card" id="list-card">' + shown.map(eventoRowHtml).join("") + '</div>';
  if(card){
    card.outerHTML = html;
    // Scoped to the replaced node, not the whole page — the done-list rows
    // are untouched by search/filter and must not get a fresh listener
    // stacked on top of the one they already have every time this runs.
    wireListRows(document.getElementById("list-card") || document.getElementById("no-match"));
  }
}

function wireListRows(container){
  (container || root).querySelectorAll(".row[data-id]").forEach(row => {
    row.addEventListener("click", () => openEvento(row.dataset.id));
  });
}

// ---- cliente picker (page-local: a cliente is a different entity from an
// ingredient, with different fields, so this is its own small
// implementation rather than a forced reuse of shared-catalog.js's picker) ----

async function clientePickerModal(){
  return new Promise(async resolve => {
    let all;
    try{
      if(!clienteCache) clienteCache = (await api("clientes")).clientes || [];
      all = clienteCache;
    }catch(e){
      if(e.unauthorized){ handleAuthError(e, loadEventos); return resolve(null); }
      listToast("Não foi possível carregar os clientes", true);
      return resolve(null);
    }

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>Cliente</h3>' +
        '<label for="cli-q">Buscar ou criar</label>' +
        '<input type="text" id="cli-q" placeholder="nome do cliente" autocomplete="off">' +
        '<div class="cli-list" id="cli-list"></div>' +
        '<div class="modal-actions">' +
          '<button class="cancel" id="cli-cancel">Cancelar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    const qEl = backdrop.querySelector("#cli-q");
    const listEl = backdrop.querySelector("#cli-list");
    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };

    function draw(){
      const term = qEl.value.trim();
      const t = term.toLowerCase();
      const shown = all.filter(c => !t || String(c.name).toLowerCase().indexOf(t) >= 0);
      const exact = all.some(c => String(c.name).toLowerCase() === t);
      let html = "";
      if(term && !exact){
        html += '<button class="cli-opt create" data-create>➕ Criar "' + esc(term) + '"</button>';
      }
      html += shown.map(c => {
        const sub = [c.organization, c.phone].filter(Boolean).join(" · ");
        return '<button class="cli-opt" data-pick="' + esc(c.id) + '">' +
          '<span class="nm">' + esc(c.name) +
            (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') +
          '</span></button>';
      }).join("");
      if(!html) html = '<p class="msg small">Nenhum cliente ainda. Digite acima para criar o primeiro.</p>';
      listEl.innerHTML = html;

      const create = listEl.querySelector("[data-create]");
      if(create){
        create.addEventListener("click", async () => {
          try{
            const res = await api("cliente_create", { name: qEl.value.trim() });
            clienteCache = null;
            close(res.cliente);
          }catch(err){
            if(err.unauthorized){ handleAuthError(err, loadEventos); return close(null); }
            listToast("Não foi possível criar o cliente", true);
          }
        });
      }
      listEl.querySelectorAll("[data-pick]").forEach(btn => {
        btn.addEventListener("click", () => {
          close(all.find(c => c.id === btn.dataset.pick) || null);
        });
      });
    }

    function onKey(e){
      if(e.key === "Escape") close(null);
      if(e.key === "Enter"){
        e.preventDefault();
        const first = listEl.querySelector(".cli-opt");
        if(first) first.click();
      }
    }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#cli-cancel").addEventListener("click", () => close(null));
    qEl.addEventListener("input", draw);
    draw();
    qEl.focus();
  });
}

// Search-only picker (no create — produtos are managed in produtos.html),
// resolving with the produto row PLUS its current cost/price breakdown in
// one round trip (produto_detail), so itemModal can prefill without a
// second call. Deliberately a convenience only: the caller decides whether
// to actually use the prefilled values, and nothing here is required.
async function produtoPickerModal(){
  return new Promise(async resolve => {
    let all;
    try{
      if(!produtoCache) produtoCache = (await api("produtos")).produtos || [];
      all = produtoCache;
    }catch(e){
      if(e.unauthorized){ handleAuthError(e, loadEventos); return resolve(null); }
      listToast("Não foi possível carregar os produtos", true);
      return resolve(null);
    }

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>Produto</h3>' +
        '<input type="text" id="prod-q" placeholder="Buscar produto" autocomplete="off">' +
        '<div class="cli-list" id="prod-list"></div>' +
        '<div class="modal-actions"><button class="cancel" id="prod-cancel">Cancelar</button></div>' +
      '</div>';
    document.body.appendChild(backdrop);

    const qEl = backdrop.querySelector("#prod-q");
    const listEl = backdrop.querySelector("#prod-list");
    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };

    function draw(){
      const t = qEl.value.trim().toLowerCase();
      const shown = all.filter(p => !t || String(p.name).toLowerCase().indexOf(t) >= 0);
      let html = shown.map(p => '<button class="cli-opt" data-pick="' + esc(p.id) + '">' +
        '<span class="nm">' + esc(p.name) + '</span></button>').join("");
      if(!html) html = '<p class="msg small">Nenhum produto ainda.</p>';
      listEl.innerHTML = html;
      listEl.querySelectorAll("[data-pick]").forEach(btn => {
        btn.addEventListener("click", async () => {
          try{
            const detail = await api("produto_detail", { id: btn.dataset.pick });
            close(detail.found ? { produto: detail.produto, cost: detail.cost } : null);
          }catch(err){
            if(err.unauthorized){ handleAuthError(err, loadEventos); return close(null); }
            listToast("Não foi possível carregar o produto", true);
            close(null);
          }
        });
      });
    }

    function onKey(e){
      if(e.key === "Escape") close(null);
      if(e.key === "Enter"){
        e.preventDefault();
        const first = listEl.querySelector(".cli-opt");
        if(first) first.click();
      }
    }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#prod-cancel").addEventListener("click", () => close(null));
    qEl.addEventListener("input", draw);
    draw();
    qEl.focus();
  });
}

function statusPickerModal(current){
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>Status do evento</h3>' +
        '<div class="status-list">' +
          STATUS_ORDER.map(s =>
            '<button class="status-opt' + (s === current ? ' current' : '') + '" data-status="' + s + '">' +
              esc(STATUS_META[s].label) +
              (s === current ? ' ✓' : '') +
            '</button>').join("") +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="cancel" id="st-cancel">Cancelar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);
    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };
    function onKey(e){ if(e.key === "Escape") close(null); }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#st-cancel").addEventListener("click", () => close(null));
    backdrop.querySelectorAll("[data-status]").forEach(btn => {
      btn.addEventListener("click", () => {
        if(btn.dataset.status === current) return close(null);
        close(btn.dataset.status);
      });
    });
  });
}

      '<label>Cliente</label>' +

      '<input type="date" id="nv-date" style="width:100%;margin-bottom:14px;padding:10px 12px;' +

        '<button class="save" id="nv-ok">Criar</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  let chosenCliente = null;
  const cliBtn = backdrop.querySelector("#nv-cliente-btn");
  cliBtn.addEventListener("click", async () => {
    const c = await clientePickerModal();
    if(c){ chosenCliente = c; cliBtn.textContent = c.name; }
  });

  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
  };
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
  backdrop.querySelector("#nv-cancel").addEventListener("click", close);

  backdrop.querySelector("#nv-ok").addEventListener("click", async () => {
    if(!chosenCliente){ alert("Selecione um cliente."); return; }
    const name = backdrop.querySelector("#nv-name").value.trim();
    if(!name){ alert("O nome do evento não pode ficar vazio."); return; }
    const status = backdrop.querySelector("#nv-status").value;
    const event_date = backdrop.querySelector("#nv-date").value || null;
    const notes = backdrop.querySelector("#nv-notes").value.trim() || null;
    try{
      const res = await api("evento_create", {
        cliente_id: chosenCliente.id, name, status, event_date, notes,
      });
      close();
      eventos = [];
      openEvento(res.evento.id);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadEventos);
      listToast("Não foi possível criar o evento", true);
    }
  });
}

// ---- detail screen ----

async function openEvento(id){
  root.innerHTML = '<p class="msg">Carregando…</p>';
  try{
    const data = await api("evento_detail", { id });
    if(!data.found){
      root.innerHTML = navHeader("", loadEventos) + '<p class="msg">Evento não encontrado.</p>';
      wireNav(loadEventos);
      return;
    }
    renderEvento(data);
  }catch(e){ handleAuthError(e, loadEventos); }
}

function itemRowHtml(it){
  const badge = it.tipo === "servico" ? "🛠" : "🎂";
  const meta = fmtStockQty(it.quantity) + ' × ' + fmtMoney(it.unit_price) +
    (Number(it.unit_cost) > 0 ? ' · custo ' + fmtMoney(it.unit_cost) : '') +
    (it.produto_id ? ' · 🔗 produto' : '');
  const amt = Number(it.quantity) * Number(it.unit_price);
  return '<div class="item-row" data-item="' + esc(it.id) + '">' +
    '<span class="badge">' + badge + '</span>' +
    '<span class="body">' +
      '<p class="txt">' + esc(it.description) + '</p>' +
      '<p class="meta">' + esc(meta) + '</p>' +
    '</span>' +
    '<span class="amt">' + fmtMoney(amt) + '</span>' +
    '<span class="row-actions">' +
      '<button class="icon-btn" data-edit-item title="Editar">✎</button>' +
      '<button class="icon-btn danger" data-del-item title="Remover">🗑</button>' +
    '</span>' +
  '</div>';
}

function payRowHtml(p){
  return '<div class="pay-row" data-pay="' + esc(p.id) + '">' +
    '<span class="badge">💰</span>' +
    '<span class="body">' +
      '<p class="txt">' + fmtMoney(p.amount) + (p.method ? ' · ' + esc(p.method) : '') + '</p>' +
      '<p class="meta">' + esc(fmtDateTime(p.received_at)) +
        (p.note ? ' · ' + esc(p.note) : '') + '</p>' +
    '</span>' +
    '<span class="row-actions">' +
      '<button class="icon-btn" data-edit-pay title="Editar">✎</button>' +
      '<button class="icon-btn danger" data-del-pay title="Remover">🗑</button>' +
    '</span>' +
  '</div>';
}

function renderEvento(data){
  const v = data.evento;
  const itens = data.itens || [];
  const pagamentos = data.pagamentos || [];
  const cli = v.cliente;

  const cliBlock = '<div class="cli-block">' +
    '<div class="who">' +
      (cli
        ? '<a class="nm link" href="clientes.html?id=' + encodeURIComponent(cli.id) + '">' + esc(cli.name) + '</a>'
        : '<p class="nm">Sem cliente</p>') +
      (cli ? '<p class="sub">' + esc([cli.organization, cli.phone, cli.email].filter(Boolean).join(" · ")) + '</p>' : '') +
    '</div>' +
    '<div class="cli-actions">' +
      '<button class="link" id="change-cliente">Trocar</button>' +
    '</div>' +
  '</div>';

  const itensHtml = itens.length === 0
    ? '<p class="msg small">Nenhum item ainda.</p>'
    : '<div class="card" id="itens-card">' + itens.map(itemRowHtml).join("") + '</div>';
  const paysHtml = pagamentos.length === 0
    ? '<p class="msg small">Nenhum pagamento registrado ainda.</p>'
    : '<div class="card" id="pays-card">' + pagamentos.map(payRowHtml).join("") + '</div>';

  const profitCls = data.profit > 0 ? "pos" : (data.profit < 0 ? "neg" : "");
  const balanceCls = data.balance_due > 0 ? "neg" : (data.balance_due < 0 ? "pos" : "");

  root.innerHTML = navHeader(v.name, loadEventos) +
    '<div class="evento-head">' +
      '<div class="pills-row">' + statusPillHtml(v.status) + paymentPillHtml(data, v.status) + '</div>' +
    '<p class="cli-lbl">Cliente</p>' +
    cliBlock +
    '<div class="statusline">' +
      '<span class="lbl">Status</span>' +
      '<button class="link" id="change-status">' + esc(STATUS_META[v.status].label) + ' — alterar</button>' +
    '</div>' +
    '<div class="datefield">' +
      '<span class="lbl">Data do evento</span>' +
      '<input type="date" id="event-date" value="' + esc(v.event_date || "") + '" ' +
        'style="border:none;background:none;color:var(--text);font:inherit;font-size:14px;text-align:right">' +
    '</div>' +
    '<div class="detail-actions">' +
      '<button class="primary small alt danger" id="del-evento">🗑 Remover</button>' +
    '</div>' +
    '</div>' +
    '<div class="card totals-card">' +
      '<div class="totals-grid">' +
        '<div><p class="lbl">Custo total</p><p class="val">' + fmtMoney(data.total_cost) + '</p></div>' +
        '<div><p class="lbl">Preço total</p><p class="val">' + fmtMoney(data.total_price) + '</p></div>' +
        '<div class="t"><p class="lbl">Lucro</p><p class="val ' + profitCls + '">' + fmtMoney(data.profit) + '</p></div>' +
        '<div><p class="lbl">Margem</p><p class="val ' + profitCls + '">' +
          (data.margin_pct == null ? "—" : data.margin_pct.toFixed(1).replace(".", ",") + "%") + '</p></div>' +
        '<div class="t"><p class="lbl">Total pago</p><p class="val">' + fmtMoney(data.total_paid) + '</p></div>' +
        '<div><p class="lbl">Saldo devedor</p><p class="val ' + balanceCls + '">' + fmtMoney(data.balance_due) + '</p></div>' +
      '</div>' +
    '</div>' +
    '<h3>Itens</h3>' + itensHtml +
    '<button class="primary small alt addrow-btn" id="add-item">+ Item</button>' +
    '<h3>Pagamentos</h3>' + paysHtml +
    '<button class="primary addrow-btn" id="confirm-pay">Confirmar pagamento</button>';

  wireNav(loadEventos);

  document.getElementById("evento-name").addEventListener("click", async () => {
    const name = await promptModal("Editar evento", "Nome", v.name);
    if(name === null) return;
    const trimmed = name.trim();
    if(!trimmed){ alert("O nome não pode ficar vazio."); return; }
    if(trimmed === v.name) return;
    try{
      await api("evento_update", { id: v.id, name: trimmed });
      eventos = [];
      openEvento(v.id);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadEventos);
      listToast("Não foi possível salvar", true);
    }
  });

  document.getElementById("change-cliente").addEventListener("click", async () => {
    const c = await clientePickerModal();
    if(!c) return;
    try{
      await api("evento_update", { id: v.id, cliente_id: c.id });
      eventos = [];
      openEvento(v.id);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadEventos);
      listToast("Não foi possível salvar", true);
    }
  });

  document.getElementById("change-status").addEventListener("click", async () => {
    const status = await statusPickerModal(v.status);
    if(!status) return;
    try{
      await api("evento_update", { id: v.id, status });
      eventos = [];
      openEvento(v.id);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadEventos);
      listToast("Não foi possível salvar", true);
    }
  });

  document.getElementById("event-date").addEventListener("change", async (e) => {
    try{
      await api("evento_update", { id: v.id, event_date: e.target.value || null });
      eventos = [];
      listToast("Data salva");
    }catch(err){
      if(err.unauthorized) return handleAuthError(err, loadEventos);
      listToast("Não foi possível salvar a data", true);
    }
  });

  document.getElementById("del-evento").addEventListener("click", async () => {
    if(!(await confirmModal('Remover "' + v.name + '"?', "Remover"))) return;
    try{
      let res = await api("evento_delete", { id: v.id });
      if(res.ok === false && res.reason === "has_content"){
        const bits = [];
        if(res.items) bits.push(res.items + (res.items === 1 ? " item" : " itens"));
        if(res.payments) bits.push(res.payments +
          (res.payments === 1 ? " pagamento" : " pagamentos") +
          " (" + fmtMoney(res.total_paid) + " recebidos)");
        if(!(await confirmModal(
          "Este evento tem " + bits.join(" e ") + ". Removê-lo apaga os itens e os pagamentos — " +
          "o valor já recebido continua no Financeiro. Não dá para desfazer.",
          "Remover mesmo assim"))) return;
        res = await api("evento_delete", { id: v.id, force: true });
      }
      eventos = [];
      listToast("Evento removido");
      loadEventos();
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadEventos);
      listToast("Não foi possível remover", true);
    }
  });

  document.getElementById("add-item").addEventListener("click", async () => {
    const added = await itemModal(null);
    if(!added) return;
    try{
      await api("evento_item_add", Object.assign({ evento_id: v.id }, added));
      eventos = [];
      openEvento(v.id);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadEventos);
      listToast("Não foi possível salvar o item", true);
    }
  });
  root.querySelectorAll("[data-edit-item]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.closest(".item-row").dataset.item;
      const it = itens.find(x => x.id === id);
      const edited = await itemModal(it);
      if(!edited) return;
      try{
        await api("evento_item_update", Object.assign({ id }, edited));
        eventos = [];
        openEvento(v.id);
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadEventos);
        listToast("Não foi possível salvar o item", true);
      }
    });
  });
  root.querySelectorAll("[data-del-item]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if(!(await confirmModal("Remover este item?"))) return;
      const id = btn.closest(".item-row").dataset.item;
      try{
        await api("evento_item_delete", { id });
        eventos = [];
        openEvento(v.id);
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadEventos);
        listToast("Não foi possível remover", true);
      }
    });
  });

  document.getElementById("confirm-pay").addEventListener("click", async () => {
    const confirmed = await paymentConfirmModal(data.balance_due);
    if(!confirmed) return;
    try{
      await api("evento_payment_confirm", Object.assign({ evento_id: v.id }, confirmed));
      eventos = [];
      listToast("Pagamento confirmado");
      openEvento(v.id);
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadEventos);
      listToast("Não foi possível confirmar o pagamento", true);
    }
  });
  root.querySelectorAll("[data-edit-pay]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.closest(".pay-row").dataset.pay;
      const p = pagamentos.find(x => x.id === id);
      const edited = await paymentEditModal(p);
      if(!edited) return;
      try{
        await api("evento_payment_update", Object.assign({ id }, edited));
        eventos = [];
        openEvento(v.id);
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadEventos);
        listToast("Não foi possível salvar o pagamento", true);
      }
    });
  });
  root.querySelectorAll("[data-del-pay]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if(!(await confirmModal(
        "Remover este pagamento? O lançamento no Financeiro continua registrado, sem vínculo com o evento."))) return;
      const id = btn.closest(".pay-row").dataset.pay;
      try{
        await api("evento_payment_delete", { id });
        eventos = [];
        openEvento(v.id);
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadEventos);
        listToast("Não foi possível remover", true);
      }
    });
  });
}

// ---- item modal ----

function itemModal(it){
  const isEdit = !!it;
  // A picked Produto is a convenience prefill only — description/unit_cost/
  // unit_price below stay the persisted, always-manually-editable fields
  // exactly as before. A sale typed in a hurry with no time to search a
  // catalogue still works completely unchanged, produto_id simply stays null.
  let produtoId = isEdit ? (it.produto_id || null) : null;
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>' + (isEdit ? "Editar item" : "Novo item") + '</h3>' +
        '<label>Tipo</label>' +
        '<select id="it-tipo" style="width:100%;margin-bottom:14px">' +
          '<option value="produto"' + (isEdit && it.tipo !== "servico" ? " selected" : "") + '>🎂 Produto</option>' +
          '<option value="servico"' + (isEdit && it.tipo === "servico" ? " selected" : "") + '>🛠 Serviço</option>' +
        '</select>' +
        '<button type="button" class="link" id="it-pick-produto" style="display:block;margin:0 0 14px">' +
          '🔗 Vincular Produto (opcional)' +
        '</button>' +
        '<label for="it-desc">Descrição</label>' +
        '<input type="text" id="it-desc" value="' + esc(isEdit ? it.description : "") + '">' +
        '<div class="fields-row">' +
          '<div class="col grow">' +
            '<label for="it-qty">Quantidade</label>' +
            '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="it-qty" ' +
              'value="' + esc(isEdit ? fmtStockQty(it.quantity) : "1") + '"></span>' +
          '</div>' +
          '<div class="col grow">' +
            '<label for="it-cost">Custo (un.)</label>' +
            '<span class="field"><span class="prefix">R$</span>' +
              '<input class="num-input" type="text" inputmode="numeric" id="it-cost" ' +
              'value="' + esc(isEdit ? fmtPriceInput(it.unit_cost) : "") + '"></span>' +
          '</div>' +
          '<div class="col grow">' +
            '<label for="it-price">Preço (un.)</label>' +
            '<span class="field"><span class="prefix">R$</span>' +
              '<input class="num-input" type="text" inputmode="numeric" id="it-price" ' +
              'value="' + esc(isEdit ? fmtPriceInput(it.unit_price) : "") + '"></span>' +
          '</div>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="cancel" id="it-cancel">Cancelar</button>' +
          '<button class="save" id="it-ok">Salvar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    const qtyEl = backdrop.querySelector("#it-qty");
    const costEl = backdrop.querySelector("#it-cost");
    const priceEl = backdrop.querySelector("#it-price");
    wireQtyInput(qtyEl);
    wirePriceInput(costEl);
    wirePriceInput(priceEl);

    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };
    const ok = () => {
      const description = backdrop.querySelector("#it-desc").value.trim();
      if(!description){ alert("A descrição não pode ficar vazia."); return; }
      const quantity = parseQtyInput(qtyEl.value);
      if(quantity === null){ alert("Quantidade inválida."); return; }
      close({
        tipo: backdrop.querySelector("#it-tipo").value,
        description,
        quantity,
        unit_cost: centsToPrice(priceDigits(costEl.value)) || 0,
        unit_price: centsToPrice(priceDigits(priceEl.value)) || 0,
        produto_id: produtoId,
      });
    };
    function onKey(e){
      if(e.key === "Escape") close(null);
      if(e.key === "Enter"){ e.preventDefault(); ok(); }
    }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#it-cancel").addEventListener("click", () => close(null));
    backdrop.querySelector("#it-ok").addEventListener("click", ok);
    backdrop.querySelector("#it-pick-produto").addEventListener("click", async () => {
      const picked = await produtoPickerModal();
      if(!picked) return;
      produtoId = picked.produto.id;
      backdrop.querySelector("#it-desc").value = picked.produto.name;
      if(picked.cost && picked.cost.custo_total_por_unidade != null){
        costEl.value = fmtPriceInput(picked.cost.custo_total_por_unidade);
      }
      if(picked.cost && picked.cost.preco_atacado != null){
        priceEl.value = fmtPriceInput(picked.cost.preco_atacado);
      }
      backdrop.querySelector("#it-pick-produto").textContent = "🔗 " + picked.produto.name;
    });
    backdrop.querySelector("#it-desc").focus();
  });
}

// ---- payment modals ----

function paymentConfirmModal(suggested){
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>Confirmar pagamento</h3>' +
        '<label for="pay-amount">Valor</label>' +
        '<span class="field" style="width:100%;margin-bottom:14px">' +
          '<span class="prefix">R$</span>' +
          '<input class="num-input" type="text" inputmode="numeric" id="pay-amount" ' +
            'style="flex:1 1 auto;width:auto" ' +
            'value="' + esc(suggested > 0 ? fmtPriceInput(suggested) : "") + '">' +
        '</span>' +
        '<label>Forma</label>' +
        '<div class="chiprow" id="pay-method-chips">' +
          '<span class="chip active" data-method="Pix">Pix</span>' +
          '<span class="chip" data-method="Dinheiro">Dinheiro</span>' +
          '<span class="chip" data-method="Cartão">Cartão</span>' +
        '</div>' +
        '<label for="pay-date">Data</label>' +
        '<input type="date" id="pay-date" value="' + new Date().toISOString().slice(0,10) + '" ' +
          'style="width:100%;margin-bottom:14px;padding:10px 12px;border-radius:10px;' +
          'border:1px solid var(--border-strong);background:var(--card);color:var(--text)">' +
        '<label for="pay-note">Nota (opcional)</label>' +
        '<input type="text" id="pay-note" placeholder="ex: sinal, parcela 2…">' +
        '<div class="modal-actions">' +
          '<button class="cancel" id="pay-cancel">Cancelar</button>' +
          '<button class="save" id="pay-ok">Confirmar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    const amountEl = backdrop.querySelector("#pay-amount");
    wirePriceInput(amountEl);
    let method = "Pix";
    backdrop.querySelectorAll("#pay-method-chips .chip").forEach(chip => {
      chip.addEventListener("click", () => {
        method = chip.dataset.method;
        backdrop.querySelectorAll("#pay-method-chips .chip").forEach(c => c.classList.toggle("active", c === chip));
      });
    });

    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };
    const ok = () => {
      const amount = centsToPrice(priceDigits(amountEl.value));
      if(!amount || amount <= 0){ alert("Informe um valor válido."); return; }
      const date = backdrop.querySelector("#pay-date").value;
      close({
        amount, method,
        received_at: date ? new Date(date + "T12:00:00").toISOString() : undefined,
        note: backdrop.querySelector("#pay-note").value.trim() || undefined,
      });
    };
    function onKey(e){
      if(e.key === "Escape") close(null);
      if(e.key === "Enter"){ e.preventDefault(); ok(); }
    }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#pay-cancel").addEventListener("click", () => close(null));
    backdrop.querySelector("#pay-ok").addEventListener("click", ok);
    amountEl.focus();
    amountEl.select();
  });
}
