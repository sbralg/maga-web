<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Produtos">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Produtos</title>
<!--
  Data-free shell for the Produtos module — a sellable item: manufactured
  via a Receita, or "comprado" (kind "comprado") — priced directly by
  hand, with an optional Fornecedor attached purely as reference metadata.
  comprado deliberately does NOT go through the Insumo/ingredient/stock
  pipeline a recipe line uses: fornecedor-sourced items are bought on
  demand per event, not stocked or consumed by a recipe — see
  maga-api's module comment above produtoCostFor. Every Produto
  carries its own packaging lines and three margin tiers (atacado/
  distribuidor/varejo), ported from the household's real pricing
  spreadsheet; the packaging/cost/margins panel is shared with
  receitas.html via shared-produto-panel.js.

  A manufaturado Produto can also be created directly from receitas.html
  (its "Categoria: Produto Final" control) — this page's own creation
  flow still works too, they write the same record.

  Same pattern as every other page here: hosted on public GitHub Pages,
  holds NO keys and NO data, asks for the shared passphrase, then talks
  only to the gated Supabase Edge Function (maga-api).
-->
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-page.css">
<link rel="stylesheet" href="shared-menu.css">
<link rel="stylesheet" href="shared-modal.css">
<link rel="stylesheet" href="shared-toast.css">
<link rel="stylesheet" href="shared-inputs.css">
<link rel="stylesheet" href="shared-produto-panel.css">
<link rel="stylesheet" href="shared-notes.css">
<style>
  /* ---- page chrome (body/.wrap/header/.hleft/h1/h3/.subheader/.searchrow/
     .row shell/.detail-actions/.addrow-btn/.detail-title) now lives in
     shared-page.css — see that file for what moved and why. Only the
     genuinely page-specific parts of .row (its flex layout, not the
     shell) stay here. .row .nm is a pure duplicate of shared-page.css's
     own rule and is gone; .row .meta's margin (2px, vs. shared's 0) is
     the one genuinely page-specific override this row keeps. */
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row .meta{margin:2px 0 0}
  .row .price{font-size:14px;font-weight:650;white-space:nowrap;flex:none}
  .pill{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .pill.kd-manufaturado{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
  .pill.kd-comprado{background:rgba(22,163,74,.14);color:var(--ok)}
  /* ---- detail ---- */
  .kind-src{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-top:1px solid var(--border);
  }
  .kind-src .lbl{font-size:12px;color:var(--muted);margin:0}
  /* .item-row/.row-actions/.totals-card/.totals-grid/.warn-card/
     .reverse-card/.reverse-out/.pick-list/.pick-opt — every ".item-row"
     on this page IS the shared produto panel's embalagem list (this page
     has no OTHER use of the class, unlike receitas.html), and the picker
     rows are the panel's own embalagemPickerModal() — all now live in
     shared-produto-panel.css, which this page loads. */
</style>
</head>
<body>
<div id="root" class="wrap"><p class="msg">Carregando…</p></div>

<script>
const root = document.getElementById("root");
let produtos = [];
let searchTerm = "";
let fornecedorCache = null;
let receitaListCache = null;

const PAGE_LOGIN = {
  title: "Produtos",
  subtitle: "Faça o seu login para acessar.",
  onSuccess: () => loadProdutos(),
};
</script>
<script src="shared-api.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-nav.js"></script>
<script src="shared-history.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-format.js"></script>
<script src="shared-inputs.js"></script>
<script src="shared-produto-panel.js"></script>
<script src="shared-notes.js"></script>
<script src="shared-pwa.js"></script>
<script>

const CURRENT_PAGE = "produtos";
const KIND_META = {
  manufaturado: { label: "Manufaturado", badge: "🎂" },
  comprado:     { label: "Comprado",     badge: "🚚" },
};

// navHeader()/wireNav() now live in shared-nav.js. This page's title uses
// the shared "detail-title" class/id (formerly this page's own .prod-title
// / #prod-name) — see the click handler further down.

function pct(v){ return (Number(v) * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }); }

// renderShell(): keeps the header (hamburger, back link) on screen through
// every load instead of wiping it with a bare "Carregando…" — see
// preferencias.html's own renderShell() for the same reasoning. opts.detail
// renders the DETAIL shell (back link to Produtos, title empty until the
// record loads), i.e. the shell for the screen being navigated TO.
function renderShell(inner, opts){
  if(opts && opts.detail){
    root.innerHTML = navHeader("", { backLabel: "Produtos", backAction: route.navToList, listTitle: "Produtos" }) + inner;
    wireNav(route.navToList);
  }else{
    root.innerHTML = navHeader("Produtos") + inner;
    wireNav(null);
  }
}

// ---- list screen ----

// listLoaded, not produtos.length, is what says whether the in-memory list
// is trustworthy. showList() is what the router renders for the list screen
// and it must NOT re-fetch on every Back — but a create/delete invalidates
// the cache, and an account with genuinely zero produtos must not look like
// a cache miss and re-fetch forever.
let listLoaded = false;

async function loadProdutos(){
  if(!getPass()){ showLogin(); return; }
  renderShell('<p class="msg">Carregando…</p>');
  try{
    const data = await api("produtos");
    produtos = data.produtos || [];
    listLoaded = true;
    const params = new URLSearchParams(location.search);
    // "+ Novo Produto" from a fornecedor's own page — arrives here as
    // ?new=1&fornecedor_id=<id>, opening the create modal pre-set to
    // comprado with that fornecedor already chosen. Not part of the ?id=
    // route the shared history router owns, so it's handled first and
    // returns before route.routeFromUrl() ever runs.
    if(params.get("new")){
      const fornecedorId = params.get("fornecedor_id");
      history.replaceState(null, "", location.pathname);
      renderList();
      if(fornecedorId){
        try{
          const fd = await api("fornecedor_detail", { id: fornecedorId });
          openProdutoModal(null, fd.found ? fd.fornecedor : null);
        }catch(e){
          if(e.unauthorized) return handleAuthError(e, loadProdutos);
          openProdutoModal(null, null);
        }
      }else{
        openProdutoModal(null, null);
      }
      return;
    }
    route.routeFromUrl();
  }catch(e){ handleAuthError(e, loadProdutos); }
}

// Paint from memory FIRST, then reconcile in the background. Re-fetching
// synchronously on every Back would put a "Carregando…" flash on the most
// common gesture in the app — the exact thing phase 1 removed from every
// page. Rendering from cache alone would instead go stale the moment
// another device (or the MCP tools) writes a produto. This does both:
// instant paint, and a silent re-render only if the data actually moved.
function showList(){
  if(!listLoaded) return loadProdutos();
  renderList();
  refreshList();
}

let refreshing = false;
async function refreshList(){
  if(refreshing) return;
  refreshing = true;
  try{
    const data = await api("produtos");
    const next = data.produtos || [];
    if(JSON.stringify(next) !== JSON.stringify(produtos)){
      produtos = next;
      // Only repaint if the list is still the screen being shown — a fast
      // Back-then-tap could have opened a detail while this was in flight.
      if(!new URLSearchParams(location.search).get("id")) renderList();
    }
  }catch(_){
    // A failed background refresh leaves the cached list on screen. There
    // is nothing useful to tell the user: what they are looking at is the
    // last known good state, and any action they take still reports its
    // own failure.
  }finally{ refreshing = false; }
}

function matchesSearch(p, term){
  if(!term) return true;
  return foldSearchText(p.name).indexOf(foldSearchText(term)) >= 0;
}

function produtoRowHtml(p){
  const km = KIND_META[p.kind] || { label: p.kind };
  const src = p.kind === "manufaturado"
    ? (p.receita && p.receita.name)
    : (p.fornecedor && p.fornecedor.name);
  // A real <button>, not a <div> + click handler: this is the app's
  // primary navigation and it has to be reachable by keyboard. <button>
  // takes phrasing content only, so the old <p>s (and their wrapping <div>,
  // which carried no styling of its own) are <span>s.
  return '<button type="button" class="row" data-id="' + esc(p.id) + '">' +
    '<span>' +
      '<span class="nm">' + esc(p.name) + '</span>' +
      '<span class="meta"><span class="pill kd-' + esc(p.kind) + '">' + esc(km.label) + '</span>' +
        (src ? ' · ' + esc(src) : '') + '</span>' +
    '</span>' +
  '</button>';
}

function renderList(){
  const shown = produtos.filter(p => matchesSearch(p, searchTerm));
  const rowsHtml = produtos.length === 0
    ? '<p class="msg">Nenhum produto ainda. Toque em "+ Novo produto" para começar.</p>'
    : (shown.length === 0
        ? '<p class="msg" id="no-match">Nenhum produto encontrado.</p>'
        : '<div class="card" id="list-card">' + shown.map(produtoRowHtml).join("") + '</div>');

  root.innerHTML = navHeader("Produtos") +
    '<div class="searchrow"><input type="search" id="search" placeholder="Buscar produto" ' +
      'value="' + esc(searchTerm) + '"></div>' +
    rowsHtml +
    '<button class="primary full addrow-btn" id="new-produto">+ Novo produto</button>';

  wireNav(null);
  const search = document.getElementById("search");
  search.addEventListener("input", () => { searchTerm = search.value.trim(); redrawList(); });
  wireListRows();
  document.getElementById("new-produto").addEventListener("click", () => openProdutoModal(null));
}

function redrawList(){
  const shown = produtos.filter(p => matchesSearch(p, searchTerm));
  const card = document.getElementById("list-card") || document.getElementById("no-match");
  const html = shown.length === 0
    ? '<p class="msg" id="no-match">Nenhum produto encontrado.</p>'
    : '<div class="card" id="list-card">' + shown.map(produtoRowHtml).join("") + '</div>';
  if(card){ card.outerHTML = html; wireListRows(); }
}

function wireListRows(){
  root.querySelectorAll(".row[data-id]").forEach(row => {
    row.addEventListener("click", () => route.navToDetail(row.dataset.id));
  });
}

// ---- receita/fornecedor source pickers (single pick, no quantity) ----

// Search-only, same shape as estoque.html's fornecedorPickerModal — no
// create here either, fornecedores are managed in fornecedores.html.
async function pickFornecedorModal(){
  try{
    if(!fornecedorCache) fornecedorCache = (await api("fornecedores")).fornecedores || [];
  }catch(e){
    if(e.unauthorized){ handleAuthError(e, loadProdutos); return null; }
    listToast("Não foi possível carregar" + (e.body && e.body.error ? " (" + e.body.error + ")" : ""), true);
    return null;
  }
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>Fornecedor</h3>' +
        '<input type="text" id="pf-q" placeholder="Buscar fornecedor" autocomplete="off">' +
        '<div class="pick-list" id="pf-list"></div>' +
        '<div class="modal-actions"><button class="cancel" id="pf-cancel">Cancelar</button></div>' +
      '</div>';
    document.body.appendChild(backdrop);
    const qEl = backdrop.querySelector("#pf-q");
    const listEl = backdrop.querySelector("#pf-list");
    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };
    function draw(){
      const t = foldSearchText(qEl.value.trim());
      const shown = fornecedorCache.filter(x => !t || foldSearchText(x.name).indexOf(t) >= 0);
      let html = shown.map(x => '<button class="pick-opt" data-id="' + esc(x.id) + '">' +
        '<span class="nm">' + esc(x.name) + '</span>' +
      '</button>').join("");
      if(!html) html = '<p class="msg small">Nenhum fornecedor cadastrado ainda.</p>';
      listEl.innerHTML = html;
      listEl.querySelectorAll("[data-id]").forEach(btn => {
        btn.addEventListener("click", () => close(fornecedorCache.find(x => x.id === btn.dataset.id)));
      });
    }
    function onKey(e){ if(e.key === "Escape") close(null); }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#pf-cancel").addEventListener("click", () => close(null));
    qEl.addEventListener("input", draw);
    draw();
    qEl.focus();
  });
}

async function pickReceitaModal(){
  try{
    if(!receitaListCache) receitaListCache = (await api("receitas")).receitas || [];
  }catch(e){
    if(e.unauthorized){ handleAuthError(e, loadProdutos); return null; }
    listToast("Não foi possível carregar" + (e.body && e.body.error ? " (" + e.body.error + ")" : ""), true);
    return null;
  }
  return new Promise(resolve => {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>Receita</h3>' +
        '<input type="text" id="pr-q" placeholder="Buscar" autocomplete="off">' +
        '<div class="pick-list" id="pr-list"></div>' +
        '<div class="modal-actions"><button class="cancel" id="pr-cancel">Cancelar</button></div>' +
      '</div>';
    document.body.appendChild(backdrop);
    const qEl = backdrop.querySelector("#pr-q");
    const listEl = backdrop.querySelector("#pr-list");
    const close = (result) => {
      backdrop.remove();
      document.removeEventListener("keydown", onKey);
      resolve(result);
    };
    function draw(){
      const t = foldSearchText(qEl.value.trim());
      const shown = receitaListCache.filter(x => !t || foldSearchText(x.name).indexOf(t) >= 0);
      let html = shown.map(x => '<button class="pick-opt" data-id="' + esc(x.id) + '">' +
        '<span class="nm">' + esc(x.name) + '</span>' +
        '<span class="cnt">' + fmtStockQty(x.yield_qty) + ' ' + esc(x.yield_unit) + '</span>' +
      '</button>').join("");
      if(!html) html = '<p class="msg small">Nenhuma receita ainda.</p>';
      listEl.innerHTML = html;
      listEl.querySelectorAll("[data-id]").forEach(btn => {
        btn.addEventListener("click", () => close(receitaListCache.find(x => x.id === btn.dataset.id)));
      });
    }
    function onKey(e){ if(e.key === "Escape") close(null); }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(null); });
    backdrop.querySelector("#pr-cancel").addEventListener("click", () => close(null));
    qEl.addEventListener("input", draw);
    draw();
    qEl.focus();
  });
}

// ---- create/edit modal ----

// `presetFornecedor` ({id,name}) prefills a NEW comprado produto's
// fornecedor — the "+ Novo Produto" entry point from fornecedores.html
// arrives here via ?new=1&fornecedor_id=.
function openProdutoModal(p, presetFornecedor){
  const isEdit = !!p;
  // Every field lives in a closure variable, not just read from the DOM at
  // submit time — picking a receita/fornecedor (or switching kind) calls
  // draw() again, which replaces backdrop.innerHTML wholesale, and a value
  // that only ever lived in the old input node is gone the moment that
  // happens. (This is exactly the bug a prior session already fixed for
  // "name" alone; the numeric/text fields below had the same hole.)
  let name = isEdit ? p.name : "";
  let kind = isEdit ? p.kind : (presetFornecedor ? "comprado" : "manufaturado");
  let receita = isEdit && p.kind === "manufaturado" ? p.receita : null;
  let fornecedor = isEdit ? p.fornecedor : (presetFornecedor || null);
  let costStr = isEdit ? fmtPriceInput(p.cost) : "";
  let itemsStr = isEdit ? fmtStockQty(p.items_per_package) : "1";
  let packMinStr = isEdit && p.packing_minutes ? fmtStockQty(p.packing_minutes) : "";
  let packRateStr = isEdit ? fmtPriceInput(p.packing_labor_rate_per_hour) : "";
  let mAtacadoStr = isEdit ? pct(p.margin_atacado) : "65";
  let mDistStr = isEdit ? pct(p.margin_distribuidor) : "30";
  let mVarejoStr = isEdit ? pct(p.margin_varejo) : "40";
  // Declared serving size for the nutrition label (IN 75/2020) — only
  // offered while editing a manufaturado (rotulagem.html computes a label
  // from its receita; a comprado item has no receita to declare a portion
  // OF), and only after the produto exists at all, since setting a
  // realistic porção usually means already having the label open to check
  // against.
  let porcaoStr = isEdit && p.porcao_g != null ? fmtStockQty(p.porcao_g) : "";
  let medidaStr = isEdit ? (p.medida_caseira || "") : "";

  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  document.body.appendChild(backdrop);

  function draw(){
    const sourceHtml = kind === "manufaturado"
      ? '<label>Receita</label>' +
        '<button type="button" class="link" id="pr-source" style="display:block;text-align:left;padding:10px 0">' +
          (receita ? esc(receita.name) : "Escolher…") +
        '</button>'
      : '<label for="pr-cost">Custo (opcional)</label>' +
        '<span class="field"><span class="prefix">R$</span>' +
          '<input class="num-input" type="text" inputmode="numeric" id="pr-cost" ' +
          'value="' + esc(costStr) + '"></span>' +
        '<label>Fornecedor (opcional)</label>' +
        '<button type="button" class="link" id="pr-fornecedor" style="display:block;text-align:left;padding:10px 0">' +
          (fornecedor ? esc(fornecedor.name) : "Escolher…") +
        '</button>';

    backdrop.innerHTML =
      '<div class="modal-card">' +
        '<h3>' + (isEdit ? "Editar produto" : "Novo produto") + '</h3>' +
        '<label for="pr-name-i">Nome</label>' +
        '<input type="text" id="pr-name-i" value="' + esc(name) + '">' +
        '<label>Tipo</label>' +
        '<select id="pr-kind" style="width:100%;margin-bottom:14px">' +
          '<option value="manufaturado"' + (kind === "manufaturado" ? " selected" : "") + '>🎂 Manufaturado (via Receita)</option>' +
          '<option value="comprado"' + (kind === "comprado" ? " selected" : "") + '>🚚 Comprado</option>' +
        '</select>' +
        sourceHtml +
        '<div class="fields-row">' +
          '<div class="col grow">' +
            '<label for="pr-items">Itens por pacote</label>' +
            '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="pr-items" ' +
              'value="' + esc(itemsStr) + '"></span>' +
          '</div>' +
        '</div>' +
        '<div class="fields-row">' +
          '<div class="col grow">' +
            '<label for="pr-pack-min">Embalar (min, opcional)</label>' +
            '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="pr-pack-min" ' +
              'value="' + esc(packMinStr) + '"></span>' +
          '</div>' +
          '<div class="col grow">' +
            '<label for="pr-pack-rate">Mão de obra (R$/h, opcional)</label>' +
            '<span class="field"><span class="prefix">R$</span>' +
              '<input class="num-input" type="text" inputmode="numeric" id="pr-pack-rate" ' +
              'value="' + esc(packRateStr) + '"></span>' +
          '</div>' +
        '</div>' +
        '<div class="fields-row">' +
          '<div class="col grow"><label for="pr-m-atacado">Margem atacado (%)</label>' +
            '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="pr-m-atacado" ' +
              'value="' + esc(mAtacadoStr) + '"></span></div>' +
          '<div class="col grow"><label for="pr-m-dist">Margem distribuidor (%)</label>' +
            '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="pr-m-dist" ' +
              'value="' + esc(mDistStr) + '"></span></div>' +
          '<div class="col grow"><label for="pr-m-varejo">Margem varejo (%)</label>' +
            '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="pr-m-varejo" ' +
              'value="' + esc(mVarejoStr) + '"></span></div>' +
        '</div>' +
        (isEdit && kind === "manufaturado"
          ? '<label for="pr-porcao">Porção declarada no rótulo (g, opcional)</label>' +
            '<div class="fields-row">' +
              '<div class="col grow">' +
                '<span class="field"><input class="num-input" type="text" inputmode="decimal" id="pr-porcao" ' +
                  'style="width:100%" value="' + esc(porcaoStr) + '"></span>' +
              '</div>' +
              '<div class="col grow">' +
                '<input type="text" id="pr-medida" placeholder="Medida caseira, ex: 1 fatia (40 g)" ' +
                  'style="width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid var(--border-strong);' +
                  'border-radius:8px;background:var(--card);color:var(--text)" value="' + esc(medidaStr) + '">' +
              '</div>' +
            '</div>' +
            '<p class="hint">Vem da tabela de porções de referência da Anvisa para esta categoria ' +
              '— quem decide o número é você. Necessária para calcular %VD no rótulo.</p>'
          : "") +
        '<div class="modal-actions">' +
          '<button class="cancel" id="pr-cancel">Cancelar</button>' +
          '<button class="save" id="pr-ok">Salvar</button>' +
        '</div>' +
      '</div>';

    backdrop.querySelector("#pr-name-i").addEventListener("input", (e) => { name = e.target.value; });

    const itemsEl = backdrop.querySelector("#pr-items");
    const packMinEl = backdrop.querySelector("#pr-pack-min");
    const packRateEl = backdrop.querySelector("#pr-pack-rate");
    const mAtacadoEl = backdrop.querySelector("#pr-m-atacado");
    const mDistEl = backdrop.querySelector("#pr-m-dist");
    const mVarejoEl = backdrop.querySelector("#pr-m-varejo");
    [itemsEl, packMinEl, mAtacadoEl, mDistEl, mVarejoEl].forEach(wireQtyInput);
    wirePriceInput(packRateEl);
    itemsEl.addEventListener("input", (e) => { itemsStr = e.target.value; });
    packMinEl.addEventListener("input", (e) => { packMinStr = e.target.value; });
    packRateEl.addEventListener("input", (e) => { packRateStr = e.target.value; });
    mAtacadoEl.addEventListener("input", (e) => { mAtacadoStr = e.target.value; });
    mDistEl.addEventListener("input", (e) => { mDistStr = e.target.value; });
    mVarejoEl.addEventListener("input", (e) => { mVarejoStr = e.target.value; });
    const porcaoEl = backdrop.querySelector("#pr-porcao");
    const medidaEl = backdrop.querySelector("#pr-medida");
    if(porcaoEl){
      wireQtyInput(porcaoEl);
      porcaoEl.addEventListener("input", (e) => { porcaoStr = e.target.value; });
      medidaEl.addEventListener("input", (e) => { medidaStr = e.target.value; });
    }
    const costEl = backdrop.querySelector("#pr-cost");
    if(costEl){
      wirePriceInput(costEl);
      costEl.addEventListener("input", (e) => { costStr = e.target.value; });
    }

    backdrop.querySelector("#pr-kind").addEventListener("change", (e) => {
      kind = e.target.value;
      draw();
    });
    if(kind === "manufaturado"){
      backdrop.querySelector("#pr-source").addEventListener("click", async () => {
        const picked = await pickReceitaModal();
        if(picked){ receita = picked; draw(); }
      });
    }else{
      backdrop.querySelector("#pr-fornecedor").addEventListener("click", async () => {
        const picked = await pickFornecedorModal();
        if(picked){ fornecedor = picked; draw(); }
      });
    }

    const close = () => { backdrop.remove(); document.removeEventListener("keydown", onKey); };
    function onKey(e){ if(e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
    backdrop.querySelector("#pr-cancel").addEventListener("click", close);

    backdrop.querySelector("#pr-ok").addEventListener("click", async () => {
      const nameEl = backdrop.querySelector("#pr-name-i");
      const name = nameEl.value.trim();
      if(!name){ fieldError(nameEl, "O nome não pode ficar vazio."); return; }
      if(kind === "manufaturado" && !receita){
        // A picker button, not a text field — the button itself carries
        // the error, same as eventos.html's cliente picker.
        fieldError(backdrop.querySelector("#pr-source"), "Escolha uma receita.");
        return;
      }
      const items = parseQtyInput(itemsEl.value);
      if(items === null){ fieldError(itemsEl, "Itens por pacote inválido."); return; }
      const payload = {
        name, kind,
        receita_id: kind === "manufaturado" ? receita.id : null,
        cost: kind === "comprado" && costEl ? (centsToPrice(priceDigits(costEl.value)) || null) : null,
        fornecedor_id: kind === "comprado" ? (fornecedor ? fornecedor.id : null) : null,
        items_per_package: items,
        packing_minutes: parseQtyInput(packMinEl.value),
        packing_labor_rate_per_hour: centsToPrice(priceDigits(packRateEl.value)),
        margin_atacado: (parseQtyInput(mAtacadoEl.value) || 0) / 100,
        margin_distribuidor: (parseQtyInput(mDistEl.value) || 0) / 100,
        margin_varejo: (parseQtyInput(mVarejoEl.value) || 0) / 100,
      };
      if(porcaoEl){
        payload.porcao_g = parseQtyInput(porcaoEl.value);
        payload.medida_caseira = medidaEl.value.trim() || null;
      }
      try{
        if(isEdit){
          await api("produto_update", Object.assign({ id: p.id }, payload));
          close();
          listToast("Produto atualizado");
          listLoaded = false;
          route.navToDetail(p.id);
        }else{
          const res = await api("produto_create", payload);
          close();
          listLoaded = false;
          route.navToDetail(res.produto.id);
        }
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadProdutos);
        listToast("Não foi possível salvar" + (e.body && e.body.error ? " (" + e.body.error + ")" : ""), true);
      }
    });

    backdrop.querySelector("#pr-name-i").focus();
  }
  draw();
}

// ---- detail screen ----
// (the embalagem picker + packaging/cost/margins/reverse-calculator panel
// is shared with receitas.html — see shared-produto-panel.js)

async function openProduto(id){
  renderShell('<p class="msg">Carregando…</p>', { detail: true });
  try{
    const data = await api("produto_detail", { id });
    if(!data.found){
      route.routeNotFound("Produto não encontrado.");
      return;
    }
    renderProduto(data);
  }catch(e){ handleAuthError(e, loadProdutos); }
}

function renderProduto(data){
  const p = data.produto;
  const embalagens = data.embalagens || [];
  const cost = data.cost;
  const incomplete = data.incomplete || [];
  const km = KIND_META[p.kind] || { label: p.kind };
  const src = p.kind === "manufaturado" ? p.receita : p.fornecedor;

  root.innerHTML = navHeader(p.name, { backLabel: "Produtos", backAction: route.navToList, listTitle: "Produtos" }) +
    '<div class="kind-src">' +
      '<span class="lbl">Tipo</span>' +
      '<span class="pill kd-' + esc(p.kind) + '">' + esc(km.label) + '</span>' +
    '</div>' +
    // The receita/fornecedor behind this produto was rendered as dead
    // text although its id is right there in the payload — reaching it
    // meant going out to the menu and searching for it by name.
    (p.kind === "manufaturado" || src
      ? '<div class="kind-src">' +
          '<span class="lbl">' + (p.kind === "manufaturado" ? "Receita" : "Fornecedor") + '</span>' +
          (src
            ? '<a class="xlink" href="' +
                (p.kind === "manufaturado" ? "receitas.html?id=" : "fornecedores.html?id=") +
                encodeURIComponent(src.id) + '">' + esc(src.name) + ' →</a>'
            : '<span>—</span>') +
        '</div>'
      : '') +
    (p.kind === "comprado"
      ? '<div class="kind-src">' +
          '<span class="lbl">Custo</span>' +
          '<span>' + (p.cost == null ? "—" : fmtMoney(p.cost)) + '</span>' +
        '</div>'
      : '') +
    '<div class="kind-src">' +
      '<span class="lbl">Itens por pacote</span>' +
      '<span>' + fmtStockQty(p.items_per_package) + '</span>' +
    '</div>' +
    (p.kind === "manufaturado" && p.porcao_g != null
      ? '<div class="kind-src">' +
          '<span class="lbl">Porção do rótulo</span>' +
          '<span>' + fmtStockQty(p.porcao_g) + ' g' +
            (p.medida_caseira ? ' (' + esc(p.medida_caseira) + ')' : '') + '</span>' +
        '</div>'
      : '') +
    '<div class="detail-actions">' +
      '<button class="primary small alt" id="edit-produto">✎ Editar</button>' +
      (p.kind === "manufaturado"
        ? '<a class="primary small alt" href="rotulagem.html?produto=' + encodeURIComponent(p.id) + '">🏷️ Gerar rótulo</a>'
        : '') +
      '<button class="primary small alt danger" id="del-produto">🗑 Remover</button>' +
    '</div>' +
    '<div id="pp-panel"></div>' +
    '<h3>Notas</h3>' +
    '<div class="card pad notes-card">' + notesPanelHtml() + '</div>';

  wireNav(route.navToList);
  wireNotesPanel(root.querySelector(".notes-card"), "produto", p.id);

  document.getElementById("edit-produto").addEventListener("click", () => openProdutoModal(p));

  document.getElementById("del-produto").addEventListener("click", async () => {
    if(!(await confirmModal('Remover o produto "' + p.name + '"?', "Remover"))) return;
    try{
      const res = await api("produto_delete", { id: p.id });
      listLoaded = false;
      listToast(res.evento_itens_unlinked > 0
        ? "Produto removido — " + res.evento_itens_unlinked + " item(ns) de evento ficaram sem produto"
        : "Produto removido");
      route.navToList();
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadProdutos);
      listToast("Não foi possível remover" + (e.body && e.body.error ? " (" + e.body.error + ")" : ""), true);
    }
  });

  renderProdutoPanel(document.getElementById("pp-panel"), {
    produto: p, embalagens, cost, incomplete,
    onChanged: () => { listLoaded = false; route.navToDetail(p.id); },
    onAuthError: (e) => handleAuthError(e, loadProdutos),
  });
}

const route = wireHistoryRoute({
  param: "id",
  openDetail: openProduto,
  renderList: showList,
});

loadProdutos();
</script>
