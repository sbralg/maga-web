<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Financeiro</title>
<!--
  Data-free shell for the Financeiro ledger — every receita and despesa
  the household side-business has, in one list. Same pattern as every
  other page here: hosted on public GitHub Pages, holds NO keys and NO
  data, asks for the shared passphrase, then talks only to the gated
  Supabase Edge Function (maga-api).

  Most rows arrive on their own: confirming a payment on Eventos
  auto-posts a receita here in the same request (source:"evento_payment"),
  which is what the 🔗 link and the muted "automático" tag point back to.
  This page also lets a cost be logged directly — rent, ingredients,
  marketing — for spending that never passed through an evento. Reports are
  future work; this is the ledger they will read from.
-->
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-page.css">
<link rel="stylesheet" href="shared-menu.css">
<link rel="stylesheet" href="shared-modal.css">
<link rel="stylesheet" href="shared-toast.css">
<link rel="stylesheet" href="shared-inputs.css">
<style>
  /* ---- page chrome (body/.wrap/header/.hleft/h1/h3/.addrow-btn) now
     lives in shared-page.css. This page has no subheader/detail view, so
     nothing else there applies here. */

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 10px;text-align:center}
  .stat .lbl{font-size:11.5px;color:var(--muted);margin:0}
  .stat .val{font-size:16px;font-weight:650;margin:4px 0 0;word-break:break-word}
  .stat.receitas .val{color:var(--ok)}
  .stat.despesas .val{color:var(--danger)}

  /* The banner shown when ?evento_id=/?cliente_id= narrows the list — what
     eventos.html's/clientes.html's "Ver no Financeiro" link points at. */
  .filter-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 12px;margin:0 0 12px;border-radius:10px;font-size:13px;
    background:rgba(var(--accent-rgb),.1);color:var(--accent);
  }
  /* Tighter than the shared 14px: this page stacks a second
     filter row (.periodrow) directly underneath. */
  .chiprow{margin:0 0 10px}
  .periodrow{display:flex;gap:8px;margin:0 0 14px}
  .periodrow select{
    flex:1;font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
  }

  .entry{
    display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
    border-bottom:1px solid var(--border);border-left:3px solid transparent;
  }
  .entry:last-child{border-bottom:none}
  .entry.receita{border-left-color:var(--ok);background:rgba(22,163,74,.05)}
  .entry.despesa{border-left-color:var(--danger);background:var(--tint)}
  .entry .body{flex:1;min-width:0}
  .entry .body .txt{font-size:14.5px;margin:0;word-wrap:break-word}
  .entry .body .meta{font-size:12.5px;color:var(--muted);margin:3px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .entry .cat{
    display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;
    background:rgba(127,127,127,.12);color:var(--muted);
  }
  .entry .auto{font-size:11px;color:var(--muted);font-style:italic}
  .entry .amt{font-size:14.5px;font-weight:650;white-space:nowrap;flex:none}
  .entry.receita .amt{color:var(--ok)}
  .entry.despesa .amt{color:var(--danger)}
  .entry .row-actions{display:flex;gap:2px;flex:none}
</style>
</head>
<body>
<div id="root" class="wrap"><p class="msg">Carregando…</p></div>

<script>
const root = document.getElementById("root");
let lancamentos = [];
let totals = { total_receitas: 0, total_despesas: 0, saldo: 0 };
let tipoFilter = "";
let periodo = "all";
let searchTerm = "";
// Set from ?evento_id=/?cliente_id= at load — what eventos.html's "Ver no
// Financeiro" link and clientes.html's own equivalent point at. Kept (not
// stripped like consumeDeepLink()'s ?id=) so reload/back-forward preserve
// the filtered view; "Ver tudo" below is the explicit way out of it.
const filterParams = new URLSearchParams(location.search);
const filterEventoId = filterParams.get("evento_id") || "";
const filterClienteId = filterParams.get("cliente_id") || "";

const PAGE_LOGIN = {
  title: "Financeiro",
  subtitle: "Faça o seu login para acessar.",
  onSuccess: () => loadLancamentos(),
};
</script>
<script src="shared-api.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-nav.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-format.js"></script>
<script src="shared-inputs.js"></script>
<script src="shared-pwa.js"></script>
<script>

const CURRENT_PAGE = "financeiro";

const CATEGORIA_SUGGESTOES = ["aluguel", "ingredientes", "marketing", "taxas", "evento", "outros"];

// Client-side only: the boundaries just decide which date_from/date_to get
// sent to financeiro_lancamentos, same fetch either way.
function periodRange(p){
  const now = new Date();
  if(p === "all") return {};
  const startOfMonth = (y, m) => new Date(y, m, 1).toISOString();
  if(p === "this"){
    return { date_from: startOfMonth(now.getFullYear(), now.getMonth()) };
  }
  // last calendar month
  const from = startOfMonth(now.getFullYear(), now.getMonth() - 1);
  const to = startOfMonth(now.getFullYear(), now.getMonth());
  return { date_from: from, date_to: to };
}

// navHeader()/wireNav() now live in shared-nav.js. This page never has a
// subheader (no detail view), so navHeader("Financeiro") with no opts is
// the plain top-row-only render.

// renderShell(): keeps the header (hamburger) on screen through the load
// instead of wiping it with a bare "Carregando…" — see preferencias.html's
// own renderShell() for the same reasoning. This page has no detail
// screen, so there is only ever the one shell shape.
function renderShell(inner){
  root.innerHTML = navHeader("Financeiro") + inner;
  wireNav();
}

async function loadLancamentos(){
  if(!getPass()){ showLogin(); return; }
  renderShell('<p class="msg">Carregando…</p>');
  try{
    const filter = Object.assign(periodRange(periodo),
      filterEventoId ? { evento_id: filterEventoId } : {},
      filterClienteId ? { cliente_id: filterClienteId } : {});
    const data = await api("financeiro_lancamentos", filter);
    lancamentos = data.lancamentos || [];
    totals = {
      total_receitas: data.total_receitas || 0,
      total_despesas: data.total_despesas || 0,
      saldo: data.saldo || 0,
    };
    render();
    consumeDeepLink();
  }catch(e){ handleAuthError(e, loadLancamentos); }
}

// ?id=<lançamento id> opens that entry's edit modal — what the evento and
// cliente cross-links point at. Consumed once and cleaned off the URL:
// this page has no detail SCREEN, only a modal over the list, so a param
// left in place would reopen the modal on every later re-render.
// The list is period-filtered, so an id outside the current período is a
// real miss and says so rather than silently doing nothing.
function consumeDeepLink(){
  const wanted = new URLSearchParams(location.search).get("id");
  if(!wanted) return;
  history.replaceState(null, "", location.pathname);
  const l = lancamentos.find(x => x.id === wanted);
  if(l) openLancModal(l);
  else listToast("Lançamento não encontrado neste período.", true);
}

function matchesSearch(l, term){
  if(!term) return true;
  const t = foldSearchText(term);
  return [l.description, l.categoria].some(
    v => foldSearchText(v).indexOf(t) >= 0);
}

function entryRowHtml(l){
  const sign = l.tipo === "receita" ? "+" : "−";
  const linkHtml = l.evento_id
    ? '<a class="link" href="eventos.html?id=' + encodeURIComponent(l.evento_id) + '">🔗 evento</a>'
    : '';
  const autoHtml = l.source && l.source !== "manual"
    ? '<span class="auto">automático</span>' : '';
  return '<div class="entry ' + l.tipo + '" data-id="' + esc(l.id) + '">' +
    '<span class="body">' +
      '<p class="txt">' + esc(l.description) + '</p>' +
      '<p class="meta">' +
        '<span class="cat">' + esc(l.categoria) + '</span>' +
        '<span>' + esc(fmtDate(l.occurred_at)) + '</span>' +
        linkHtml + autoHtml +
      '</p>' +
    '</span>' +
    '<span class="amt">' + sign + ' ' + fmtMoney(l.amount) + '</span>' +
    '<span class="row-actions">' +
      '<button class="icon-btn" data-edit title="Editar">✎</button>' +
      '<button class="icon-btn danger" data-del title="Remover">🗑</button>' +
    '</span>' +
  '</div>';
}

function render(){
  const shown = lancamentos.filter(l => (!tipoFilter || l.tipo === tipoFilter) && matchesSearch(l, searchTerm));

  // The evento's own name comes along embedded on any row that has one
  // (LANCAMENTO_COLS' evento:eventos(id,name)) — cheaper than a second
  // round trip just to label the banner. A cliente filter has no such
  // embed (lançamentos don't carry a cliente directly), so that banner
  // stays generic.
  const filterHtml = (filterEventoId || filterClienteId)
    ? '<div class="filter-banner">' +
        '<span>Filtrado por ' +
          (filterEventoId
            ? 'evento' + (lancamentos[0] && lancamentos[0].evento ? ': ' + esc(lancamentos[0].evento.name) : '')
            : 'cliente') +
        '</span>' +
        '<a class="link" href="financeiro.html">Ver tudo</a>' +
      '</div>'
    : '';

  const statsHtml = '<div class="stats">' +
    '<div class="stat receitas"><p class="lbl">Receitas</p><p class="val">' + fmtMoney(totals.total_receitas) + '</p></div>' +
    '<div class="stat despesas"><p class="lbl">Despesas</p><p class="val">' + fmtMoney(totals.total_despesas) + '</p></div>' +
    '<div class="stat"><p class="lbl">Saldo</p><p class="val">' + fmtMoney(totals.saldo) + '</p></div>' +
  '</div>';

  const chips = '<div class="chiprow">' +
    '<button type="button" class="chip' + (tipoFilter === "" ? " active" : "") + '" aria-pressed="' + (tipoFilter === "" ? "true" : "false") + '" data-tipo="">Todos</button>' +
    '<button type="button" class="chip' + (tipoFilter === "receita" ? " active" : "") + '" aria-pressed="' + (tipoFilter === "receita" ? "true" : "false") + '" data-tipo="receita">Receitas</button>' +
    '<button type="button" class="chip' + (tipoFilter === "despesa" ? " active" : "") + '" aria-pressed="' + (tipoFilter === "despesa" ? "true" : "false") + '" data-tipo="despesa">Despesas</button>' +
  '</div>';

  const searchHtml = '<div class="searchrow">' +
    '<input type="search" id="search" placeholder="Buscar por descrição ou categoria" ' +
      'value="' + esc(searchTerm) + '">' +
  '</div>';

  const periodHtml = '<div class="periodrow">' +
    '<select id="periodo">' +
      '<option value="all"' + (periodo === "all" ? " selected" : "") + '>Tudo</option>' +
      '<option value="this"' + (periodo === "this" ? " selected" : "") + '>Este mês</option>' +
      '<option value="last"' + (periodo === "last" ? " selected" : "") + '>Mês passado</option>' +
    '</select>' +
  '</div>';

  const rowsHtml = lancamentos.length === 0
    ? '<p class="msg">' + ((filterEventoId || filterClienteId)
        ? 'Nenhum lançamento para este ' + (filterEventoId ? 'evento' : 'cliente') + '.'
        : 'Nenhum lançamento ainda. Toque em "+ Novo lançamento" para começar.') + '</p>'
    : (shown.length === 0
        ? '<p class="msg" id="no-match">Nenhum lançamento neste filtro.</p>'
        : '<div class="card" id="list-card">' + shown.map(entryRowHtml).join("") + '</div>');

  root.innerHTML = navHeader("Financeiro") + filterHtml + statsHtml + chips + searchHtml + periodHtml + rowsHtml +
    '<button class="primary full addrow-btn" id="new-lanc">+ Novo lançamento</button>';

  wireNav();

  document.getElementById("periodo").addEventListener("change", (e) => {
    periodo = e.target.value;
    loadLancamentos();
  });
  root.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      tipoFilter = chip.dataset.tipo;
      redraw();
    });
  });
  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    searchTerm = search.value.trim();
    redraw();
  });
  wireRows();
  document.getElementById("new-lanc").addEventListener("click", () => openLancModal(null));
}

function redraw(){
  const shown = lancamentos.filter(l => (!tipoFilter || l.tipo === tipoFilter) && matchesSearch(l, searchTerm));
  root.querySelectorAll(".chip").forEach(chip =>
    chip.classList.toggle("active", chip.dataset.tipo === tipoFilter));
  const card = document.getElementById("list-card") || document.getElementById("no-match");
  const html = shown.length === 0
    ? '<p class="msg" id="no-match">Nenhum lançamento neste filtro.</p>'
    : '<div class="card" id="list-card">' + shown.map(entryRowHtml).join("") + '</div>';
  if(card){
    card.outerHTML = html;
    wireRows();
  }
}

function wireRows(){
  root.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.closest(".entry").dataset.id;
      openLancModal(lancamentos.find(l => l.id === id));
    });
  });
  root.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if(!(await confirmModal("Remover este lançamento?"))) return;
      const id = btn.closest(".entry").dataset.id;
      try{
        await api("financeiro_lancamento_delete", { id });
        listToast("Lançamento removido");
        loadLancamentos();
      }catch(e){
        if(e.unauthorized) return handleAuthError(e, loadLancamentos);
        listToast("Não foi possível remover" + (e.body && e.body.error ? " (" + e.body.error + ")" : ""), true);
      }
    });
  });
}

function openLancModal(l){
  const isEdit = !!l;
  const dateVal = isEdit ? l.occurred_at.slice(0,10) : new Date().toISOString().slice(0,10);
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal-card">' +
      '<h3>' + (isEdit ? "Editar lançamento" : "Novo lançamento") + '</h3>' +
      '<label>Tipo</label>' +
      '<div class="chiprow" id="lanc-tipo-chips">' +
        '<button type="button" class="chip' + (!isEdit || l.tipo === "despesa" ? " active" : "") + '" aria-pressed="' + (!isEdit || l.tipo === "despesa" ? "true" : "false") + '" data-tipo="despesa">Despesa</button>' +
        '<button type="button" class="chip' + (isEdit && l.tipo === "receita" ? " active" : "") + '" aria-pressed="' + (isEdit && l.tipo === "receita" ? "true" : "false") + '" data-tipo="receita">Receita</button>' +
      '</div>' +
      '<label for="lanc-amount">Valor</label>' +
      '<span class="field" style="width:100%;margin-bottom:14px">' +
        '<span class="prefix">R$</span>' +
        '<input class="num-input" type="text" inputmode="numeric" id="lanc-amount" ' +
          'style="flex:1 1 auto;width:auto" value="' + esc(isEdit ? fmtPriceInput(l.amount) : "") + '">' +
      '</span>' +
      '<label for="lanc-categoria">Categoria</label>' +
      '<input type="text" id="lanc-categoria" list="lanc-cat-list" ' +
        'value="' + esc(isEdit ? l.categoria : "") + '" placeholder="ex: ingredientes">' +
      '<datalist id="lanc-cat-list">' +
        CATEGORIA_SUGGESTOES.map(c => '<option value="' + esc(c) + '">').join("") +
      '</datalist>' +
      '<label for="lanc-desc">Descrição</label>' +
      '<input type="text" id="lanc-desc" value="' + esc(isEdit ? l.description : "") + '">' +
      '<label for="lanc-date">Data</label>' +
      '<input type="date" id="lanc-date" value="' + esc(dateVal) + '" ' +
        'style="width:100%;margin-bottom:14px;padding:10px 12px;border-radius:10px;' +
        'border:1px solid var(--border-strong);background:var(--card);color:var(--text)">' +
      '<label for="lanc-note">Nota (opcional)</label>' +
      '<input type="text" id="lanc-note" value="' + esc(isEdit ? (l.note || "") : "") + '">' +
      '<div class="modal-actions">' +
        '<button class="cancel" id="lanc-cancel">Cancelar</button>' +
        '<button class="save" id="lanc-ok">Salvar</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  const amountEl = backdrop.querySelector("#lanc-amount");
  wirePriceInput(amountEl);
  let tipo = isEdit ? l.tipo : "despesa";
  backdrop.querySelectorAll("#lanc-tipo-chips .chip").forEach(chip => {
    chip.addEventListener("click", () => {
      tipo = chip.dataset.tipo;
      backdrop.querySelectorAll("#lanc-tipo-chips .chip").forEach(c => {
          c.classList.toggle("active", c === chip);
          c.setAttribute("aria-pressed", c === chip ? "true" : "false");
        });
    });
  });

  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
  };
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
  backdrop.querySelector("#lanc-cancel").addEventListener("click", close);

  const descEl = backdrop.querySelector("#lanc-desc");
  const dateEl = backdrop.querySelector("#lanc-date");
  backdrop.querySelector("#lanc-ok").addEventListener("click", async () => {
    const amount = centsToPrice(priceDigits(amountEl.value));
    if(!amount || amount <= 0){ fieldError(amountEl, "Informe um valor válido."); return; }
    const description = descEl.value.trim();
    if(!description){ fieldError(descEl, "A descrição não pode ficar vazia."); return; }
    const date = dateEl.value;
    if(!date){ fieldError(dateEl, "Informe a data."); return; }
    const payload = {
      tipo, amount, description,
      categoria: backdrop.querySelector("#lanc-categoria").value.trim() || "outros",
      occurred_at: new Date(date + "T12:00:00").toISOString(),
      note: backdrop.querySelector("#lanc-note").value.trim() || null,
    };
    try{
      if(isEdit){
        await api("financeiro_lancamento_update", Object.assign({ id: l.id }, payload));
      }else{
        await api("financeiro_lancamento_create", payload);
      }
      close();
      listToast(isEdit ? "Lançamento atualizado" : "Lançamento criado");
      loadLancamentos();
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadLancamentos);
      listToast("Não foi possível salvar" + (e.body && e.body.error ? " (" + e.body.error + ")" : ""), true);
    }
  });

  backdrop.querySelector("#lanc-desc").focus();
}

loadLancamentos();
</script>
</body>
</html>
