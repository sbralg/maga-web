<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fornecedores">
<meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>Fornecedores</title>
<!--
  Data-free shell for the Fornecedores module — who the household buys
  from. Same pattern as every other page here: hosted on public GitHub
  Pages, holds NO keys and NO data, asks for the shared passphrase, then
  talks only to the gated Supabase Edge Function (maga-api).

  Deliberately minimal fields (name/phone/email), plus a dated Notas
  notebook (shared-notes.js). Two SEPARATE
  fornecedor relationships show on the detail page: "Produtos"
  (produtos.fornecedor_id — comprado items priced directly by hand, this
  is purely reference metadata, not a costing input) and "Compras"
  (every inbound stock_movements row tagged with this fornecedor_id,
  joined to the insumo for its name — pantry INGREDIENT purchases, no
  separate table). A comprado item is created from here via "+ Novo
  Produto", which hands off to produtos.html with the fornecedor preset.

  "Enviar WhatsApp" is a wa.me deep link, not a send API — same reasoning
  and same limitation as clientes.html: this household's WhatsApp bridge is
  LAN-only and unreachable from this Edge Function.
-->
<link rel="stylesheet" href="shared-base.css">
<link rel="stylesheet" href="shared-page.css">
<link rel="stylesheet" href="shared-menu.css">
<link rel="stylesheet" href="shared-modal.css">
<link rel="stylesheet" href="shared-toast.css">
<link rel="stylesheet" href="shared-inputs.css">
<link rel="stylesheet" href="shared-notes.css">
<style>
  /* ---- page chrome (body/.wrap/header/.hleft/h1/h3/.subheader/.searchrow/
     .row shell/.detail-actions/.addrow-btn/.detail-title) now lives in
     shared-page.css — see that file for what moved and why. Only the
     genuinely page-specific part of .row (its flex layout, not the
     shell) stays here — .row .nm/.row .meta are pure duplicates of
     shared-page.css's own rules and are gone. */
  .row{display:flex;flex-direction:column;gap:4px}
  /* ---- detail ---- */
  .infofield{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:10px 0;border-top:1px solid var(--border);
  }
  .infofield .lbl{font-size:12px;color:var(--muted);margin:0;flex:none}
  .infofield .val{font-size:14px;text-align:right;word-break:break-word}
  .infofield .val.empty{color:var(--muted);font-style:italic}
  .buy-row{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding:12px 14px;border-bottom:1px solid var(--border);
  }
  .buy-row:last-child{border-bottom:none}
  .buy-row .body{flex:1;min-width:0}
  .buy-row .body .txt{font-size:14.5px;margin:0;word-wrap:break-word}
  .buy-row .body .meta{font-size:12.5px;color:var(--muted);margin:3px 0 0}
  .buy-row .amt{font-size:14.5px;font-weight:650;white-space:nowrap;flex:none}
  /* ---- WhatsApp compose ---- */
  .wa-card{padding:14px}
  .wa-card textarea{
    width:100%;min-height:76px;resize:vertical;font:inherit;font-size:14px;
    padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);
    background:var(--bg);color:var(--text);box-sizing:border-box;
  }
  .wa-send{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    margin-top:10px;padding:13px 16px;border-radius:12px;border:none;
    background:#25d366;color:#fff;font:inherit;font-size:15px;font-weight:650;
    text-decoration:none;cursor:pointer;transition:opacity .15s ease,filter .15s ease;
  }
  .wa-send:hover{filter:brightness(1.06)}
  .wa-hint{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div id="root" class="wrap"><p class="msg">Carregando…</p></div>

<script>
const root = document.getElementById("root");
let fornecedores = [];
let searchTerm = "";

const PAGE_LOGIN = {
  title: "Fornecedores",
  subtitle: "Faça o seu login para acessar.",
  onSuccess: () => loadFornecedores(),
};
</script>
<script src="shared-api.js"></script>
<script src="shared-menu.js"></script>
<script src="shared-nav.js"></script>
<script src="shared-history.js"></script>
<script src="shared-ui.js"></script>
<script src="shared-format.js"></script>
<script src="shared-notes.js"></script>
<script src="shared-pwa.js"></script>
<script>

const CURRENT_PAGE = "fornecedores";

// navHeader()/wireNav() now live in shared-nav.js. This page's title uses
// the shared "detail-title" class/id (formerly this page's own .forn-title
// / #forn-name) — see the click handler further down.

// Same reasoning as clientes.html's waPhoneDigits — a 10/11-digit number
// reads as Brazilian local (DDD + phone) and gets 55 prepended; 12+ digits
// already carries a country code; anything shorter is refused rather than
// guessed at.
function waPhoneDigits(phone){
  let d = String(phone || "").replace(/\D/g, "");
  if(d.length === 10 || d.length === 11) d = "55" + d;
  return d.length >= 12 ? d : "";
}

// renderShell(): keeps the header (hamburger, back link) on screen through
// every load instead of wiping it with a bare "Carregando…" — see
// preferencias.html's own renderShell() for the same reasoning. opts.detail
// renders the DETAIL shell (back link to Fornecedores, title empty until
// the record loads), i.e. the shell for the screen being navigated TO.
function renderShell(inner, opts){
  if(opts && opts.detail){
    root.innerHTML = navHeader("", { backLabel: "Fornecedores", backAction: route.navToList, listTitle: "Fornecedores" }) + inner;
    wireNav(route.navToList);
  }else{
    root.innerHTML = navHeader("Fornecedores") + inner;
    wireNav(null);
  }
}

// ---- list screen ----

// listLoaded, not fornecedores.length, is what says whether the in-memory
// list is trustworthy. showList() is what the router renders for the list
// screen and it must NOT re-fetch on every Back — but a create/delete
// invalidates the cache, and an account with genuinely zero fornecedores
// must not look like a cache miss and re-fetch forever.
let listLoaded = false;

async function loadFornecedores(){
  if(!getPass()){ showLogin(); return; }
  renderShell('<p class="msg">Carregando…</p>');
  try{
    const data = await api("fornecedores");
    fornecedores = data.fornecedores || [];
    listLoaded = true;
    route.routeFromUrl();
  }catch(e){ handleAuthError(e, loadFornecedores); }
}

// Paint from memory FIRST, then reconcile in the background. Re-fetching
// synchronously on every Back would put a "Carregando…" flash on the most
// common gesture in the app — the exact thing phase 1 removed from every
// page — and would cost a round trip in a supermarket aisle. Rendering
// from cache alone would instead go stale the moment another device (or
// the MCP tools) writes a fornecedor. This does both: instant paint, and a
// silent re-render only if the data actually moved.
function showList(){
  if(!listLoaded) return loadFornecedores();
  renderList();
  refreshList();
}

let refreshing = false;
async function refreshList(){
  if(refreshing) return;
  refreshing = true;
  try{
    const data = await api("fornecedores");
    const next = data.fornecedores || [];
    if(JSON.stringify(next) !== JSON.stringify(fornecedores)){
      fornecedores = next;
      // Only repaint if the list is still the screen being shown — a fast
      // Back-then-tap could have opened a detail while this was in flight.
      if(!new URLSearchParams(location.search).get("id")) renderList();
    }
  }catch(_){
    // A failed background refresh leaves the cached list on screen. There
    // is nothing useful to tell the user: what they are looking at is the
    // last known good state, and any action they take still reports its
    // own failure.
  }finally{ refreshing = false; }
}

function matchesSearch(f, term){
  if(!term) return true;
  const t = foldSearchText(term);
  return [f.name, f.phone, f.email].some(v => foldSearchText(v).indexOf(t) >= 0);
}

// A real <button>, not a <div> + click handler: this is the app's primary
// navigation and it has to be reachable by keyboard. <button> takes
// phrasing content only, so the old <p>s are <span>s (blocked out by
// shared-page.css's .row .nm/.meta rules).
function fornecedorRowHtml(f){
  const meta = [f.phone, f.email].filter(Boolean).join(" · ");
  return '<button type="button" class="row" data-id="' + esc(f.id) + '">' +
    '<span class="nm">' + esc(f.name) + '</span>' +
    (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') +
  '</button>';
}

function renderList(){
  const shown = fornecedores.filter(f => matchesSearch(f, searchTerm));
  const rowsHtml = fornecedores.length === 0
    ? '<p class="msg">Nenhum fornecedor ainda. Toque em "+ Novo fornecedor" para começar.</p>'
    : (shown.length === 0
        ? '<p class="msg" id="no-match">Nenhum fornecedor encontrado.</p>'
        : '<div class="card" id="list-card">' + shown.map(fornecedorRowHtml).join("") + '</div>');

  root.innerHTML = navHeader("Fornecedores") +
    '<div class="searchrow">' +
      '<input type="search" id="search" placeholder="Buscar por nome, telefone ou e-mail" ' +
        'value="' + esc(searchTerm) + '">' +
    '</div>' +
    rowsHtml +
    '<button class="primary full addrow-btn" id="new-fornecedor">+ Novo fornecedor</button>';

  wireNav(null);

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    searchTerm = search.value.trim();
    redrawList();
  });
  wireListRows();
  document.getElementById("new-fornecedor").addEventListener("click", () => openFornecedorModal(null));
}

function redrawList(){
  const shown = fornecedores.filter(f => matchesSearch(f, searchTerm));
  const card = document.getElementById("list-card") || document.getElementById("no-match");
  const html = shown.length === 0
    ? '<p class="msg" id="no-match">Nenhum fornecedor encontrado.</p>'
    : '<div class="card" id="list-card">' + shown.map(fornecedorRowHtml).join("") + '</div>';
  if(card){
    card.outerHTML = html;
    wireListRows();
  }
}

function wireListRows(){
  root.querySelectorAll(".row[data-id]").forEach(row => {
    row.addEventListener("click", () => route.navToDetail(row.dataset.id));
  });
}

// ---- create/edit modal ----

function openFornecedorModal(f){
  const isEdit = !!f;
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal-card">' +
      '<h3>' + (isEdit ? "Editar fornecedor" : "Novo fornecedor") + '</h3>' +
      '<label for="forn-name-i">Nome</label>' +
      '<input type="text" id="forn-name-i" value="' + esc(isEdit ? f.name : "") + '">' +
      '<label for="forn-phone">Telefone / WhatsApp (opcional)</label>' +
      '<input type="text" id="forn-phone" inputmode="tel" placeholder="ex: (11) 99445-2426" ' +
        'value="' + esc(isEdit ? (f.phone || "") : "") + '">' +
      '<label for="forn-email">E-mail (opcional)</label>' +
      '<input type="text" id="forn-email" inputmode="email" value="' + esc(isEdit ? (f.email || "") : "") + '">' +
      '<div class="modal-actions">' +
        '<button class="cancel" id="forn-cancel">Cancelar</button>' +
        '<button class="save" id="forn-ok">Salvar</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  const close = () => {
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
  };
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", e => { if(e.target === backdrop) close(); });
  backdrop.querySelector("#forn-cancel").addEventListener("click", close);

  const nameEl = backdrop.querySelector("#forn-name-i");
  backdrop.querySelector("#forn-ok").addEventListener("click", async () => {
    const name = nameEl.value.trim();
    if(!name){ fieldError(nameEl, "O nome não pode ficar vazio."); return; }
    const payload = {
      name,
      phone: backdrop.querySelector("#forn-phone").value.trim() || null,
      email: backdrop.querySelector("#forn-email").value.trim() || null,
    };
    try{
      if(isEdit){
        await api("fornecedor_update", Object.assign({ id: f.id }, payload));
        close();
        listToast("Fornecedor atualizado");
        listLoaded = false;
        route.navToDetail(f.id);
      }else{
        const res = await api("fornecedor_create", payload);
        close();
        listLoaded = false;
        route.navToDetail(res.fornecedor.id);
      }
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadFornecedores);
      listToast("Não foi possível salvar" + (e.body && e.body.error ? " (" + e.body.error + ")" : ""), true);
    }
  });

  backdrop.querySelector("#forn-name-i").focus();
}

// ---- detail screen ----

async function openFornecedor(id){
  renderShell('<p class="msg">Carregando…</p>', { detail: true });
  try{
    const data = await api("fornecedor_detail", { id });
    if(!data.found){
      route.routeNotFound("Fornecedor não encontrado.");
      return;
    }
    renderFornecedor(data);
  }catch(e){ handleAuthError(e, loadFornecedores); }
}

function infoFieldHtml(label, value){
  return '<div class="infofield">' +
    '<span class="lbl">' + esc(label) + '</span>' +
    '<span class="val' + (value ? '' : ' empty') + '">' + esc(value || "—") + '</span>' +
  '</div>';
}

// "50× Croissant, R$2,50/un, 20/08" — delta is the quantity purchased
// (always positive here, since fornecedor_detail only ever returns inbound
// movements), unit_cost is what that batch cost per package.
function buyRowHtml(m){
  const item = m.insumo || {};
  const meta = [fmtDateTime(m.occurred_at)];
  if(item.brand) meta.push(item.brand);
  if(m.note) meta.push(m.note);
  // The insumo's own gtin is already in fornecedor_detail's payload
  // ("insumo:insumos(gtin,name,...)"), so this row knows exactly which
  // catalogue entry it is about — it just used to render it as dead text.
  const nameHtml = item.gtin
    ? '<a class="xlink" href="insumos.html?gtin=' + encodeURIComponent(item.gtin) + '">' +
        esc(item.name || "?") + ' →</a>'
    : esc(item.name || "?");
  return '<div class="buy-row">' +
    '<span class="body">' +
      '<p class="txt">' + fmtStockQty(m.delta) + '× ' + nameHtml + '</p>' +
      '<p class="meta">' + esc(meta.join(" · ")) + '</p>' +
    '</span>' +
    '<span class="amt">' + (m.unit_cost == null ? "—" : fmtMoney(m.unit_cost) + "/un") + '</span>' +
  '</div>';
}

// A comprado Produto sourced from this fornecedor — directly answers
// "what do I buy from this supplier", separate from the pantry purchase
// history below (that's about recipe ingredients, this is about sellable
// items — see maga-api's module comment above produtoCostFor).
// Also a real <button> — it navigates (to produtos.html) exactly like the
// fornecedor rows above, just via location.href instead of the router,
// since a produto lives on a different page.
function produtoRowHtml(p){
  return '<button type="button" class="row" data-produto="' + esc(p.id) + '">' +
    '<span class="nm">' + esc(p.name) + '</span>' +
    '<span class="meta">' + (p.cost == null ? "sem custo informado" : fmtMoney(p.cost)) + '</span>' +
  '</button>';
}

function renderFornecedor(data){
  const f = data.fornecedor;
  const produtos = data.produtos || [];
  const purchases = data.purchases || [];
  const produtosHtml = produtos.length === 0
    ? '<p class="msg small">Nenhum produto cadastrado ainda.</p>'
    : '<div class="card" id="forn-produtos-list">' + produtos.map(produtoRowHtml).join("") + '</div>';
  const purchasesHtml = purchases.length === 0
    ? '<p class="msg small">Nenhuma compra registrada ainda.</p>'
    : '<div class="card">' + purchases.map(buyRowHtml).join("") + '</div>';

  const waDigits = waPhoneDigits(f.phone);

  root.innerHTML = navHeader(f.name, { backLabel: "Fornecedores", backAction: route.navToList, listTitle: "Fornecedores" }) +
    infoFieldHtml("Telefone", f.phone) +
    infoFieldHtml("E-mail", f.email) +
    '<div class="detail-actions">' +
      '<button class="primary small alt" id="edit-forn">✎ Editar</button>' +
      '<button class="primary small alt danger" id="del-forn">🗑 Remover</button>' +
    '</div>' +
    '<h3>Produtos</h3>' + produtosHtml +
    '<button class="primary small alt addrow-btn" id="new-produto">+ Novo Produto</button>' +
    '<h3>💬 WhatsApp</h3>' +
    '<div class="card wa-card">' +
      (waDigits
        ? '<textarea id="wa-text" placeholder="Digite a mensagem…"></textarea>' +
          '<a class="wa-send" id="wa-send" target="_blank" rel="noopener">Abrir contato no WhatsApp</a>'
        : '<p class="wa-hint">Adicione um telefone ao fornecedor para enviar mensagens pelo WhatsApp.</p>') +
    '</div>' +
    '<h3>Compras (insumos)</h3>' + purchasesHtml +
    '<h3>Notas</h3>' +
    '<div class="card pad notes-card">' + notesPanelHtml() + '</div>';

  wireNav(route.navToList);
  wireNotesPanel(root.querySelector(".notes-card"), "fornecedor", f.id);

  document.getElementById("edit-forn").addEventListener("click", () => openFornecedorModal(f));

  document.getElementById("new-produto").addEventListener("click", () => {
    location.href = "produtos.html?new=1&fornecedor_id=" + encodeURIComponent(f.id);
  });
  root.querySelectorAll(".row[data-produto]").forEach(row => {
    row.addEventListener("click", () => {
      location.href = "produtos.html?id=" + encodeURIComponent(row.dataset.produto);
    });
  });

  document.getElementById("del-forn").addEventListener("click", async () => {
    try{
      let res = await api("fornecedor_delete", { id: f.id });
      if(res.ok === false && res.reason === "has_history"){
        const parts = [];
        if(res.produtos > 0) parts.push(res.produtos + " produto(s)");
        if(res.movements > 0) parts.push(res.movements + " compra(s) de insumo");
        if(!(await confirmModal(
          'Este fornecedor tem ' + parts.join(" e ") + ' registrado(s). Removê-lo mantém tudo, ' +
          'apenas sem o vínculo com o fornecedor. Não dá para desfazer.',
          "Remover mesmo assim"))) return;
        res = await api("fornecedor_delete", { id: f.id, force: true });
      }
      listLoaded = false;
      // fornecedor_delete reports what it unlinked (produtos_unlinked /
      // movements_unlinked). Saying so closes the loop on the warning the
      // person just accepted — this used to be a ternary whose two
      // branches were the same string, so the counts were fetched and
      // thrown away.
      const undone = [];
      if(res.produtos_unlinked > 0) undone.push(res.produtos_unlinked + " produto(s)");
      if(res.movements_unlinked > 0) undone.push(res.movements_unlinked + " compra(s)");
      listToast(undone.length
        ? "Fornecedor removido — " + undone.join(" e ") + " sem vínculo"
        : "Fornecedor removido");
      route.navToList();
    }catch(e){
      if(e.unauthorized) return handleAuthError(e, loadFornecedores);
      listToast("Não foi possível remover" + (e.body && e.body.error ? " (" + e.body.error + ")" : ""), true);
    }
  });

  if(waDigits){
    const textEl = document.getElementById("wa-text");
    const sendEl = document.getElementById("wa-send");
    const updateHref = () => {
      const msg = textEl.value.trim();
      if(!msg){
        sendEl.textContent = "Abrir contato no WhatsApp";
        sendEl.href = "https://wa.me/" + waDigits;
        return;
      }
      sendEl.textContent = "Enviar pelo WhatsApp";
      sendEl.href = "https://wa.me/" + waDigits + "?text=" + encodeURIComponent(msg);
    };
    textEl.addEventListener("input", updateHref);
    updateHref();
  }
}

const route = wireHistoryRoute({
  param: "id",
  openDetail: openFornecedor,
  renderList: showList,
});

loadFornecedores();
</script>
</body>
</html>
